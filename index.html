  toolbar.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;";
  const selectAllBtn = document.createElement('button');
  selectAllBtn.className = "btn btn-secondary";
  selectAllBtn.style.padding = "8px 16px";
  selectAllBtn.style.fontSize = "12.5px";
  selectAllBtn.textContent = graphicsSelected.size === GRAPHICS.length ? "Deselect all" : "Select all";
  selectAllBtn.onclick = () => {
    if(graphicsSelected.size === GRAPHICS.length) graphicsSelected.clear();
    else GRAPHICS.forEach((g,i)=>graphicsSelected.add(i));
    render();
  };
  toolbar.appendChild(selectAllBtn);

  const downloadZipBtn = document.createElement('button');
  downloadZipBtn.className = "btn btn-primary";
  downloadZipBtn.style.padding = "8px 18px";
  downloadZipBtn.style.fontSize = "12.5px";
  downloadZipBtn.textContent = graphicsSelected.size
    ? (graphicsSelected.size === 1 ? "Download this graphic" : `Download ${graphicsSelected.size} selected`)
    : "Select graphics to download";
  downloadZipBtn.disabled = graphicsSelected.size === 0;
  downloadZipBtn.style.opacity = graphicsSelected.size === 0 ? "0.5" : "1";
  downloadZipBtn.onclick = async () => {
    // One file after another (no ZIP, easier on phones). A short pause between
    // files keeps phones from skipping any.
    const picks = [...graphicsSelected].map(i => GRAPHICS[i]);
    for(let n = 0; n < picks.length; n++){
      const g = picks[n];
      downloadZipBtn.textContent = picks.length > 1 ? `Downloading ${n+1} of ${picks.length}…` : "Downloading…";
      const a = document.createElement('a');
      a.href = g.src; a.download = g.file;
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise(r => setTimeout(r, 700));
    }
    showToast(picks.length > 1 ? "Downloaded " + picks.length + " graphics!" : "Downloading!");
    render();
  };
  toolbar.appendChild(downloadZipBtn);
  card.appendChild(toolbar);

  const grid = document.createElement('div');
  grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;";
  GRAPHICS.forEach((g,i)=>{
    const tile = document.createElement('div');
    const isSelected = graphicsSelected.has(i);
    tile.style.cssText = `border:2px solid ${isSelected ? 'var(--terracotta)' : 'rgba(12,30,61,0.12)'};border-radius:12px;padding:10px;background:${isSelected ? 'var(--peach)' : 'var(--cream)'};cursor:pointer;transition:all .15s ease;display:flex;flex-direction:column;align-items:center;gap:8px;`;
    tile.innerHTML = `
      <img src="${g.src.replace('assets/','assets/thumbs/')}" loading="lazy" style="width:100%;height:110px;object-fit:contain;">
      <div style="font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:600;color:var(--navy);text-align:center;">${g.name}</div>
    `;
    tile.onclick = (e) => {
      if(e.target.tagName === 'A') return;
      if(isSelected) graphicsSelected.delete(i); else graphicsSelected.add(i);
      render();
    };
    const dl = document.createElement('a');
    dl.href = g.src; dl.download = g.file;
    dl.textContent = "Download";
    dl.style.cssText = "font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;color:var(--terracotta);text-decoration:none;border:1px solid var(--terracotta);border-radius:999px;padding:4px 12px;";
    tile.appendChild(dl);
    grid.appendChild(tile);
  });
  card.appendChild(grid);

  const link = document.createElement('div');
  link.className = "home-link";
  link.textContent = currentAuthor ? "Return to home" : "Back";
  link.onclick = () => { currentScreen = currentAuthor ? "home" : "author-select"; render(); };
  card.appendChild(link);
  if(currentAuthor) appendMainScreenLink(card);
  app.appendChild(card);
}

    const img = document.createElement('img');

    txt.className = "section-sub";
    txt.style.margin = "0";

      dc.dataset.value = d.value;

    nsCard.className = "dropoff-card";
    nsCard.dataset.value = notSureVal;
    nsCard.style.textAlign = "center";
    nsCard.innerHTML = `<input type="radio" name="dropoffMethod" value="${notSureVal}" ${currentData.dropoffMethod===notSureVal?'checked':''}>

  });

    statusToggleEl = buildStatusToggle(statusToggleField.key, statusToggleField.options.map(o=>({value:o, text:o})));
    card.appendChild(statusToggleEl);
  }

  // Fields can declare showIf:{key, equals} to only appear once another
  // field on the same screen has a matching value (e.g. frequency options
  // only once "receive reminders?" is answered Yes). Re-evaluated on every
  // change so it reacts live as the person fills the form in.
  function updateConditionalVisibility(){
    (step.fields || []).forEach(f=>{
      if(!f.showIf) return;
      const wrap = fieldWraps[f.key];
      if(!wrap) return;
      wrap.style.display = (currentData[f.showIf.key] === f.showIf.equals) ? "" : "none";

          collectFieldValues(step);
          currentData.meta.currentStep = "done";
          await saveAuthorData(currentAuthor, currentData);
          showToast("Saved!");
          currentScreen = "home";
          render();

      : () => advanceStep(step);
    async function saveExitHandler(){
      collectFieldValues(step);
      if(currentStepId === "links"){
        gateLinksThenRun(async () => {
          await saveAuthorData(currentAuthor, currentData);
          showToast("Saved!");
          generateAndUploadQrCodes(currentAuthor, currentData);
          currentScreen = "home";
          render();

      await saveAuthorData(currentAuthor, currentData);

    const btnRowSecondary = document.createElement('div');

    homeLink.textContent = "Save & return to home screen";

        collectFieldValues(step);

        showToast("Saved!");

      card.appendChild(dynBtnRow);

/* ---------- SCREEN: FIX LINKS ---------- */
function renderFixLinks(){
  const step = STEPS["links"];
  app.appendChild(logoLockup());
  const card = document.createElement('div');
  card.className = "card";
  card.innerHTML = `
    <div class="eyebrow">Quick Check</div>
    <h1 class="section-title">Fix Links</h1>
    <div class="section-sub">It looks like some of your links aren't going to real websites. It's probably just a typo, but let's get them right.</div>
  `;

  const brokenFields = findLinkFormatIssues();
  const listWrap = document.createElement('div');
  card.appendChild(listWrap);
  const footerWrap = document.createElement('div');
  card.appendChild(footerWrap);

  function isFieldResolved(key){
    const v = currentData[key];
    return !v || v.trim() === "" || isPlausibleUrl(normalizeUrlValue(v));
  }
  function allResolved(){
    return brokenFields.every(f => isFieldResolved(f.key));
  }

  const enteredViaShortcut = cameFromWhatsLeft || cameFromNavSubmenu;

  function proceedForward(){
    gateLinksThenRun(linksPendingAction || (async () => {
      const nextId = step.next ? step.next(currentData) : "done";
      currentData.meta.currentStep = nextId;
      await saveAuthorData(currentAuthor, currentData);
      showToast("Saved!");
      generateAndUploadQrCodes(currentAuthor, currentData);
      cameFromWhatsLeft = false;
      cameFromNavSubmenu = false;
      goToSection(nextId);
    }));
  }

  function renderFooter(){
    footerWrap.innerHTML = "";
    const resolved = allResolved();

    if(!enteredViaShortcut){
      // Came from the normal linear flow: the "keep moving forward" button
      // only appears once everything here is fixed or deferred, but the
      // save-and-exit options are always available so they're never stuck.
      if(resolved){
        const savePrompt = document.createElement('div');
        savePrompt.className = "save-prompt";
        savePrompt.textContent = "All fixed! Save your answers and move to the next section?";
        footerWrap.appendChild(savePrompt);

        const btnRow = document.createElement('div');
        btnRow.className = "btn-row";
        const saveNext = document.createElement('button');
        saveNext.className = "btn btn-primary btn-compact";
        saveNext.textContent = "Yes, save & continue";
        saveNext.onclick = () => proceedForward();
        btnRow.appendChild(saveNext);
        footerWrap.appendChild(btnRow);
      } else {
        const note = document.createElement('div');
        note.className = "help";
        note.style.marginBottom = "14px";
        note.textContent = "Fix or defer the remaining link(s) above to continue forward — or save and come back later using an option below.";
        footerWrap.appendChild(note);
      }

      const homeLink = document.createElement('div');
      homeLink.className = "home-link";
      homeLink.textContent = "Save & return to home screen";
      homeLink.style.marginTop = resolved ? "20px" : "0";
      homeLink.onclick = async () => {
        async function doExit(){
          await saveAuthorData(currentAuthor, currentData);
          showToast("Saved!");
          currentScreen = "home";
          render();
        }
        // Once format is genuinely fixed, still route through verification
        // before this counts as a real exit — but while things are still
        // broken/deferred, this stays a pure escape hatch (nothing to
        // verify on a link that isn't even valid yet).
        if(resolved){ gateLinksThenRun(doExit); } else { doExit(); }
      };
      footerWrap.appendChild(homeLink);

      appendMainScreenLink(footerWrap, "Save & return to main screen");
    } else {
      // Came from the To-Do List or "Go to a specific section": these exits
      // stay available even while things are still broken/deferred, but
      // once everything's fixed, they route through verification too.
      const firstLink = document.createElement('div');
      firstLink.className = "home-link";
      firstLink.textContent = cameFromWhatsLeft ? "Save & return to To-Do list" : "Save & choose a different section";
      firstLink.onclick = async () => {
        async function doExit(){
          await saveAuthorData(currentAuthor, currentData);
          if(cameFromWhatsLeft){
            cameFromWhatsLeft = false;
            currentScreen = "whats-left";
          } else {
            currentScreen = "nav-submenu";
          }
          render();
        }
        if(resolved){ gateLinksThenRun(doExit); } else { doExit(); }
      };
      footerWrap.appendChild(firstLink);

      const homeLink = document.createElement('div');
      homeLink.className = "home-link";
      homeLink.textContent = "Save & return to home screen";
      homeLink.onclick = async () => {
        async function doExit(){
          await saveAuthorData(currentAuthor, currentData);
          cameFromWhatsLeft = false;
          cameFromNavSubmenu = false;
          currentScreen = "home";
          render();
        }
        if(resolved){ gateLinksThenRun(doExit); } else { doExit(); }
      };
      footerWrap.appendChild(homeLink);

      appendMainScreenLink(footerWrap, "Save & return to main screen");
    }
  }

  brokenFields.forEach((f, idx)=>{
    const originalValue = currentData[f.key];
    const row = document.createElement('div');
    row.className = "field";
    row.style.marginBottom = "22px";

    const label = document.createElement('label');
    label.textContent = linkLabelOf(f);
    row.appendChild(label);

    const typed = document.createElement('div');
    typed.className = "help";
    typed.style.marginTop = "-2px";
    typed.style.marginBottom = "8px";
    typed.textContent = `You entered: ${originalValue}`;
    row.appendChild(typed);

    const inp = document.createElement('input');
    inp.type = "url";
    inp.setAttribute('data-key', f.key);
    inp.value = originalValue;
    inp.placeholder = "https://";
    inp.addEventListener('input', ()=>{
      currentData[f.key] = inp.value;
      renderFooter();
    });
    inp.addEventListener('blur', ()=>{
      const normalized = normalizeUrlValue(inp.value);
      if(normalized !== inp.value){
        inp.value = normalized;
        currentData[f.key] = normalized;
        renderFooter();
      }
    });
    row.appendChild(inp);

    const laterBtn = document.createElement('button');
    laterBtn.className = "btn btn-secondary btn-tiny";
    laterBtn.style.marginTop = "10px";
    laterBtn.textContent = "Fix this later";
    laterBtn.onclick = () => {
      currentData[f.key] = "";
      inp.value = "";
      renderFooter();
      const nextUnresolved = brokenFields.slice(idx+1).find(nf => !isFieldResolved(nf.key));
      if(nextUnresolved){
        const nextInput = listWrap.querySelector(`[data-key="${nextUnresolved.key}"]`);
        if(nextInput) nextInput.focus();
      }
    };
    row.appendChild(laterBtn);

    listWrap.appendChild(row);
  });

  renderFooter();
  app.appendChild(card);
}

/* ---------- SCREEN: LINK VERIFICATION ---------- */
let linkVerificationEditingKey = null;

function linkLabelOf(f){
  if(f.key === "linkOtherUrl") return ((currentData.linkOtherName || "").trim()) || "Other";
  return f.label;
}
function linkVerificationFields(){
  return (STEPS["links"].fields || []).filter(f => f.type === "url" && currentData[f.key]);
}
function linksNeedVerification(){
  return linkVerificationFields().some(f => !currentData.meta.linkVerification[f.key]);
}
let linksPendingAction = null;
/* Central gatekeeper: whenever someone tries to leave the Links screen (by
   any route — continuing forward, or any of the shortcut save-and-exit
   links), run this first. It makes sure malformed links get fixed and every
   link gets a verification decision before the intended action actually
   happens, no matter how the Links screen was reached. */
function gateLinksThenRun(action){
  const issues = findLinkFormatIssues();
  if(issues.length){
    linksPendingAction = action;
    currentScreen = "fix-links";
    render();
    return;
  }
  if(linksNeedVerification()){
    linksPendingAction = action;
    goToSection("link-verification");
    return;
  }
  action();
}

function renderLinkVerification(step){
  currentData.meta.linkVerification = currentData.meta.linkVerification || {};

  function rebuild(scrollTargetKey){
    app.innerHTML = "";
    app.appendChild(logoLockup());
    const card = document.createElement('div');
    card.className = "card";
    card.innerHTML = `
      <div class="eyebrow">Quick Check</div>
      <h1 class="section-title">Link Verification</h1>
      <div class="section-sub" style="margin-bottom:12px;">I won't be double checking every link from every author, so this is your chance to double check you didn't typo anything.</div>
      <div class="section-sub" style="margin-bottom:12px;">Click each red link and it will open in a new window. Check it's the location you wanted, then come right back to this window and either let me know it's correct, or you can fix it.</div>
      <div class="section-sub">You can see what your links will look like by either clicking the button at the bottom, or you can always access it on your personal Home Screen inside this app.</div>
    `;

    const fields = linkVerificationFields();

    if(!fields.length){
      const empty = document.createElement('div');
      empty.className = "info-box";
      empty.textContent = "You didn't add any links back on the Links page, so there's nothing to verify here — nice and easy!";
      card.appendChild(empty);
    }

    const list = document.createElement('div');
    list.style.cssText = "margin-top:10px;";

    fields.forEach(f=>{
      const status = currentData.meta.linkVerification[f.key]; // 'verified' | 'deferred' | undefined
      const row = document.createElement('div');
      row.setAttribute('data-verify-key', f.key);
      row.style.cssText = "padding:14px 4px;border-bottom:1px solid rgba(12,30,61,0.08);";

      const topLine = document.createElement('div');
      topLine.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;";
      const label = document.createElement('div');
      label.style.cssText = "font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:6px;";
      if(status === "verified"){
        const check = document.createElement('span');
        check.style.cssText = "color:var(--sage);font-weight:900;";
        check.textContent = "\u2713";
        label.appendChild(check);
      }
      const labelText = document.createElement('span');
      labelText.textContent = linkLabelOf(f);
      label.appendChild(labelText);
      topLine.appendChild(label);

      if(status === "verified"){
        const badge = document.createElement('span');
        badge.style.cssText = "font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;color:#fff;background:var(--sage);padding:4px 10px;border-radius:999px;";
        badge.textContent = "\u2713 VERIFIED";
        topLine.appendChild(badge);
      } else if(status === "deferred"){
        const badge = document.createElement('span');
        badge.style.cssText = "font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;color:var(--terracotta);background:var(--peach);padding:4px 10px;border-radius:999px;opacity:.75;";
        badge.textContent = "DEFERRED";
        topLine.appendChild(badge);
      }
      row.appendChild(topLine);

      if(linkVerificationEditingKey === f.key){
        const editWrap = document.createElement('div');
        editWrap.style.cssText = "margin-top:8px;";
        const input = document.createElement('input');
        input.type = "url";
        input.value = currentData[f.key] || "";
        input.style.cssText = "width:100%;padding:10px;border:1.5px solid rgba(12,30,61,0.2);border-radius:8px;font-family:'Lora',serif;font-size:14.5px;margin-bottom:8px;";
        editWrap.appendChild(input);
        const saveBtn = document.createElement('button');
        saveBtn.className = "btn btn-primary btn-tiny";
        saveBtn.textContent = "Save this link";
        saveBtn.onclick = async () => {
          const val = input.value.trim();
          if(val && !isPlausibleUrl(val)){
            showToast("That doesn't quite look like a full web address — it should start with https://");
            return;
          }
          currentData[f.key] = val;
          delete currentData.meta.linkVerification[f.key]; // needs re-verifying
          linkVerificationEditingKey = null;
          await saveAuthorData(currentAuthor, currentData);
          rebuild(f.key);
        };
        editWrap.appendChild(saveBtn);
        row.appendChild(editWrap);
      } else {
        const linkLine = document.createElement('a');
        linkLine.href = currentData[f.key];
        linkLine.target = "_blank";
        linkLine.rel = "noopener";
        linkLine.textContent = currentData[f.key];
        linkLine.style.cssText = "display:block;font-family:'Lora',serif;font-size:16px;font-weight:700;color:var(--terracotta);word-break:break-all;margin:6px 0 10px;text-decoration:underline;";
        row.appendChild(linkLine);

        const btnRow = document.createElement('div');
        btnRow.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;";

        const rightBtn = document.createElement('button');
        rightBtn.className = "btn btn-tiny";
        rightBtn.style.cssText = "background:var(--sage);color:#fff;border:none;";
        rightBtn.textContent = "IT'S RIGHT";
        rightBtn.onclick = () => handleDecision(f.key, "verified");
        btnRow.appendChild(rightBtn);

        const fixBtn = document.createElement('button');
        fixBtn.className = "btn btn-secondary btn-tiny";
        fixBtn.textContent = "LET'S FIX IT";
        fixBtn.onclick = () => { linkVerificationEditingKey = f.key; rebuild(f.key); };
        btnRow.appendChild(fixBtn);

        if(status !== "deferred"){
          const laterBtn = document.createElement('button');
          laterBtn.className = "btn btn-secondary btn-tiny";
          laterBtn.textContent = "It's not right, but let's fix this later";
          laterBtn.onclick = () => handleDecision(f.key, "deferred");
          btnRow.appendChild(laterBtn);
        }

        row.appendChild(btnRow);
      }

      list.appendChild(row);
    });
    card.appendChild(list);

    const seeLinksRow = document.createElement('div');
    seeLinksRow.style.cssText = "text-align:center;margin:22px 0 6px;";
    const seeLinksBtn = document.createElement('button');
    seeLinksBtn.className = "btn btn-secondary btn-compact";
    seeLinksBtn.textContent = "See your links";
    seeLinksBtn.onclick = async () => {
      await saveAuthorData(currentAuthor, currentData);
      linkVerificationEditingKey = null;
      qrPreviewFromVerification = true;
      currentScreen = "qr-preview";
      render();
      window.scrollTo(0,0);
    };
    seeLinksRow.appendChild(seeLinksBtn);
    card.appendChild(seeLinksRow);

    const unresolvedCount = fields.filter(f => !currentData.meta.linkVerification[f.key]).length;

    const savePrompt = document.createElement('div');
    savePrompt.className = "save-prompt";
    savePrompt.textContent = unresolvedCount
      ? `${unresolvedCount} link${unresolvedCount === 1 ? "" : "s"} still need a decision before continuing.`
      : "All set — ready to continue?";
    card.appendChild(savePrompt);

    const btnRow = document.createElement('div');
    btnRow.className = "btn-row";
    const saveNext = document.createElement('button');
    saveNext.className = "btn btn-primary btn-compact";
    saveNext.textContent = "Yes, save & continue";
    saveNext.onclick = async () => {
      if(unresolvedCount > 0){
        showToast("Just need a decision on the rest of your links first — IT'S RIGHT, LET'S FIX IT, or It's not right, but let's fix this later.");
        return;
      }
      linkVerificationEditingKey = null;
      await saveAuthorData(currentAuthor, currentData);
      gateLinksThenRun(linksPendingAction || (async () => {
        const nextId = step.next ? step.next(currentData) : "done";
        currentData.meta.currentStep = nextId;
        await saveAuthorData(currentAuthor, currentData);
        showToast("Saved!");
        goToSection(nextId);
      }));
    };
    btnRow.appendChild(saveNext);
    card.appendChild(btnRow);

    const link = document.createElement('div');
    link.className = "home-link";
    link.textContent = cameFromWhatsLeft ? "Save & return to To-Do list" : "Save & return to home screen";
    link.onclick = async () => {
      await saveAuthorData(currentAuthor, currentData);
      linkVerificationEditingKey = null;
      if(cameFromWhatsLeft){
        cameFromWhatsLeft = false;
        currentScreen = "whats-left";
      } else {
        currentScreen = "home";
      }
      render();
    };
    card.appendChild(link);

    const backLink = document.createElement('div');
    backLink.className = "home-link";
    backLink.textContent = "\u2190 Back to Links";
    backLink.onclick = async () => {
      await saveAuthorData(currentAuthor, currentData);
      goToSection("links");
    };
    card.appendChild(backLink);

    appendMainScreenLink(card, "Save & return to main screen");
    app.appendChild(card);

    if(scrollTargetKey){
      const targetEl = list.querySelector(`[data-verify-key="${scrollTargetKey}"]`);
      if(targetEl){
        targetEl.scrollIntoView({behavior:"smooth", block:"start"});
      }
    } else {
      window.scrollTo(0, 0);
    }
  }

  async function handleDecision(key, status){
    currentData.meta.linkVerification[key] = status;
    await saveAuthorData(currentAuthor, currentData);
    const fields = linkVerificationFields();
    const idx = fields.findIndex(f => f.key === key);
    const nextUnresolved = fields.slice(idx+1).find(f => !currentData.meta.linkVerification[f.key]);
    rebuild(nextUnresolved ? nextUnresolved.key : null);
  }

  rebuild(null);
}

/* ---------- SCREEN: DONATED BOOK TITLES (custom) ---------- */
function renderDonationTitles(step){
  app.appendChild(logoLockup());
  const card = document.createElement('div');
  card.className = "card";
  const titleImg = step.icon ? `<img src="${step.icon}">` : "";
  card.innerHTML = `
    <div class="eyebrow">Bookish Summer Soirée</div>
    <h1 class="section-title">${titleImg}${step.title}</h1>
    <div class="section-sub">${step.sub || ""}</div>
  `;

  // ---------- data ----------
  if(!Array.isArray(currentData.donatedBooksList)) currentData.donatedBooksList = [];
  // Older versions kept a plain list of titles (only in this browser).
  // Bring those along as "entered by hand" prizes of 1 each.
  if(currentData.donatedBooksList.length === 0 && Array.isArray(currentData.donatedTitlesList)){
    currentData.donatedTitlesList.forEach(t=>{
      if(t && String(t).trim()) currentData.donatedBooksList.push({kind:"manual", title:String(t).trim(), series:"", qty:1});
    });
  }
  const donList = () => currentData.donatedBooksList;
  const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const keyOf = (kind, title) => (kind === "series" ? "series:" : "book:") + norm(title);

  // Everything already entered in this app (books selling at the Soirée +
  // presale books), with duplicates removed. Series first (books in series
  // order), then single books A-Z.
  function buildCatalog(){
    const seen = {};
    const seriesMap = {};
    const singles = [];
    (currentData.preorderBooksList || []).forEach(b=>{
      if(!b || !b.title || !b.title.trim()) return;
      const nk = norm(b.title);
      if(seen[nk]) return;
      seen[nk] = true;
      if(b.isSeries === "Yes" && b.seriesName && b.seriesName.trim()){
        const sk = norm(b.seriesName);
        if(!seriesMap[sk]) seriesMap[sk] = {name:b.seriesName.trim(), books:[]};
        seriesMap[sk].books.push({title:b.title.trim(), num:parseFloat(b.seriesBookNumber)});
      } else {
        singles.push({title:b.title.trim()});
      }
    });
    (currentData.sellingTitlesList || []).forEach(t=>{
      if(!t || !String(t).trim()) return;
      const nk = norm(t);
      if(seen[nk] || seriesMap[nk]) return;
      seen[nk] = true;
      singles.push({title:String(t).trim()});
    });
    const series = Object.keys(seriesMap).map(k=>seriesMap[k]);
    series.sort((a,b)=> a.name.localeCompare(b.name));
    series.forEach(s=> s.books.sort((a,b)=>{
      const an = isNaN(a.num) ? 1e9 : a.num, bn = isNaN(b.num) ? 1e9 : b.num;
      return an !== bn ? an - bn : a.title.localeCompare(b.title);
    }));
    singles.sort((a,b)=> a.title.localeCompare(b.title));
    return {series, singles};
  }

  const viaShortcut = cameFromWhatsLeft || cameFromNavSubmenu;
  let showList = donList().some(e => e.kind !== "manual");
  let showManual = donList().some(e => e.kind === "manual");

  // ---------- intro + the two pill buttons ----------
  const intro = document.createElement('div');
  intro.className = "help";
  intro.style.cssText = "margin:6px 0 16px;";
  intro.textContent = "Pick whichever way is easiest — you can use both.";
  card.appendChild(intro);

  const pillWrap = document.createElement('div');
  pillWrap.style.cssText = "display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-bottom:18px;";
  const pillList = document.createElement('button');
  pillList.type = "button";
  pillList.textContent = "Show me the book/series titles I've already entered";
  const pillManual = document.createElement('button');
  pillManual.type = "button";
  pillManual.textContent = "I will enter a title I haven't listed in this app yet";
  [pillList, pillManual].forEach(b=>{ b.style.cssText = "text-align:left;white-space:normal;"; pillWrap.appendChild(b); });
  card.appendChild(pillWrap);

  const listPanel = document.createElement('div');
  const manualPanel = document.createElement('div');
  card.appendChild(listPanel);
  card.appendChild(manualPanel);

  function restylePills(){
    pillList.className = "btn btn-compact " + (showList ? "btn-primary" : "btn-secondary");
    pillManual.className = "btn btn-compact " + (showManual ? "btn-primary" : "btn-secondary");
  }
  pillList.onclick = () => { showList = !showList; restylePills(); renderListPanel(); };
  pillManual.onclick = () => {
    showManual = !showManual;
    if(showManual && !donList().some(e => e.kind === "manual")){
      donList().push({kind:"manual", title:"", series:"", qty:""});
    }
    restylePills();
    renderManualPanel();
  };

  // ---------- panel 1: titles already entered ----------
  function renderListPanel(){
    listPanel.innerHTML = "";
    if(!showList) return;
    const cat = buildCatalog();
    const box = document.createElement('div');
    box.style.cssText = "margin-bottom:18px;";
    if(!cat.series.length && !cat.singles.length){
      const none = document.createElement('div');
      none.className = "info-box";
      none.textContent = "You haven't entered any book or series titles in this app yet — use the other button to type in the title(s) you'll donate.";
      box.appendChild(none);
      listPanel.appendChild(box);
      return;
    }
    const p = document.createElement('div');
    p.style.cssText = "font-family:'Lora',serif;font-size:15px;font-weight:700;margin-bottom:8px;";
    p.textContent = "Select those title(s) you are willing to donate as a prize(s).";
    box.appendChild(p);

    function addRow(kind, title, opts){
      opts = opts || {};
      const key = keyOf(kind, title);
      const find = () => donList().find(e => e.kind !== "manual" && e.key === key);
      const wrap = document.createElement('div');
      wrap.style.cssText = "padding:8px 2px;border-bottom:1px solid rgba(12,30,61,0.08);" + (opts.indent ? "margin-left:26px;" : "");
      const label = document.createElement('label');
      label.style.cssText = "display:flex;align-items:center;gap:10px;font-family:'Lora',serif;font-size:15px;cursor:pointer;";
      const cb = document.createElement('input');
      cb.type = "checkbox";
      cb.style.cssText = "accent-color:var(--terracotta);width:18px;height:18px;flex-shrink:0;";
      cb.checked = !!find();
      const span = document.createElement('span');
      if(kind === "series"){
        span.innerHTML = "";
        const b = document.createElement('strong'); b.textContent = title;
        const tag = document.createElement('span'); tag.style.cssText = "font-size:12px;opacity:.65;margin-left:6px;"; tag.textContent = "(whole series)";
        span.appendChild(b); span.appendChild(tag);
      } else {
        span.textContent = (opts.num && !isNaN(opts.num) ? "Book " + opts.num + ": " : "") + title;
      }
      label.appendChild(cb); label.appendChild(span);
      wrap.appendChild(label);

      const qtyBox = document.createElement('div');
      qtyBox.style.cssText = "margin:8px 0 2px 28px;display:" + (cb.checked ? "block" : "none") + ";";
      const q = document.createElement('div');
      q.className = "help";
      q.style.marginBottom = "6px";
      q.textContent = kind === "series"
        ? "How many of this series are you planning on donating?"
        : "How many of this title are you planning on donating?";
      const qi = document.createElement('input');
      qi.type = "number"; qi.min = "1"; qi.step = "1"; qi.inputMode = "numeric";
      qi.style.cssText = "width:90px;";
      const existing = find();
      qi.value = existing ? (existing.qty === "" ? "" : existing.qty) : "1";
      qi.addEventListener('input', ()=>{ const e = find(); if(e) e.qty = qi.value === "" ? "" : parseInt(qi.value,10); });
      qi.addEventListener('blur', ()=>{ const e = find(); if(e && !(parseInt(qi.value,10) >= 1)){ e.qty = 1; qi.value = "1"; } });
      qtyBox.appendChild(q); qtyBox.appendChild(qi);
      wrap.appendChild(qtyBox);

      cb.addEventListener('change', ()=>{
        if(cb.checked){
          if(!find()) donList().push({kind:kind, key:key, title:title, series:opts.series || "", qty:1});
          qi.value = "1";
          qtyBox.style.display = "block";
          qi.focus(); qi.select();
        } else {
          const i = donList().findIndex(e => e.kind !== "manual" && e.key === key);
          if(i !== -1) donList().splice(i, 1);
          qtyBox.style.display = "none";
        }
      });
      box.appendChild(wrap);
    }

    cat.series.forEach(s=>{
      addRow("series", s.name);
      s.books.forEach(b => addRow("book", b.title, {indent:true, num:b.num, series:s.name}));
    });
    cat.singles.forEach(b => addRow("book", b.title));
    listPanel.appendChild(box);
  }

  // ---------- panel 2: titles typed in by hand (with a quantity) ----------
  function renderManualPanel(focusIdx){
    manualPanel.innerHTML = "";
    if(!showManual) return;
    const manual = donList().filter(e => e.kind === "manual");
    if(!manual.length) donList().push({kind:"manual", title:"", series:"", qty:""});
    const rows = donList().filter(e => e.kind === "manual");
    const head = document.createElement('div');
    head.style.cssText = "font-family:'Lora',serif;font-size:15px;font-weight:700;margin:6px 0 8px;";
    head.textContent = "Enter each book or series you plan to donate.";
    manualPanel.appendChild(head);
    rows.forEach((entry, i)=>{
      const row = document.createElement('div');
      row.style.cssText = "padding:8px 2px 12px;border-bottom:1px solid rgba(12,30,61,0.08);margin-bottom:6px;";
      const inp = document.createElement('input');
      inp.type = "text";
      inp.placeholder = "Book or series title";
      inp.value = entry.title || "";
      inp.style.cssText = "width:100%;box-sizing:border-box;font-family:'Lora',serif;font-size:15px;padding:11px 13px;";
      inp.addEventListener('input', ()=>{ entry.title = inp.value; });
      // Book or series? (a series counts as ONE prize per copy and its bookmark says "the ___ series")
      const kindRow = document.createElement('div');
      kindRow.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;";
      const kindLbl = document.createElement('span');
      kindLbl.style.cssText = "font-family:'Lora',serif;font-size:14px;margin-right:2px;";
      kindLbl.textContent = "This is a:";
      kindRow.appendChild(kindLbl);
      const pills = [];
      function paintPills(){
        pills.forEach(p => {
          const on = (p.val === "series") === !!entry.isSeries;
          p.el.style.cssText = "font-family:'Lora',serif;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer;border:1.5px solid var(--terracotta);" +
            (on ? "background:var(--terracotta);color:#fff;font-weight:700;" : "background:transparent;color:inherit;");
        });
      }
      [["book","Book"],["series","Whole series"]].forEach(([val,txt])=>{
        const pb = document.createElement('button');
        pb.type = "button"; pb.textContent = txt;
        pb.addEventListener('click', ()=>{ entry.isSeries = (val === "series"); paintPills(); });
        pills.push({val, el:pb});
        kindRow.appendChild(pb);
      });
      paintPills();
      const qtyRow = document.createElement('div');
      qtyRow.style.cssText = "display:flex;gap:10px;align-items:center;margin-top:10px;";
      const qLbl = document.createElement('span');
      qLbl.style.cssText = "font-family:'Lora',serif;font-size:14px;";
      qLbl.textContent = "How many are you planning on donating?";
      const qi = document.createElement('input');
      qi.type = "number"; qi.min = "1"; qi.step = "1"; qi.inputMode = "numeric";
      qi.placeholder = "1";
      qi.value = entry.qty === "" || entry.qty === undefined ? "" : entry.qty;
      qi.style.cssText = "width:80px;flex-shrink:0;font-size:15px;padding:9px 10px;";
      qi.addEventListener('input', ()=>{ entry.qty = qi.value === "" ? "" : parseInt(qi.value,10); });
      qtyRow.appendChild(qLbl); qtyRow.appendChild(qi);
      // Remove this title (entered by hand, so there is no checkbox to untick)
      const delBtn = document.createElement('button');
      delBtn.type = "button";
      delBtn.textContent = "Delete this title";
      delBtn.style.cssText = "margin-left:auto;font-family:'Lora',serif;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;border:1.5px solid #b42318;color:#b42318;background:transparent;";
      delBtn.addEventListener('click', ()=>{
        const idx = donList().indexOf(entry);
        if(idx !== -1) donList().splice(idx, 1);
        if(!donList().some(e => e.kind === "manual")){
          // nothing typed by hand any more: close the section (or leave one blank row if it is open)
          if(typeof pillManual !== "undefined") { showManual = false; restylePills(); }
        }
        renderManualPanel();
      });
      qtyRow.appendChild(delBtn);
      inp.addEventListener('keydown', (e)=>{
        if(e.key === "Enter"){
          e.preventDefault();
          if(inp.value.trim() === "") return;
          if(i === rows.length - 1) donList().push({kind:"manual", title:"", series:"", qty:""});
          renderManualPanel(i + 1);
        }
      });
      row.appendChild(inp); row.appendChild(kindRow); row.appendChild(qtyRow);
      manualPanel.appendChild(row);
    });
    const addBtn = document.createElement('button');
    addBtn.type = "button";
    addBtn.className = "btn btn-secondary btn-tiny";
    addBtn.style.cssText = "margin-top:2px;margin-bottom:14px;";
    addBtn.textContent = "+ Add another title";
    addBtn.onclick = () => {
      donList().push({kind:"manual", title:"", series:"", qty:""});
      renderManualPanel(rows.length);
    };
    manualPanel.appendChild(addBtn);
    if(focusIdx !== undefined){
      const ins = manualPanel.querySelectorAll('input[type=text]');
      if(ins[focusIdx]) ins[focusIdx].focus();
    }
  }

  restylePills();
  renderListPanel();
  renderManualPanel();

  // ---------- bottom buttons ----------
  function collectValues(){
    const out = [];
    donList().forEach(e=>{
      if(!e || !e.title || !String(e.title).trim()) return;
      let q = parseInt(e.qty, 10);
      if(!(q >= 1)) q = 1;
      out.push({kind:e.kind, key:e.key, title:String(e.title).trim(), series:e.series || "", qty:q, isSeries:!!e.isSeries});
    });
    currentData.donatedBooksList = out;
    const total = out.reduce((s,e)=> s + e.qty, 0);
    if(total > 0) currentData.donatedCount = String(total);
    currentData.donatedTitlesList = out.map(e => e.title);
  }

  async function finishList(status){
    collectValues();
    if(status === "complete" && currentData.donatedBooksList.length === 0){
      showToast("Pick or enter at least one prize first — or use the links at the bottom to leave this for later.");
      return;
    }
    currentData.donationListStatus = status;
    if(viaShortcut){
      await saveAuthorData(currentAuthor, currentData);
      showToast("Saved!");
      if(cameFromWhatsLeft){ cameFromWhatsLeft = false; currentScreen = "whats-left"; }

/* ---------- SCREEN: PREORDER BOOKS (custom) ---------- */
function emptyPreorderBook(){
  const nb = {
    id: 'pb_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8),
    title: "", regularPrice: "", soireePrice: "", tagLine: "", blurb: "",
    coverUrl: "", coverUploadedAt: null,
    bookKind: "", specialEditionNote: "",
    isSeries: "", seriesName: "", seriesBookNumber: "", seriesTotalBooks: "",
    seriesRegularPrice: "", seriesSoireePrice: "",
    _expanded: true
  };
  // If the author said "use this Soirée discount for all my books", new books start with it.
  try{ const d = defaultSoireeRule(); if(d) nb.soireeDiscount = {type:d.type, value:d.value, scope:"all"}; }catch(e){}
  return nb;
}

/* ---- Format variants (paperback/hardcover/special edition for a single
   book; paperback/hardcover/box set for a whole series) ----
   Older saved books have no `formats` array at all — ensureBookFormats /
   ensureSeriesFormats lazily migrate those into the new shape the first
   time they're touched, folding the old flat regularPrice/soireePrice (or
   seriesRegularPrice/seriesSoireePrice) in as the "paperback" entry so
   nothing already saved is lost. */
const BOOK_FORMAT_OPTIONS = [
  {value:"paperback", label:"Paperback"},
  {value:"hardcover", label:"Hardcover"},
  {value:"specialEdition", label:"Special Edition"},
  {value:"boxSet", label:"Box Set"}
];
const SERIES_FORMAT_OPTIONS = [
  {value:"paperback", label:"Paperback"},
  {value:"hardcover", label:"Hardcover"}
];

function ensureBookFormats(book){
  if(!Array.isArray(book.formats) || book.formats.length === 0){
    book.formats = ["paperback"];
    book.formatPrices = book.formatPrices || {};
    book.formatPrices.paperback = {
      regular: book.regularPrice || "",
      soiree: book.soireePrice || ""
    };
  }
  if(!book.formatPrices) book.formatPrices = {};
  book.formats.forEach(f=>{ if(!book.formatPrices[f]) book.formatPrices[f] = {regular:"", soiree:""}; });
  if(!book.formatCovers) book.formatCovers = {};
  return book;
}
function bookFormatList(book){
  ensureBookFormats(book);
  return book.formats;
}
function bookFormatPrice(book, fmt){
  ensureBookFormats(book);
  if(!book.formatPrices[fmt]) book.formatPrices[fmt] = {regular:"", soiree:""};
  return book.formatPrices[fmt];
}
function primaryBookCoverUrl(book){
  if(book.coverUrl) return book.coverUrl;
  const formats = bookFormatList(book);
  for(let i=0;i<formats.length;i++){
    const fc = book.formatCovers && book.formatCovers[formats[i]];
    if(fc && fc.coverUrl) return fc.coverUrl;
  }
  return "";
}
function bookHasCover(book){
  ensureBookFormats(book);
  if(bookFormatList(book).length > 1 && book.sameCoverForFormats === "No"){
    return bookFormatList(book).every(f => book.formatCovers[f] && book.formatCovers[f].coverUrl);
  }
  return !!book.coverUrl;
}
function bookHasAllPrices(book){
  ensureBookFormats(book);
  return bookFormatList(book).every(f => book.formatPrices[f] && book.formatPrices[f].regular && book.formatPrices[f].regular !== "");
}

function ensureSeriesFormats(book){
  // A box set is a series in itself, so it is never a format *of* a series.
  if(Array.isArray(book.seriesFormats) && book.seriesFormats.indexOf("boxSet") !== -1){
    book.seriesFormats = book.seriesFormats.filter(f => f !== "boxSet");
    if(book.seriesFormatPrices) delete book.seriesFormatPrices.boxSet;
  }
  if(!Array.isArray(book.seriesFormats) || book.seriesFormats.length === 0){
    book.seriesFormats = ["paperback"];
    book.seriesFormatPrices = book.seriesFormatPrices || {};
    book.seriesFormatPrices.paperback = {
      regular: book.seriesRegularPrice || "",
      soiree: book.seriesSoireePrice || ""
    };
  }
  if(!book.seriesFormatPrices) book.seriesFormatPrices = {};
  book.seriesFormats.forEach(f=>{ if(!book.seriesFormatPrices[f]) book.seriesFormatPrices[f] = {regular:"", soiree:""}; });
  return book;
}

    <div class="section-sub">${step.sub || ""}</div>
  `;

  const sellingTitles = (currentData.sellingTitlesList || []).filter(t => t && t.trim());
  const existingPreorderTitles = (currentData.preorderBooksList || [])
    .map(b => (b && b.title ? b.title.trim().toLowerCase() : ""));

  const list = document.createElement('div');
  list.style.cssText = "margin-top:14px;";
  sellingTitles.forEach(title=>{
    const optWrap = document.createElement('label');
    optWrap.style.cssText = "display:flex;align-items:center;gap:10px;padding:10px 2px;"
      + "font-family:'Lora',serif;font-size:15px;cursor:pointer;border-bottom:1px solid rgba(12,30,61,0.08);";
    const alreadyAdded = existingPreorderTitles.indexOf(title.trim().toLowerCase()) !== -1;
    const cb = document.createElement('input');
    cb.type = "checkbox";
    cb.style.cssText = "accent-color:var(--terracotta);width:18px;height:18px;flex-shrink:0;";
    cb.checked = alreadyAdded;
    cb.dataset.title = title;
    const span = document.createElement('span');
    span.textContent = title;
    optWrap.appendChild(cb);
    optWrap.appendChild(span);
    list.appendChild(optWrap);
  });
  card.appendChild(list);

  // Adds a presale entry for each checked title that doesn't already have
  // one (matched case-insensitively). Never removes an entry on uncheck —
  // someone may have already started filling one in, so this only adds.
  function applySelections(){
    const checked = Array.from(list.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.dataset.title);
    if(!Array.isArray(currentData.preorderBooksList)) currentData.preorderBooksList = [];
    const existing = currentData.preorderBooksList.map(b => (b && b.title ? b.title.trim().toLowerCase() : ""));
    const touchedIds = [];
    checked.forEach(title=>{
      const idx = existing.indexOf(title.trim().toLowerCase());
      if(idx === -1){
        const newBook = emptyPreorderBook();
        newBook.title = title;
        newBook._expanded = false;
        currentData.preorderBooksList.push(newBook);
        existing.push(title.trim().toLowerCase());
        touchedIds.push(newBook.id);
      } else {
        touchedIds.push(currentData.preorderBooksList[idx].id);
      }
    });

    // A blank leftover entry (e.g. the starter box from an earlier, empty
    // visit to this screen) shouldn't sit there once real titles exist.
    if(touchedIds.length){
      currentData.preorderBooksList = currentData.preorderBooksList.filter(b=>{
        const isBlank = !(b.title && b.title.trim()) && !b.coverUrl && !b.regularPrice && !b.soireePrice && !b.blurb && !b.tagLine;
        return !isBlank;
      });
    }

    // Expand the first book that actually came from this checklist (by id,
    // not array position — a stray entry could otherwise end up at index 0
    // and get expanded instead of an actual selected title).
    currentData.preorderBooksList.forEach(b => { b._expanded = false; });
    if(touchedIds.length){
      const firstTouched = currentData.preorderBooksList.find(b => b.id === touchedIds[0]);
      if(firstTouched) firstTouched._expanded = true;
    } else if(currentData.preorderBooksList.length){
      currentData.preorderBooksList[0]._expanded = true;
    }
  }

  const enteredViaShortcut = cameFromWhatsLeft || cameFromNavSubmenu;

  if(!enteredViaShortcut){
    const savePrompt = document.createElement('div');
    savePrompt.className = "save-prompt";
    savePrompt.textContent = "Save your answers and move to the next section?";
    card.appendChild(savePrompt);

    back.onclick = async () => {
      applySelections();
      await saveAuthorData(currentAuthor, currentData);
      goBackSection();
    };
    const saveNext = document.createElement('button');
    saveNext.className = "btn btn-primary btn-compact";
    saveNext.textContent = "Yes, save & continue";
    saveNext.onclick = () => { applySelections(); advanceStep(step); };
    async function saveExitHandler(){
      applySelections();
      await saveAuthorData(currentAuthor, currentData);
      showToast("Saved!");
      currentScreen = "home";
      render();
    }
    btnRow.appendChild(saveNext);
    card.appendChild(btnRow);

    const btnRowSecondary = document.createElement('div');
    btnRowSecondary.className = "btn-row";
    btnRowSecondary.style.marginTop = "20px";
    btnRowSecondary.appendChild(back);
    card.appendChild(btnRowSecondary);

    const homeLink = document.createElement('div');
    homeLink.className = "home-link";
    homeLink.textContent = "Save & return to home screen";
    homeLink.onclick = saveExitHandler;
    card.appendChild(homeLink);

    appendMainScreenLink(card, "Save & return to main screen");
  } else {
    if(cameFromNavSubmenu){
      const nextSectionLink = document.createElement('div');
      nextSectionLink.className = "home-link";
      nextSectionLink.textContent = "Save & go to the next section";
      nextSectionLink.onclick = () => { applySelections(); cameFromNavSubmenu = false; advanceStep(step); };
      card.appendChild(nextSectionLink);
    }

    const firstLink = document.createElement('div');
    firstLink.className = "home-link";
    firstLink.textContent = cameFromWhatsLeft ? "Save & return to To-Do list" : "Save & choose a different section";
    firstLink.onclick = async () => {
      applySelections();

  `;

  if(currentData.preorderPlan === "I'm on the fence, and I'm going to think about it" || currentData.preorderPlan === "I'm not sure. Give me more information."){
    const optOutBtn = document.createElement('button');

      showToast("Saved!");
      goToSection("swag");
    };
    card.appendChild(optOutBtn);
  }

  if(!Array.isArray(currentData.preorderBooksList)){
    currentData.preorderBooksList = [];
  }
  // Arriving at this screen fresh (from anywhere else, or after a reload):
  // drop any book that never got a title and start every book collapsed, so
  // the screen is just a tidy list plus the add button. (A re-draw of this
  // same screen while someone is mid-edit leaves everything as it is.)
  if(window.__lastRenderKey !== "section:" + currentStepId){
    currentData.preorderBooksList = currentData.preorderBooksList.filter(b => b && b.title && b.title.trim());
    currentData.preorderBooksList.forEach(b => { b._expanded = false; });
  }
  try{ recomputeSeriesPrices(); }catch(e){}
  // Backfill ids/expansion state for any books saved before this existed.
  // A lone book starts expanded (nothing to collapse yet); multiple books
  // start collapsed so the screen doesn't open crazy-long.
  currentData.preorderBooksList.forEach(b => { if(!b.id) b.id = emptyPreorderBook().id; });
  currentData.preorderBooksList.forEach(b => { if(b._expanded === undefined) b._expanded = false; });

  const entriesWrap = document.createElement('div');

    statusToggle.style.display = hasAnyPreorderTitle() ? "" : "none";
  }

  // Block leaving/saving this screen while a series book is missing "Book X of Y".
  function guardSeriesInfo(retry){
    const bad = currentData.preorderBooksList.find(b => b && b.title && b.title.trim() && seriesProblem(b));
    if(!bad) return false;
    currentData.preorderBooksList.forEach(b => { b._expanded = false; });
    bad._expanded = true;
    renderEntries();
    const entryEl = () => entriesWrap.querySelector(`[data-book-entry-id="${bad.id}"]`);
    if(seriesProblem(bad) === "kind"){
      showInfoModal("Please choose whether this is an individual book or a box set before saving.");
    } else if(seriesProblem(bad) === "missing"){
      showSeriesInfoModal(()=> flashField(entryEl() && entryEl().querySelector('[data-series-num]')));
    } else {
      showSingleSeriesModal(
        ()=> flashField(entryEl() && entryEl().querySelector('[data-series-total]')),
        ()=>{ deselectSeries(bad); renderEntries(); if(retry) retry(); }
      );
    }
    return true;
  }

  function renderEntries(){
    entriesWrap.innerHTML = "";
    currentData.preorderBooksList.forEach((book, i) => {
      entriesWrap.appendChild(buildPreorderBookEntry(book, i, renderEntries, updateStatusVisibility));
    });

    const addBtn = document.createElement('button');
    addBtn.type = "button";
    addBtn.className = "btn btn-secondary btn-tiny";
    addBtn.textContent = currentData.preorderBooksList.length ? "+ Add another book" : "+ Add a book";
    addBtn.style.marginTop = "6px";
    addBtn.onclick = () => {
      // Collapse everything else so the screen doesn't grow unbounded —
      // only the book actively being edited stays open.
      currentData.preorderBooksList.forEach(b => { b._expanded = false; });
      const newBook = emptyPreorderBook();
      currentData.preorderBooksList.push(newBook);
      renderEntries();
      // Scroll the new book's entry (and its title field) into view — just
      // focusing the input moves the keyboard-focus caret but leaves the
      // page scrolled wherever the "+ Add another book" button was.
      requestAnimationFrame(()=>{
        const entryEl = entriesWrap.querySelector(`[data-book-entry-id="${newBook.id}"]`);
        if(entryEl) entryEl.scrollIntoView({block: "start", behavior: "smooth"});
        const titleInp = entriesWrap.querySelector(`[data-preorder-title-for="${newBook.id}"]`);
        if(titleInp) titleInp.focus({preventScroll:true});
      });
    };
    entriesWrap.appendChild(addBtn);

    const previewLink = document.createElement('button');
    previewLink.type = "button";
    previewLink.className = "btn btn-secondary btn-tiny";
    previewLink.style.cssText = "margin-top:6px;margin-left:10px;";
    previewLink.textContent = "Preview my Presale Listing";
    previewLink.onclick = async () => {
      if(guardSeriesInfo(previewLink.onclick)) return;
      await saveAuthorData(currentAuthor, currentData);
      currentScreen = "preorder-preview";
      render();
    };
    entriesWrap.appendChild(previewLink);

    // Opens the live storefront in a NEW tab so this page stays right where
    // it was; closing (or swiping back from) that tab returns here. Saves
    // first so the storefront shows the latest changes.
    const storeLink = document.createElement('button');
    storeLink.type = "button";
    storeLink.className = "btn btn-secondary btn-tiny";
    storeLink.style.cssText = "margin-top:6px;margin-left:10px;";
    storeLink.textContent = "See the Soirée Storefront";
    storeLink.onclick = async () => {
      if(guardSeriesInfo(storeLink.onclick)) return;
      const w = window.open("", "_blank");
      try{ await saveAuthorData(currentAuthor, currentData); }catch(e){}
      const url = "https://bookishsummersoiree.github.io/BSS-Storefront/";
      if(w){ w.location.href = url; } else { window.open(url, "_blank"); }
    };
    entriesWrap.appendChild(storeLink);
  }

  renderEntries();

  const statusToggle = buildStatusToggle("preorderBooksListStatus", [
    {value:"complete", text:"This is all the books I'll be preselling at the Soirée (will mark this completed on your To-Do list)"},
    {value:"tentative", text:"I will be coming back and adding more books (will keep this active on your To-Do list)"}
  ]);
  card.appendChild(statusToggle);
  updateStatusVisibility(); // correct initial show/hide now that statusToggle exists

  const enteredViaShortcut = cameFromWhatsLeft || cameFromNavSubmenu;

  if(!enteredViaShortcut){
    const savePrompt = document.createElement('div');
    savePrompt.className = "save-prompt";
    savePrompt.style.cssText = "border-top:none;margin-top:16px;padding-top:0;";
    savePrompt.textContent = "Save your answers and move to the next section?";
    card.appendChild(savePrompt);

    const btnRow = document.createElement('div');
    btnRow.className = "btn-row";
    const back = document.createElement('button');
    back.className = "btn btn-secondary btn-tiny";
    back.textContent = "\u2190 Back";
    back.onclick = async () => {
      if(guardSeriesInfo(back.onclick)) return;
      await saveAuthorData(currentAuthor, currentData);
      goBackSection();
    };
    const saveNext = document.createElement('button');
    saveNext.className = "btn btn-primary btn-compact";
    saveNext.textContent = "Yes, save & continue";
    saveNext.onclick = () => { if(guardSeriesInfo(saveNext.onclick)) return; advanceStep(step); };
    async function saveExitHandler(){
      if(guardSeriesInfo(saveExitHandler)) return;
      await saveAuthorData(currentAuthor, currentData);
      showToast("Saved!");
      currentScreen = "home";
      render();
    }
    btnRow.appendChild(saveNext);
    card.appendChild(btnRow);

    const btnRowSecondary = document.createElement('div');
    btnRowSecondary.className = "btn-row";
    btnRowSecondary.style.marginTop = "20px";
    btnRowSecondary.appendChild(back);
    card.appendChild(btnRowSecondary);

    const homeLink = document.createElement('div');
    homeLink.className = "home-link";
    homeLink.textContent = "Save & return to home screen";
    homeLink.onclick = saveExitHandler;
    card.appendChild(homeLink);

    appendMainScreenLink(card, "Save & return to main screen");
  } else {
    if(cameFromNavSubmenu){
      const nextSectionLink = document.createElement('div');
      nextSectionLink.className = "home-link";
      nextSectionLink.textContent = "Save & go to the next section";
      nextSectionLink.onclick = () => { if(guardSeriesInfo(nextSectionLink.onclick)) return; cameFromNavSubmenu = false; advanceStep(step); };
      card.appendChild(nextSectionLink);
    }

    const firstLink = document.createElement('div');
    firstLink.className = "home-link";
    firstLink.textContent = cameFromWhatsLeft ? "Save & return to To-Do list" : "Save & choose a different section";
    firstLink.onclick = async () => {
      if(guardSeriesInfo(firstLink.onclick)) return;
      await saveAuthorData(currentAuthor, currentData);
      if(cameFromWhatsLeft){
        cameFromWhatsLeft = false;
        currentScreen = "whats-left";
      } else {
        currentScreen = "nav-submenu";
      }
      render();
    };
    card.appendChild(firstLink);

    const homeLink = document.createElement('div');
    homeLink.className = "home-link";
    homeLink.textContent = "Save & return to home screen";
    homeLink.onclick = async () => {
      if(guardSeriesInfo(homeLink.onclick)) return;
      await saveAuthorData(currentAuthor, currentData);
      cameFromWhatsLeft = false;
      cameFromNavSubmenu = false;
      currentScreen = "home";
      render();
    };
    card.appendChild(homeLink);

    appendMainScreenLink(card, "Save & return to main screen");
  }
  app.appendChild(card);
}

/* A book entry renders as a compact summary row once collapsed (default
   once more than one book exists, so the screen doesn't get crazy-long),
   or the full editable form when expanded. Tapping the pencil on a
   collapsed row — or the collapse arrow on an open one — toggles it, and
   opening one collapses the others (accordion-style) so at most one full
   form is on screen at a time. */
function buildPreorderBookEntry(book, index, onChange, onTitleChange){
  return book._expanded
    ? buildPreorderBookEntryExpanded(book, index, onChange, onTitleChange)
    : buildPreorderBookEntryCollapsed(book, index, onChange);
}

function statusIcon(state){
  // state: true (done -> green check), false (missing & required -> red X),
  // "muted" (missing but optional -> greyed, no X). Both true/false use the
  // same box-sizing so the green and red boxes line up with each other.
  const span = document.createElement('span');
  span.style.cssText = "display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;"
    + "width:18px;height:18px;border-radius:4px;font-size:11px;font-weight:700;flex-shrink:0;";
  if(state === true){
    span.style.background = "var(--sage,#94A177)";
    span.style.border = "2px solid var(--sage,#94A177)";
    span.style.color = "#fff";
    span.textContent = "\u2713";
  } else if(state === "muted"){
    span.style.background = "#fff";
    span.style.border = "2px solid #ddd";
    span.style.color = "#ccc";
    span.textContent = "\u2715";
  } else {
    span.style.background = "#fff";
    span.style.border = "2px solid var(--terracotta,#E4593F)";
    span.style.color = "var(--terracotta,#E4593F)";
    span.textContent = "\u2715";
  }
  return span;
}

function preorderLabeledIcon(labelText, state){

function preorderPriceDisplay(labelText, value, missingState){
