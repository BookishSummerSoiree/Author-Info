  heading.textContent = "Getting paid for your presale books";
  wrap.appendChild(heading);

  const bodyWrap = document.createElement('div');
  wrap.appendChild(bodyWrap);

  let stillMissingNote = false;
  let justFinishedNote = false;
  function renderBody(){
    bodyWrap.innerHTML = "";
    const status = currentData.stripeOnboardingStatus || "not_started";
    const method = currentData.payoutMethod || (status !== "not_started" ? "stripe" : "");
    if(!method){ renderChooser(); return; }
    if(method === "venmo"){ renderVenmo(); return; }

    const statusLine = document.createElement('div');
    statusLine.className = "help";
    statusLine.style.marginBottom = "10px";

    const btnRow = document.createElement('div');
    btnRow.className = "btn-row";

    if(status === "complete"){
      statusLine.innerHTML = `${statusIcon(true).outerHTML} <span style="margin-left:4px;">${justFinishedNote ? "Welcome back! " : ""}You're all set — Stripe will send your presale earnings straight to your bank account.</span>`;
      statusLine.style.display = "flex";
      statusLine.style.alignItems = "center";
    } else if(status === "pending_review"){
      statusLine.textContent = "Stripe has what they need and is reviewing your info — this usually only takes a bit. Nothing else for you to do right now.";
    } else if(status === "pending"){
      statusLine.textContent = stillMissingNote
        ? "We just checked with Stripe, and a few details are still missing. Tap the button below and Stripe will show you what's left."
        : "You've started setting up how you get paid, but haven't finished yet.";
      const continueBtn = document.createElement('button');
      continueBtn.className = "btn btn-primary btn-compact";
      continueBtn.textContent = "Continue setting up payouts";
      continueBtn.onclick = () => startConnectOnboarding(continueBtn);
      btnRow.appendChild(continueBtn);
    } else {
      statusLine.textContent = "To actually receive money from your presale sales, Stripe needs a few details from you. This only takes a few minutes.";
      const startBtn = document.createElement('button');
      startBtn.className = "btn btn-primary btn-compact";
      startBtn.textContent = "Set up how I get paid";
      startBtn.onclick = () => startConnectOnboarding(startBtn);
      btnRow.appendChild(startBtn);
    }

    bodyWrap.appendChild(statusLine);
    if(btnRow.children.length) bodyWrap.appendChild(btnRow);

    if(status !== "not_started"){
      const refreshLink = document.createElement('div');
      refreshLink.className = "home-link";
      refreshLink.style.marginTop = "12px";
      refreshLink.textContent = "Check my status";
      refreshLink.onclick = () => refreshConnectStatusUI(refreshLink);
      bodyWrap.appendChild(refreshLink);
    }

    if(status !== "complete"){
      const switchLink = document.createElement('div');
      switchLink.className = "home-link";
      switchLink.style.marginTop = "12px";
      switchLink.textContent = "I'd rather be paid by Venmo instead";
      switchLink.onclick = () => choosePayout("venmo");
      bodyWrap.appendChild(switchLink);
    }
  }

  async function choosePayout(m){
    currentData.payoutMethod = m;
    try{ await saveAuthorData(currentAuthor, currentData); }catch(e){}
    renderBody();
  }

  function renderChooser(){
    const q = document.createElement('div');
    q.className = "help";
    q.style.marginBottom = "12px";
    q.textContent = "How would you like to be paid for your presale books?";
    bodyWrap.appendChild(q);
    const row = document.createElement('div');
    row.className = "btn-row";
    const stripeBtn = document.createElement('button');
    stripeBtn.className = "btn btn-primary btn-compact";
    stripeBtn.textContent = "Stripe (fastest)";
    stripeBtn.onclick = () => choosePayout("stripe");
    row.appendChild(stripeBtn);
    const venmoBtn = document.createElement('button');
    venmoBtn.className = "btn btn-secondary btn-compact";
    venmoBtn.textContent = "Venmo (slower)";
    venmoBtn.onclick = () => choosePayout("venmo");
    row.appendChild(venmoBtn);
    bodyWrap.appendChild(row);
  }

  function renderVenmo(){
    const handle = (currentData.venmoHandle || "").trim();
    const line = document.createElement('div');
    line.className = "help";
    line.style.marginBottom = "10px";
    line.textContent = handle
      ? `You're set to be paid by Venmo (${handle}). Nicole will send your earnings within about two weeks.`
      : "You chose Venmo. Nicole will send your earnings within about two weeks. What's your Venmo username?";
    bodyWrap.appendChild(line);

    const input = document.createElement('input');
    input.type = "text";
    input.placeholder = "@your-venmo-name";
    input.value = handle;
    input.style.cssText = "width:100%;box-sizing:border-box;padding:12px;border:1.5px solid rgba(12,30,61,0.2);border-radius:8px;font-size:16px;margin-bottom:10px;";
    bodyWrap.appendChild(input);

    const saveBtn = document.createElement('button');
    saveBtn.className = "btn btn-primary btn-compact";
    saveBtn.textContent = handle ? "Update my Venmo name" : "Save my Venmo name";
    saveBtn.onclick = async () => {
      const v = input.value.trim();
      if(!v){ showToast("Please enter your Venmo username."); return; }
      currentData.venmoHandle = v.startsWith("@") ? v : "@" + v;
      saveBtn.disabled = true;
      try{ await saveAuthorData(currentAuthor, currentData); showToast("Saved!"); }catch(e){ showToast("Couldn't save \u2014 please try again."); }
      renderBody();
    };
    bodyWrap.appendChild(saveBtn);

    const switchLink = document.createElement('div');
    switchLink.className = "home-link";
    switchLink.style.marginTop = "12px";
    switchLink.textContent = "I'd rather be paid through Stripe (fastest)";
    switchLink.onclick = () => choosePayout("stripe");
    bodyWrap.appendChild(switchLink);
  }

  // Popup that handles the three situations: the author already has a Stripe
  // account, doesn't have one, or isn't sure. The setup call is the same for
  // all three; only the wording and which email we ask for differ. Resolves
  // to the email, or null if they cancel.
  function askStripeEmail(prefill){
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = "info-modal-overlay";
      const cardEl = document.createElement('div');
      cardEl.className = "info-modal-card";
      const text = document.createElement('div');
      text.className = "info-modal-text";
      text.style.marginBottom = "10px";
      text.textContent = "Do you already have a Stripe account?";
      cardEl.appendChild(text);

      const choices = [
        {id:"have",   label:"Yes, I already have one"},
        {id:"none",   label:"No, I don't have one"},
        {id:"unsure", label:"I'm not sure"}
      ];
      const helps = {
        have:   "Enter the email you log in to Stripe with. On Stripe's next page, sign in and it can reuse the details you already have.",
        none:   "That's fine — Stripe will walk you through creating one. Which email would you like to use for it?",
        unsure: "No problem. Enter the email you'd most likely have used. On Stripe's next page, if that email has an account Stripe will let you sign in; if not, it will simply set one up for you. (To check first, try logging in at dashboard.stripe.com.)"
      };
      let picked = "";
      const list = document.createElement('div');
      list.style.cssText = "display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:8px;";
      const helpEl = document.createElement('div');
      helpEl.style.cssText = "font-size:13.5px;color:#6b7080;line-height:1.5;margin:6px 0 4px;text-align:left;display:none;";
      const input = document.createElement('input');
      input.type = "email";
      input.value = prefill || "";
      input.placeholder = "you@example.com";
      input.style.cssText = "width:100%;box-sizing:border-box;padding:12px;border:1.5px solid rgba(12,30,61,0.2);border-radius:8px;font-size:16px;margin:8px 0 12px;display:none;";

      choices.forEach(c => {
        const lab = document.createElement('label');
        lab.style.cssText = "display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer;";
        const r = document.createElement('input');
        r.type = "radio"; r.name = "stripe-have"; r.style.cssText = "width:20px;height:20px;accent-color:#E4593F;";
        r.onchange = () => {
          picked = c.id;
          helpEl.textContent = helps[c.id];
          helpEl.style.display = "block";
          input.style.display = "block";
        };
        lab.appendChild(r);
        lab.appendChild(document.createTextNode(c.label));
        list.appendChild(lab);
      });
      cardEl.appendChild(list);
      cardEl.appendChild(helpEl);
      cardEl.appendChild(input);

      const row = document.createElement('div');
      row.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;justify-content:center;";
      const ok = document.createElement('button');
      ok.className = "btn btn-primary btn-compact";
      ok.textContent = "Continue to Stripe";
      ok.onclick = () => {
        if(!picked){ showToast("Please pick one of the three options."); return; }
        const v = input.value.trim();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ showToast("Please enter a valid email address."); return; }
        overlay.remove(); resolve(v);
      };
      const cancel = document.createElement('button');
      cancel.className = "btn btn-secondary btn-compact";
      cancel.textContent = "Cancel";
      cancel.onclick = () => { overlay.remove(); resolve(null); };
      row.appendChild(ok); row.appendChild(cancel);
      cardEl.appendChild(row);
      overlay.appendChild(cardEl);
      document.body.appendChild(overlay);
    });
  }

  async function startConnectOnboarding(btn, forceAsk){
    const originalText = btn.textContent;
    let stripeEmail = "";
    const status0 = currentData.stripeOnboardingStatus || "not_started";
    if(forceAsk || status0 === "not_started"){
      stripeEmail = await askStripeEmail(currentData.email || "");
      if(!stripeEmail) return;
      // Nothing saved under General Info yet? Fill it in for them.
      if(!(currentData.email || "").trim()){
        currentData.email = stripeEmail;
      }
    }
    btn.disabled = true;
    btn.textContent = "Connecting to Stripe\u2026";
    // Keep a message on screen the WHOLE time (saving, fetching, redirecting)
    // so there's never a blank-looking gap before Stripe opens.
    const stripeWait = document.createElement('div');
    stripeWait.style.cssText = "position:fixed;inset:0;z-index:2147483000;background:rgba(255,255,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:inherit;color:#333;";
    stripeWait.innerHTML = '<div style="width:44px;height:44px;border:4px solid #ddd;border-top-color:#6b4fbb;border-radius:50%;animation:stripeSpin 0.9s linear infinite;margin-bottom:18px"></div>'
      + '<div style="font-size:1.15rem;font-weight:700;margin-bottom:8px">Taking you to Stripe\u2026</div>'
      + '<div style="font-size:.95rem;max-width:300px">This can take up to 10 seconds. Please don\u2019t close or leave this screen.</div>'
      + '<style>@keyframes stripeSpin{to{transform:rotate(360deg)}}</style>';
    document.body.appendChild(stripeWait);
    try{
      // Save the email at the same time as asking Stripe for the link (not
      // one after the other) \u2014 saves several seconds of waiting.
      const emailSave = stripeEmail ? saveAuthorData(currentAuthor, currentData).catch(()=>{}) : Promise.resolve();
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "getConnectOnboardingLink", authorName: currentAuthor, contactEmail: stripeEmail })
      });
      const json = await res.json();
      if(json && json.needsEmail){
        stripeWait.remove();
        btn.disabled = false;
        btn.textContent = originalText;
        return startConnectOnboarding(btn, true);
      }
      if(!json || !json.success) throw new Error((json && json.error) || "Couldn't start setup.");
      currentData.stripeOnboardingStatus = "pending";
      // Save first so nothing's lost, then navigate THIS tab straight to
      // Stripe rather than trying to open a new one. A new tab only opens
      // without being blocked if it happens in the same instant as the
      // tap \u2014 by the time this fetch finishes, mobile Safari no longer
      // treats it as user-initiated and silently blocks it, which is what
      // made the button look like it just didn't do anything. Stripe sends
      // them right back to this app's URL when they're done.
      await emailSave;
      await saveAuthorData(currentAuthor, currentData);
      window.location.href = json.url;
    }catch(e){
      console.error("Stripe onboarding error:", e);
      stripeWait.remove();
      showToast("Couldn't start Stripe setup: " + ((e && e.message) ? e.message : "please try again"));
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  async function refreshConnectStatusUI(link){
    const originalText = link.textContent;
    link.textContent = "Checking\u2026";
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "refreshConnectStatus", authorName: currentAuthor })
      });
      const json = await res.json();
      if(!json || !json.success) throw new Error((json && json.error) || "Couldn't check status.");
      currentData.stripeOnboardingStatus = json.status;
      renderBody();
    }catch(e){
      showToast("Couldn't check status \u2014 please try again");
      link.textContent = originalText;
    }
  }

  // Coming back from Stripe (or reopening the app) with setup unfinished:
  // ask Stripe right away instead of making the author tap "Check my status".
  const st0 = currentData.stripeOnboardingStatus || "not_started";
  const usingStripe = (currentData.payoutMethod || "stripe") === "stripe";
  if(usingStripe && (st0 === "pending" || st0 === "pending_review") && !window.__stripeAutoChecked){
    window.__stripeAutoChecked = true;
    bodyWrap.innerHTML = '<div class="help" style="display:flex;align-items:center;gap:10px;">'
      + '<span style="width:18px;height:18px;border:3px solid #ddd;border-top-color:#6b4fbb;border-radius:50%;display:inline-block;animation:stripeSpin 0.9s linear infinite"></span>'
      + '<span>Checking your Stripe setup\u2026</span></div>'
      + '<style>@keyframes stripeSpin{to{transform:rotate(360deg)}}</style>';
    (async () => {
      try{
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "refreshConnectStatus", authorName: currentAuthor })
        });
        const json = await res.json();
        if(json && json.success){
          currentData.stripeOnboardingStatus = json.status;
          if(json.status === "complete") justFinishedNote = true;
          else if(json.status === "pending") stillMissingNote = true;
        }
      }catch(e){}
      renderBody();
    })();
  } else {
    renderBody();
  }
  return wrap;
}

      cameFromWhatsLeft = false;
      cameFromNavSubmenu = false;

  app.appendChild(card);

/* ---------- SCREEN: ALL PRESALE ORDERS ---------- */
let presaleOrdersState = { lines: null, refunded: [], sort: "sales", error: "", statement: undefined };

async function loadPresaleOrders(){
  presaleOrdersState.error = "";
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "getAuthorOrders", authorName: currentAuthor })
    });
    const json = await res.json();
    if(json && json.success){ const all = json.lines || []; presaleOrdersState.lines = all.filter(l => !l.refunded); presaleOrdersState.refunded = all.filter(l => l.refunded); }
    else { presaleOrdersState.error = (json && json.error) || "Could not load your orders."; }
  }catch(e){
    presaleOrdersState.error = "Could not reach the server. Check your connection and try again.";
  }
}

async function toggleOrderDone(line, kind, done, rerender){
  const key = kind === "signed" ? "signedDone" : "personalizedDone";
  line[key] = done;
  rerender();
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "setOrderLineDone", authorName: currentAuthor, lineId: line.id, kind: kind, done: done })
    });
    const json = await res.json();
    if(!json || !json.success) throw new Error((json && json.error) || "save failed");
  }catch(e){
    line[key] = !done;
    rerender();
    showToast("Couldn't save that check mark. Please try again.");
  }
}

  card.appendChild(tabs);

  const small = "font-size:12.5px;color:#6b7080;margin-top:3px;";

  const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const money$ = n => "$" + (Math.round((n || 0) * 100) / 100).toFixed(2);
  const inSet = l => !!(l.seriesSetId && String(l.seriesSetId).trim());
  // Same wording as the buyer's receipt: "Island Love series", "Title + swag pack".
  const hasSwag = l => /\s\+ Swag pack$/i.test(String(l.title || ""));
  const bareTitle = l => String(l.title || "").replace(/\s\+ Swag pack$/i, "");
  const seriesLbl = n => { n = String(n || "").trim(); return /\bseries\b/i.test(n) ? n : (n ? n + " series" : "Series"); };

  // "Where your money came from": series sets vs single books, with dollars.
  function salesView(){
    const lines = st.lines;
    const sets = {}, seriesAgg = {}, singles = {};
    let total = 0;
    lines.forEach(l => {
      total += (l.price || 0);
      if(inSet(l)){
        const sid = l.seriesSetId;
        const nm = l.seriesName || "Series";
        if(!sets[sid]) sets[sid] = nm;
        const a = seriesAgg[nm] || (seriesAgg[nm] = { setIds:{}, setLines:{}, setSwag:{}, dollars:0, titles:{} });
        a.setIds[sid] = 1; a.dollars += (l.price || 0); a.titles[bareTitle(l)] = 1;
        a.setLines[sid] = (a.setLines[sid] || 0) + 1;
        if(hasSwag(l)) a.setSwag[sid] = (a.setSwag[sid] || 0) + 1;
      } else {
        const key = bareTitle(l) + (hasSwag(l) ? " + swag pack" : "");
        const g = singles[key] || (singles[key] = { count:0, dollars:0 });
        g.count++; g.dollars += (l.price || 0);
      }
    });
    const setCount = Object.keys(sets).length;
    const singleCount = lines.filter(l => !inSet(l)).length;
    body.innerHTML = "";
    const top = document.createElement('div');
    top.style.cssText = "background:#F7EFE1;border-radius:12px;padding:14px 16px;line-height:1.7;margin-bottom:6px;";
    top.innerHTML = `<div><b>${setCount}</b> series set${setCount===1?"":"s"} sold</div>`
      + `<div><b>${singleCount}</b> single book${singleCount===1?"":"s"} sold</div>`
      + `<div style="margin-top:6px;font-size:17px;"><b>${money$(total)}</b> in sales</div>`
      + `<div style="${small}">Before Stripe's processing fee. Your payout amounts are on your payouts screen.</div>`;
    body.appendChild(top);
    const names = Object.keys(seriesAgg).sort((a,b)=>a.localeCompare(b));
    if(names.length){
      const h = document.createElement('div');
      h.style.cssText = "font-weight:700;margin:16px 0 2px;";
      h.textContent = "Series";
      body.appendChild(h);
      names.forEach(nm => {
        const a = seriesAgg[nm], n = Object.keys(a.setIds).length, per = Object.keys(a.titles).length;
        const anyIds = Object.keys(a.setSwag);
        const fullIds = anyIds.filter(id => a.setSwag[id] === a.setLines[id]);
        const sw = (fullIds.length === n) ? n : 0;   // headline only when every set had swag on every book
        const swagNote = (!sw && anyIds.length) ? ` \u00b7 ${anyIds.length} set${anyIds.length===1?"":"s"} with some swag packs` : "";
        const row = document.createElement('div');
        row.style.cssText = rowCss;
        row.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="font-weight:600;">${esc(seriesLbl(nm))}${sw ? " + swag pack" : ""}</span><span style="font-weight:700;">${money$(a.dollars)}</span></div>`
          + `<div style="${small}">${n} set${n===1?"":"s"} sold \u00b7 ${per} book${per===1?"":"s"} in each set${swagNote}</div>`;
        body.appendChild(row);
      });
    }
    const st2 = Object.keys(singles).sort((a,b)=>a.localeCompare(b));
    if(st2.length){
      const h = document.createElement('div');
      h.style.cssText = "font-weight:700;margin:16px 0 2px;";
      h.textContent = "Single books";
      body.appendChild(h);
      st2.forEach(t => {
        const g = singles[t];
        const row = document.createElement('div');
        row.style.cssText = rowCss;
        row.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="font-weight:600;">${esc(t)}</span><span style="font-weight:700;">${money$(g.dollars)}</span></div>`
          + `<div style="${small}">${g.count} cop${g.count===1?"y":"ies"} sold on its own</div>`;
        body.appendChild(row);
      });
    }
    // refunded orders are intentionally not shown
  }

  // The author's own money summary: books, sales tax collected on them (not
  // theirs), their share of Stripe's fee, and what they were paid.
  function statementView(){
    const S = st.statement;
    if(S === undefined){
      body.innerHTML = `<div class="section-sub">Loading your statement\u2026</div>`;
      st.statement = null;
      fetch(APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"getAuthorStatement", authorName: currentAuthor }) })
        .then(r => r.json()).then(j => { st.statement = (j && j.success) ? j : { error: (j && j.error) || "Could not load your statement." }; if(currentScreen === "presale-orders" && st.sort === "statement") statementView(); })
        .catch(() => { st.statement = { error:"Could not reach the server. Check your connection and try again." }; if(currentScreen === "presale-orders" && st.sort === "statement") statementView(); });
      return;
    }
    if(S === null) return;
    if(S.error){ body.innerHTML = `<div class="section-sub" style="color:#b00020;">${esc(S.error)}</div>`; return; }
    body.innerHTML = "";
    const row = (a,b,bold,muted) => `<div style="display:flex;justify-content:space-between;gap:12px;${bold?"font-weight:700;":""}${muted?"font-size:12.5px;color:#6b7080;padding-left:12px;":""}"><span>${a}</span><span>${b}</span></div>`;
    const top = document.createElement('div');
    top.style.cssText = "background:#F7EFE1;border-radius:12px;padding:14px 16px;line-height:1.7;margin-bottom:10px;";
    top.innerHTML = row("Book sales (before tax)", money$(S.subtotal))
      + row("Stripe fees (your share)", "-" + money$(S.feeShare))
      + `<div style="border-top:1px solid #E4D8C2;margin-top:6px;padding-top:6px;font-size:17px;">${row("Paid out to you", money$(S.net), true)}</div>`
      + `<div style="${small}">${S.bookCount} book${S.bookCount===1?"":"s"} in ${S.orders.length} order${S.orders.length===1?"":"s"}.</div>`;
    body.appendChild(top);
    const tx = document.createElement('div');
    tx.style.cssText = "border:1px solid rgba(12,30,61,0.15);border-radius:12px;padding:12px 16px;margin-bottom:10px;line-height:1.6;";
    tx.innerHTML = `<div style="font-weight:700;">Sales tax: ${money$(S.tax)}</div>`
      + `<div style="${small}margin-bottom:6px;">Buyers paid ${S.taxPct}% sales tax on your books at checkout. It is collected separately and is not part of your payout.</div>`
      + S.taxParts.map(t => row(esc(t.name) + " " + t.pct.toFixed(2) + "%", money$(t.amount), false, true)).join("");
    body.appendChild(tx);
    S.orders.slice().reverse().forEach(o => {
      const d = o.createdAt ? new Date(o.createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
      const r = document.createElement('div');
      r.style.cssText = rowCss;
      r.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="font-weight:600;">${esc(o.buyerName || "A reader")} \u00b7 ${d}</span><span style="font-weight:700;">${money$(o.subtotal)}</span></div>`
        + `<div style="${small}">${o.books.map(b => esc(b.title)).join(", ")}</div>`
        + `<div style="${small}">Tax on these books ${money$(o.tax)} \u00b7 fee share -${money$(o.feeShare)} \u00b7 paid to you ${money$(o.net)}</div>`;
      body.appendChild(r);
    });
    const btn = document.createElement('button');
    btn.className = "btn btn-secondary btn-block";
    btn.style.marginTop = "16px";
    btn.textContent = "Email me this statement";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Sending\u2026";
      try{
        const res = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
          body: JSON.stringify({ action:"emailAuthorStatement", authorName: currentAuthor }) });
        const j = await res.json();
        btn.textContent = (j && j.success) ? "Sent! Check your email." : ((j && j.error) || "Couldn't send. Try again.");
      }catch(e){ btn.textContent = "Couldn't send. Try again."; }
      setTimeout(() => { btn.disabled = false; btn.textContent = "Email me this statement"; }, 4000);
    };
    body.appendChild(btn);
    const note = document.createElement('div');
    note.style.cssText = small + "margin-top:10px;";
    note.textContent = "A summary for your records, not tax advice. Ask your own tax professional how to report your book income.";
    body.appendChild(note);
  }

  // Orders that were refunded: shown plainly, never counted in any total.
  function refundedSection(){
    const rl = st.refunded || [];
    if(!rl.length) return;
    const orders = {};
    rl.forEach(l => { (orders[l.orderId] || (orders[l.orderId] = [])).push(l); });
    const h = document.createElement('div');
    h.style.cssText = "font-weight:700;margin:22px 0 2px;";
    h.textContent = "Refunded (not counted above)";
    body.appendChild(h);
    Object.values(orders).sort((a,b) => b[0].createdAt - a[0].createdAt).forEach(ls => {
      const d = ls[0].createdAt ? new Date(ls[0].createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
      const sets = {}; ls.forEach(l => { if(inSet(l)) sets[l.seriesSetId] = seriesLbl(l.seriesName); });
      const names = [...new Set(ls.filter(l => !inSet(l)).map(bareTitle).map((t,i) => t + (hasSwag(ls.filter(l => !inSet(l))[i]) ? " + swag pack" : "")).concat(Object.values(sets)))];
      const box = document.createElement('div');
      box.style.cssText = rowCss + "opacity:.75;";
      box.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;"><span style="font-weight:600;">${esc(ls[0].buyerName || "A reader")}</span><span style="background:#b00020;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;">REFUNDED</span></div>`
        + `<div style="${small}">${d} \u00b7 ${esc(names.join(", "))}</div>`;
      body.appendChild(box);
    });
  }

  function checklist(kind){
    const isSigned = kind === "signed";
    const items = st.lines.filter(l => isSigned ? (l.signed && !l.personalizedName.trim()) : !!l.personalizedName.trim());
    const doneKey = isSigned ? "signedDone" : "personalizedDone";
    if(!items.length){
      body.innerHTML = `<div class="section-sub">${isSigned ? "No signed copies have been ordered yet." : "No personalized copies have been ordered yet."}</div>`;
      return;
    }
    items.sort((a,b) => (a[doneKey]?1:0) - (b[doneKey]?1:0) || a.title.localeCompare(b.title) || a.createdAt - b.createdAt);
    const doneCount = items.filter(l => l[doneKey]).length;
    body.innerHTML = `<div class="section-sub" style="margin-bottom:8px;">${doneCount} of ${items.length} done</div>`;
    items.forEach(l => {
      const row = document.createElement('label');
      row.style.cssText = rowCss + "display:flex;gap:12px;align-items:flex-start;cursor:pointer;";
      const cb = document.createElement('input');
      cb.type = "checkbox"; cb.checked = !!l[doneKey];
      cb.style.cssText = "width:22px;height:22px;margin-top:2px;flex:none;accent-color:#E4593F;";
      cb.onchange = () => toggleOrderDone(l, kind, cb.checked, paint);
      const txt = document.createElement('div');
      txt.style.cssText = l[doneKey] ? "opacity:.5;text-decoration:line-through;" : "";
      txt.innerHTML = `<div style="font-weight:600;">${esc(l.title)}${inSet(l) ? ` <span style="font-weight:400;font-size:12px;color:#6b7080;">(in a ${esc(l.seriesName || "series")} set)</span>` : ""}</div>`
        + (isSigned
            ? `<div style="${small}">Ordered by ${esc(l.buyerName || "a reader")}</div>`
            : `<div style="${small}">Personalize to: <b>${esc(l.personalizedName)}</b></div>`);
      row.appendChild(cb); row.appendChild(txt);
      body.appendChild(row);
    });
  }

  function paint(){
    if(st.error){
      body.innerHTML = `<div class="section-sub" style="color:#b00020;">${esc(st.error)}</div>`;
      return;
    }
    if(st.lines === null){ body.innerHTML = `<div class="section-sub">Loading your orders…</div>`; return; }
    if(!st.lines.length){
      body.innerHTML = `<div class="section-sub">No presale orders yet. When someone orders one of your books, it will show up here.</div>`;
      return;
    }
    if(st.sort === "statement") return statementView();
    if(st.sort === "sales") return salesView();
    if(st.sort === "signed") return checklist("signed");
    if(st.sort === "personalized") return checklist("personalized");

    body.innerHTML = "";
    if(st.sort === "title"){
      const groups = {};
      st.lines.forEach(l => {
        const g = groups[l.title] || (groups[l.title] = { count:0, blank:0, signed:0, pers:0, single:0, inSet:0 });
        g.count++;
        if(inSet(l)) g.inSet++; else g.single++;
        if(l.signed && !l.personalizedName.trim()) g.signed++;
        if(l.personalizedName.trim()) g.pers++;
        if(!l.signed && !l.personalizedName.trim()) g.blank++;
      });
      Object.keys(groups).sort((a,b)=>a.localeCompare(b)).forEach(t => {
        const g = groups[t];
        const row = document.createElement('div');
        row.style.cssText = rowCss;
        row.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="font-weight:600;">${esc(t)}</span><span style="font-weight:700;">${g.count}</span></div>`
          + (g.inSet ? `<div style="${small}">${g.single} on its own \u00b7 ${g.inSet} as part of a series set</div>` : "")
          + `<div style="${small}">Blank: ${g.blank}. Signed: ${g.signed}. Personalized: ${g.pers}.</div>`;
        body.appendChild(row);
      });
      const total = document.createElement('div');
      total.className = "section-sub";
      total.style.marginTop = "14px";
      total.textContent = `${st.lines.length} book${st.lines.length===1?"":"s"} ordered in total.`;
      body.appendChild(total);
    } else {
      const orders = {};
      st.lines.forEach(l => { (orders[l.orderId] || (orders[l.orderId] = [])).push(l); });
      Object.values(orders).sort((a,b) => b[0].createdAt - a[0].createdAt).forEach(ls => {
        const box = document.createElement('div');
        box.style.cssText = rowCss;
        const d = ls[0].createdAt ? new Date(ls[0].createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
        let html = `<div style="font-weight:600;">${esc(ls[0].buyerName || "A reader")}</div><div style="${small}">${d}</div>`;
        const tagsOf = l => [l.signed ? "Signed" : "Not signed", l.personalizedName.trim() ? "Personalized to " + esc(l.personalizedName) : "Not personalized"].join(" · ");
        const setsInOrder = {}, setOrder = [];
        ls.forEach(l => { if(inSet(l)){ if(!setsInOrder[l.seriesSetId]){ setsInOrder[l.seriesSetId] = []; setOrder.push(l.seriesSetId); } setsInOrder[l.seriesSetId].push(l); } });
        const perSeriesCount = {}; setOrder.forEach(id => { const nm = setsInOrder[id][0].seriesName || "Series"; perSeriesCount[nm] = (perSeriesCount[nm] || 0) + 1; });
        const perSeriesSeen = {};
        const shownSets = {};
        ls.forEach(l => {
          if(inSet(l)){
            if(shownSets[l.seriesSetId]) return;
            shownSets[l.seriesSetId] = true;
            const grp = setsInOrder[l.seriesSetId];
            const nm = l.seriesName || "Series";
            perSeriesSeen[nm] = (perSeriesSeen[nm] || 0) + 1;
            const label = perSeriesCount[nm] > 1 ? `${esc(nm)} \u2014 Series (set ${perSeriesSeen[nm]} of ${perSeriesCount[nm]})` : `${esc(nm)} \u2014 Series`;
            html += `<div style="margin-top:8px;"><b>${label}</b><div style="${small}">Includes: ${grp.map(x => esc(x.title)).join(", ")}</div><div style="${small}">${tagsOf(l)}</div></div>`;
          } else {
            html += `<div style="margin-top:8px;">${esc(l.title)}<div style="${small}">${tagsOf(l)}</div></div>`;
          }
        });
        box.innerHTML = html;
        body.appendChild(box);
      });
    }
  }

  const link = document.createElement('div');
  link.className = "home-link";
  link.style.marginTop = "20px";
  link.textContent = "Return to home";
  link.onclick = () => { currentScreen = "home"; render(); };
  card.appendChild(link);
  appendMainScreenLink(card);
  app.appendChild(card);

  paint();
  if(st.lines === null || st.error){
    loadPresaleOrders().then(() => { if(currentScreen === "presale-orders") paint(); });
  }
}

/* ---------- SCREEN: NOTIFICATIONS ---------- */
const MISC_FUN_KEYS = ["whatYouWrite","funTalent","drink","booksWritten","rentFreeBook","musicalTitle","numberGuess","heroineBook","superpower","readingFormat","sportsSong"];
const NOTIF_LINKS_KEYS = ["linkWebsite","linkInstagram","linkFacebook","linkCatalogue","linkNewsletter","linkTiktok","linkThreads","linkPodcast","linkYoutube","linkEtsy","linkBookbub","linkSpotify","linkOtherUrl"];

function formatTimeDisplay(t){
  if(!t) return "";
  const parts = t.split(":");
  const h = parseInt(parts[0], 10);
  const m = parts[1] || "00";
  const period = h >= 12 ? "PM" : "AM";
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${m} ${period}`;
}

function notifOptionalGaps(){
  const gaps = [];
  if(!isFieldFilled("logo", "file") && linkStatusOf("logo") !== "none") gaps.push({key:"logo", label:"Add your logo"});
  if(MISC_FUN_KEYS.some(k => !isFieldFilled(k))) gaps.push({key:"miscFun", label:'The Misc Fun Stuff (those were the fun questions like "If you were to write a cheesy musical about your life, what would it be called?")'});
  const linksMarkedDone = currentData.linksListStatus === "That is all the links I will be adding (will mark this completed on your To-Do list)";
  if(NOTIF_LINKS_KEYS.some(k => !isFieldFilled(k) && linkStatusOf(k) !== "none" && (linkStatusOf(k) === "later" || !linksMarkedDone))) gaps.push({key:"links", label:"Links to places readers can find you"});
  return gaps;
}

function renderNotifications(step){
  app.appendChild(logoLockup());
  const card = document.createElement('div');
  card.className = "card";
  card.innerHTML = `
    <div class="eyebrow">Bookish Summer Soirée</div>
    <h1 class="section-title">${step.title}</h1>
    <div class="section-sub">Whew! That was a ton of information, but I promise all of it will help make everything run smoothly for all of us leading up to the Soirée.</div>
  `;

  // Captured once, before any interaction on this screen, so the copy
  // reflects what they chose back on General Info — not any click they
  // make here (which would otherwise flip this mid-screen).
  const arrivedAlreadyOptedIn = currentData.reminderOptIn === "Yes";

  if(arrivedAlreadyOptedIn){
    if(!currentData.reminderFrequency) currentData.reminderFrequency = "Daily";
    if(!currentData.reminderTime) currentData.reminderTime = "09:00";
    if(currentData.reminderFrequency === "Weekly" && !currentData.reminderDay) currentData.reminderDay = "Monday";
  }

  const checklist = computeChecklist();
  const incompleteRequired = [];
  checklist.forEach(s => s.rows.forEach(r => { if(r.required && !r.done) incompleteRequired.push(r.label); }));
  const optionalGaps = notifOptionalGaps();

  const dynamicWrap = document.createElement('div');
  card.appendChild(dynamicWrap);

  function checkboxesBlock(){
    const wrap = document.createElement('div');
    const note = document.createElement('div');
    note.className = "help";
    note.style.cssText = "margin-top:14px;line-height:1.6;";
    note.innerHTML = "Right now it is set for you to get reminders until you have completed all the <em>required</em> items."
      + (optionalGaps.length
          ? " The optional items are listed below. If you'd like to make sure you get any of those done as well, select any of them you'd like to make sure you get done, and the reminder emails will continue until they are done as well."
          : "");
    wrap.appendChild(note);

    if(optionalGaps.length){
      const included = (currentData.reminderIncludeOptional || "").split(",").filter(Boolean);
      optionalGaps.forEach(gap=>{
        const optWrap = document.createElement('label');
        optWrap.style.cssText = "display:flex;align-items:flex-start;gap:8px;padding:5px 2px 5px 20px;font-family:'Lora',serif;font-size:14px;cursor:pointer;";
        optWrap.innerHTML = `<input type="checkbox" style="margin-top:3px;accent-color:var(--terracotta);" ${included.indexOf(gap.key) !== -1 ? "checked" : ""}><span>${gap.label}</span>`;
        optWrap.querySelector('input').addEventListener('change', (e)=>{
          let list = (currentData.reminderIncludeOptional || "").split(",").filter(Boolean);
          if(e.target.checked){ if(list.indexOf(gap.key) === -1) list.push(gap.key); }
          else{ list = list.filter(k => k !== gap.key); }
          currentData.reminderIncludeOptional = list.join(",");
        });
        wrap.appendChild(optWrap);
      });
    }
    return wrap;
  }

  function frequencyFields(){
    const wrap = document.createElement('div');

    const freqField = document.createElement('div');
    freqField.className = "field";
    freqField.innerHTML = `<label>How often?</label>`;
    const freqGroup = document.createElement('div');
    freqGroup.className = "radio-group";
    ["Daily","Weekly"].forEach(opt=>{
      const optWrap = document.createElement('label');
      optWrap.className = "radio-option" + (currentData.reminderFrequency === opt ? " selected" : "");
      optWrap.innerHTML = `<input type="radio" name="notifFrequency" value="${opt}" ${currentData.reminderFrequency===opt?'checked':''}><span>${opt}</span>`;
      optWrap.querySelector('input').addEventListener('change', ()=>{
        currentData.reminderFrequency = opt;
        renderDynamic();
      });
      freqGroup.appendChild(optWrap);
    });
    freqField.appendChild(freqGroup);
    wrap.appendChild(freqField);

    if(currentData.reminderFrequency === "Weekly"){
      const dayField = document.createElement('div');
      dayField.className = "field";
      dayField.innerHTML = `<label>Which day?</label>`;
      const daySel = document.createElement('select');
      ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].forEach(d=>{
        const optEl = document.createElement('option');
        optEl.value = d; optEl.textContent = d;
        if((currentData.reminderDay || "Monday") === d) optEl.selected = true;
        daySel.appendChild(optEl);
      });
      daySel.addEventListener('change', ()=>{ currentData.reminderDay = daySel.value; renderDynamic(); });
      dayField.appendChild(daySel);
      wrap.appendChild(dayField);
      if(!currentData.reminderDay) currentData.reminderDay = "Monday";
    }

    const timeField = document.createElement('div');
    timeField.className = "field";
    timeField.innerHTML = `<label>What time?</label>`;
    timeField.appendChild(buildReminderTimeInput());
    wrap.appendChild(timeField);

    return wrap;
  }

  function buildReminderTimeInput(){
    const timeWrap = document.createElement('div');
    timeWrap.style.cssText = "display:flex;align-items:center;gap:6px;";

    let h24 = 9, mm = 0;
    if(currentData.reminderTime){
      const parts = currentData.reminderTime.split(":");
      if(parts.length === 2){
        const ph = parseInt(parts[0], 10), pm = parseInt(parts[1], 10);
        if(!isNaN(ph)) h24 = ph;
        if(!isNaN(pm)) mm = pm;
      }
    }
    const period = h24 >= 12 ? "PM" : "AM";
    const h12 = ((h24 + 11) % 12) + 1;

    const hInp = document.createElement('input');
    hInp.type = "tel";
    hInp.inputMode = "numeric";
    hInp.maxLength = 2;
    hInp.style.cssText = "width:48px;text-align:center;";
    hInp.value = String(h12);

    const colon = document.createElement('span');
    colon.textContent = ":";
    colon.style.fontWeight = "600";

    const mInp = document.createElement('input');
    mInp.type = "tel";
    mInp.inputMode = "numeric";
    mInp.maxLength = 2;
    mInp.style.cssText = "width:48px;text-align:center;";
    mInp.value = String(mm).padStart(2, "0");

    const periodSel = document.createElement('select');
    periodSel.style.width = "72px";
    ["AM","PM"].forEach(p=>{
      const o = document.createElement('option');
      o.value = p;
      o.textContent = p;
      if(p === period) o.selected = true;
      periodSel.appendChild(o);
    });

    function updateStored(){
      const hh = parseInt(hInp.value, 10);
      const mi = parseInt(mInp.value, 10);
      if(isNaN(hh) || hh < 1 || hh > 12) return;
      if(isNaN(mi) || mi < 0 || mi > 59) return;
      let hh24 = hh % 12;
      if(periodSel.value === "PM") hh24 += 12;
      currentData.reminderTime = `${String(hh24).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
    }

    hInp.addEventListener('input', ()=>{
      hInp.value = hInp.value.replace(/\D/g,'').slice(0,2);
      updateStored();
      if(hInp.value.length === 2) mInp.focus();
    });
    mInp.addEventListener('input', ()=>{
      mInp.value = mInp.value.replace(/\D/g,'').slice(0,2);
      updateStored();
    });
    mInp.addEventListener('keydown', (e)=>{ if(e.key === "Backspace" && !mInp.value) hInp.focus(); });
    periodSel.addEventListener('change', updateStored);

    updateStored(); // reflect the parsed/defaulted value immediately

    timeWrap.appendChild(hInp);
    timeWrap.appendChild(colon);
    timeWrap.appendChild(mInp);
    timeWrap.appendChild(periodSel);
    return timeWrap;
  }

  function renderDynamic(){
    dynamicWrap.innerHTML = "";

    if(arrivedAlreadyOptedIn){
      const freqText = currentData.reminderFrequency === "Weekly"
        ? `Each ${currentData.reminderDay} at ${formatTimeDisplay(currentData.reminderTime)}`
        : `Every day at ${formatTimeDisplay(currentData.reminderTime)}`;
      const text = document.createElement('div');
      text.className = "help";
      text.style.cssText = "margin-top:10px;line-height:1.6;";
      text.innerHTML = `You'll get your notification (<strong>${freqText}</strong>) to help you finish up all the required items.`;
      dynamicWrap.appendChild(text);
      dynamicWrap.appendChild(checkboxesBlock());
      return;
    }

    // Not opted in when they arrived on this screen.
    const intro = document.createElement('div');
    intro.className = "help";
    intro.style.cssText = "margin-top:10px;line-height:1.6;";
    let html = "I want to double check with you about email reminders.";
    if(incompleteRequired.length){
      html += `<br><br>You have some required information (${incompleteRequired.map(l=>escapeAttr(l)).join(", ")}) that you still need to fill out and might want reminders for.`;

    intro.innerHTML = html;
    dynamicWrap.appendChild(intro);

    if(optionalGaps.length){
      const optPara = document.createElement('div');

      dynamicWrap.appendChild(optPara);
    }

    if(currentData.reminderOptIn === "Yes"){
      dynamicWrap.appendChild(frequencyFields());
      if(currentData.reminderFrequency && currentData.reminderTime && (currentData.reminderFrequency !== "Weekly" || currentData.reminderDay)){
        dynamicWrap.appendChild(checkboxesBlock());

    }

    if(currentData.reminderOptIn !== "Yes"){
      const btnRow = document.createElement('div');

      btnRow.appendChild(yesBtn);

      dynamicWrap.appendChild(btnRow);
    }
  }

  renderDynamic();

  const enteredViaShortcut = cameFromWhatsLeft || cameFromNavSubmenu;

  if(!enteredViaShortcut){
    const savePrompt = document.createElement('div');
    savePrompt.className = "save-prompt";

    card.appendChild(savePrompt);

// The "anywhere else" place is two fields (name + link) but one choice, so its
// "I don't have anything else" / "come back later" status is stored once,
// under the name field.
function linkStatusOf(key){
  if(key === "linkOtherUrl") key = "linkOtherName";
  return (currentData.linkStatuses && currentData.linkStatuses[key]) || "";
}
function setLinkStatus(key, val){
  if(!currentData.linkStatuses) currentData.linkStatuses = {};
  if(val) currentData.linkStatuses[key] = val; else delete currentData.linkStatuses[key];
}

function renderField(f){
  const wrap = document.createElement('div');
  wrap.className = "field";
  const label = document.createElement('label');
  label.innerHTML = f.label + (f.required ? ' <span class="req">*</span>' : '');
  if(f.label) wrap.appendChild(label);
  // Link fields: the "later"/"don't have it" buttons sit right under the link's name.
  let linkRow = null;
  if(f.linkStatus){
    linkRow = document.createElement('div');
    linkRow.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px;";
    wrap.appendChild(linkRow);
  }
  if(f.help || f.helpHtml){
    const help = document.createElement('div');
    help.className = "help";
    if(f.helpHtml) help.innerHTML = f.helpHtml;
    else help.textContent = f.help;
    wrap.appendChild(help);
  }

  if(f.type === "textarea"){
    const ta = document.createElement('textarea');
    ta.rows = 4; ta.dataset.key = f.key;
    ta.value = currentData[f.key] || "";
    wrap.appendChild(ta);
  } else if(f.type === "file"){
    wrap.appendChild(buildFileUpload(f));
    if(f.key === "logo" && !isFieldFilled("logo","file")){
      const nb = document.createElement('button');
      nb.type = "button"; nb.textContent = "I don't have a logo";
      const paintNb = () => {
        const on = linkStatusOf("logo") === "none";
        nb.style.cssText = "font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;font-family:inherit;line-height:1.3;margin-top:6px;"
          + "border:1px solid " + (on ? "var(--terracotta,#E4593F)" : "rgba(12,30,61,0.2)") + ";"
          + "background:" + (on ? "rgba(228,89,63,0.12)" : "transparent") + ";color:inherit;opacity:" + (on ? "1" : ".75") + ";";
      };
      nb.onclick = () => { setLinkStatus("logo", linkStatusOf("logo") === "none" ? "" : "none"); paintNb(); };
      paintNb();
      wrap.appendChild(nb);
    }
  } else if(f.type === "radio"){
    const group = document.createElement('div');
    group.className = "radio-group";
    group.dataset.key = f.key;
    f.options.forEach(opt=>{
      const optWrap = document.createElement('label');
      optWrap.className = "radio-option" + (currentData[f.key]===opt ? " selected":"");
      optWrap.innerHTML = `<input type="radio" name="${f.key}" value="${escapeAttr(opt)}" ${currentData[f.key]===opt?'checked':''}><span>${statusOptionHtml(opt)}${(f.optionNotes && f.optionNotes[opt]) ? `<span style="display:block;font-weight:400;font-size:.8em;opacity:.8;margin-top:2px;">${escapeHtmlFull(f.optionNotes[opt])}</span>` : ""}</span>`;
      optWrap.querySelector('input').addEventListener('change', (e)=>{
        group.querySelectorAll('.radio-option').forEach(el=>el.classList.remove('selected'));
        optWrap.classList.add('selected');
      });
      group.appendChild(optWrap);
    });
    wrap.appendChild(group);
  } else if(f.type === "select"){
    const sel = document.createElement('select');
    sel.dataset.key = f.key;
    (f.options || []).forEach(opt=>{
      const optEl = document.createElement('option');
      optEl.value = opt;
      optEl.textContent = opt;
      if((currentData[f.key] || f.default) === opt) optEl.selected = true;
      sel.appendChild(optEl);
    });
    wrap.appendChild(sel);
  } else {
    const inp = document.createElement('input');
    inp.type = f.type;
    inp.dataset.key = f.key;
    inp.value = currentData[f.key] || f.default || "";
    if(f.type === "url") inp.placeholder = "https://";
    if(f.type === "tel") inp.inputMode = "tel";
    if(f.type === "number"){
      inp.inputMode = "numeric";
      inp.pattern = "[0-9]*";
    }
    if(f.autoCapitalize) inp.autocapitalize = "sentences";
    if(f.titleCase){
      inp.autocapitalize = "words";
      inp.addEventListener('blur', ()=>{
        const cased = titleCaseValue(inp.value);
        if(cased !== inp.value) inp.value = cased;
      });
    }
    if(f.placeholder) inp.placeholder = f.placeholder;
    wrap.appendChild(inp);
    if(f.linkStatus){
      // Two small, quiet choices instead of "leave blank": one keeps the link
      // on the author's To-Do list, the other takes it off.
      const row = linkRow;
      const mkb = (label, val) => {
        const b = document.createElement('button');
        b.type = "button"; b.textContent = label; b.dataset.val = val;
        b.onclick = () => { setLinkStatus(f.key, linkStatusOf(f.key) === val ? "" : val); paint(); };
        return b;
      };
      const laterB = mkb(f.laterLabel || "I have this, but I'll come back to fill it in later", "later");
      const noneB = mkb(f.noneLabel || "I don't have this", "none");
      function paint(){
        [laterB, noneB].forEach(b => {
          const on = linkStatusOf(f.key) === b.dataset.val;
          b.style.cssText = "font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;font-family:inherit;line-height:1.3;"
            + "border:1px solid " + (on ? "var(--terracotta,#E4593F)" : "rgba(12,30,61,0.2)") + ";"
            + "background:" + (on ? "rgba(228,89,63,0.12)" : "transparent") + ";color:inherit;opacity:" + (on ? "1" : ".75") + ";";
        });
        row.style.display = inp.value.trim() ? "none" : "flex";
      }
      row.appendChild(laterB); row.appendChild(noneB);
      inp.addEventListener('input', () => { if(inp.value.trim()) setLinkStatus(f.key, ""); paint(); });
      paint();
    }
  }
  return wrap;
}
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

// Full HTML-escape (all five special chars), used before turning plain text
// into innerHTML — unlike escapeAttr, which only guards quotes inside an
// attribute string.
function escapeHtmlFull(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Renders a blurb's lightweight **bold** / *italic* markup as safe HTML.
// The raw text is HTML-escaped first, so this can never inject markup from
// what an author typed — only the ** and * runs we add ourselves afterward
// turn into <strong>/<em>. Bold is matched before italic so **text** isn't
// first swallowed by the italic rule.
function renderFormattedBlurb(text){
  let html = escapeHtmlFull(text || "");
  html = html.replace(/\*\*([^\n*](?:[^\n*]|\*(?!\*))*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^\n*]+?)\*/g, '<em>$1</em>');
  return html.replace(/\n/g, '<br>');
}

// Wraps (or, if already wrapped, unwraps) the current textarea selection
// with a marker ("**" for bold, "*" for italic) — used by the Blurb field's
// B/I toolbar buttons.
function wrapTextareaSelection(textarea, marker){
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const val = textarea.value;
  const selected = val.slice(start, end);
  const before = val.slice(0, start);
  const after = val.slice(end);
  let newVal, newStart, newEnd;
  if(selected.length >= marker.length * 2 && selected.startsWith(marker) && selected.endsWith(marker)){
    const inner = selected.slice(marker.length, selected.length - marker.length);
    newVal = before + inner + after;
    newStart = start;
    newEnd = start + inner.length;
  } else {
    newVal = before + marker + selected + marker + after;
    newStart = start + marker.length;
    newEnd = newStart + selected.length;
  }
  textarea.value = newVal;
  textarea.focus();
  textarea.setSelectionRange(newStart, newEnd);
  textarea.dispatchEvent(new Event('input'));
}

// Status-toggle labels like "...(will mark this completed on your To-Do
// list)" should read as a subtle aside, not compete with the main choice —
// splits off the trailing parenthetical and renders it smaller/unbolded.
function statusOptionHtml(text){
  const idx = text.indexOf(" (");
  if(idx === -1) return text;
  const main = text.slice(0, idx);
  const paren = text.slice(idx + 1);
  return `<span style="display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;">`
    + `<span>${main}</span>`
    + `<span style="font-weight:400;font-size:12px;opacity:.7;margin-top:4px;">${paren}</span>`
    + `</span>`;
}

// Builds the divider + oval status-toggle buttons used at the bottom of
// list-style screens (Links, Donated Titles, Books You Will Sell, Presale
// Books) to mark that list complete or still-in-progress. The row shrink-
// wraps to its widest button (not the full card) and both buttons stretch
// to match that width, so they read as a matched pair rather than two
// differently-sized pills. Insert the returned element right before the
// save-prompt text.
function buildStatusToggle(dataKey, options, onChangeExtra){
  const wrap = document.createElement('div');
  wrap.style.cssText = "margin-top:30px;padding-top:22px;border-top:1px solid rgba(12,30,61,0.1);";

  const row = document.createElement('div');
  row.className = "btn-row";
  row.style.cssText = "display:inline-flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:0;";

  function restyleAll(){
    Array.from(row.children).forEach((b, i)=>{
      b.className = "btn btn-compact " + (currentData[dataKey] === options[i].value ? "btn-primary" : "btn-secondary");
    });
  }

  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type = "button";
    btn.innerHTML = statusOptionHtml(opt.text);
    btn.onclick = () => {
      currentData[dataKey] = opt.value;
      restyleAll();
      if(typeof onChangeExtra === 'function') onChangeExtra();
    };
    row.appendChild(btn);
  });
  restyleAll();
  wrap.appendChild(row);
  return wrap;
}

/* Capitalizes the first letter of each word without touching the rest —
   so "mcdonald" -> "Mcdonald" (preserves any deliberate internal
   capitalization like "McDonald" if it's already typed that way), and
   "o'brien" -> "O'Brien" since the apostrophe breaks the word boundary. */
function titleCaseValue(s){
  return String(s || "").replace(/\b\w/g, ch => ch.toUpperCase());
}

/* ---------- FILE UPLOAD (headshot / logo) ---------- */
function fileStorageKey(field){ return `bss2027:file:${slug(currentAuthor)}:${field}`; }

function buildFileUpload(f){
  const box = document.createElement('div');
  const urlKey = f.key + "Url";
  const hasExisting = !!(currentData[urlKey] || currentData[f.key + "UploadedAt"]);
  const status = document.createElement('div');
  status.className = "help";
  status.style.marginTop = "0";
  status.textContent = hasExisting
    ? (currentData[f.key + "UploadedAt"] ? `Uploaded — last updated ${new Date(currentData[f.key + "UploadedAt"]).toLocaleString()}` : "Uploaded.")
    : "No file uploaded yet.";
  const preview = document.createElement('img');
  preview.style.cssText = "max-width:140px;max-height:140px;border-radius:10px;display:none;margin:10px 0;box-shadow:0 2px 10px rgba(12,30,61,0.12);";

  const inp = document.createElement('input');
  inp.type = "file";
  inp.accept = "image/png,image/jpeg,image/webp";
  inp.style.cssText = "font-family:'Montserrat',sans-serif;font-size:13px;";

  inp.addEventListener('change', async ()=>{
    const file = inp.files[0];
    if(!file) return;
    status.textContent = "Uploading…";
    try{
      const isLogo = f.key === "logo";
      const mimeType = isLogo ? "image/png" : "image/jpeg";
      const dataUrl = await resizeImage(file, 1600, mimeType, 0.85);

      // Actually wait for and check the Drive upload — silently firing this off
      // and assuming success is exactly what let a failed upload go unnoticed.
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"uploadFile", authorName: currentAuthor, fileType: f.key, base64: dataUrl, mimeType })
      });
      const json = await res.json();
      if(!json || !json.success) throw new Error((json && json.error) || "Upload didn't complete.");

      currentData[urlKey] = json.url;
      currentData[f.key + "UploadedAt"] = new Date().toISOString();
      if(currentStepId === "general-info") currentData.meta.generalInfoUpdatedAt = new Date().toISOString();
      localCache.set(fileStorageKey(f.key), dataUrl, true);
      await saveAuthorData(currentAuthor, currentData);

      status.textContent = `Uploaded — last updated ${new Date(currentData[f.key + "UploadedAt"]).toLocaleString()}`;
      preview.src = dataUrl;
      preview.style.display = "block";
      showToast("Uploaded!");
    }catch(e){
      status.textContent = "Upload didn't go through (" + (e.message || "unknown error") + ") — please try again.";
      showToast((f.label || "File") + " upload failed — please try again");
    }
  });

  box.appendChild(status);
  box.appendChild(preview);
  box.appendChild(inp);

  if(currentData[urlKey]){
    // Server (Drive) has the real file — show it directly, no round-trip needed.
    const idMatch = currentData[urlKey].match(/\/d\/([^/]+)/);
    preview.src = idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800` : currentData[urlKey];
    preview.style.display = "block";
  } else if(currentData[f.key + "UploadedAt"]){
    localCache.get(fileStorageKey(f.key), true).then(res=>{
      if(res){ preview.src = res.value; preview.style.display = "block"; }
    });
  }
  return box;
}

function resizeImage(file, maxDim, mime, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL(mime, quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- QR CODE GENERATION ---------- */
// "Anywhere else" has no ready-made artwork, so its tile (circle, link icon
// and the author's own name for it) is drawn on the spot in the same layout.
const QR_OTHER_KEY = "linkOtherUrl";
function qrKeysAll(){ return Object.keys(QR_TEMPLATES).concat([QR_OTHER_KEY]); }
function buildOtherQrTemplate(name, color){
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 1500;
  const ctx = c.getContext('2d');
  const cx = 194, cy = 1217, r = 158;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  // simple chain-link icon
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-Math.PI/4);
  ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 20; ctx.lineCap = "round";
  const rr = (x,y,w,h,rad)=>{ ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad); ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath(); ctx.stroke(); };
  rr(-110,-34,120,68,34); rr(-10,-34,120,68,34);
  ctx.restore();
  // the name, shrunk to fit the space beside the circle
  const text = name.toUpperCase();
  const fam = '"Montserrat","Helvetica Neue",Arial,sans-serif';
  let size = 150;
  ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const maxW = 750;
  ctx.font = "400 " + size + "px " + fam;
  while(ctx.measureText(text).width > maxW && size > 48){ size -= 4; ctx.font = "400 " + size + "px " + fam; }
  let out = text;
  while(ctx.measureText(out).width > maxW && out.length > 1){ out = out.slice(0,-1); }
  if(out !== text) out = out.slice(0,-1) + "\u2026";
  ctx.fillText(out, 400, 1217);
  return c.toDataURL("image/png");
}
function qrTemplateFor(key, data){
  if(key !== QR_OTHER_KEY) return QR_TEMPLATES[key];
  const name = (((data || currentData).linkOtherName) || "").trim() || "Link";
  const color = "#0C1E3D";
  return { label:name, color, src:buildOtherQrTemplate(name, color) };
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function buildQrComposite(templateSrc, url, color){
  const templateImg = await loadImageEl(templateSrc);
  const canvas = document.createElement('canvas');
  canvas.width = templateImg.naturalWidth;
  canvas.height = templateImg.naturalHeight;
  const ctx = canvas.getContext('2d');
  // White background first — templates have transparent areas, and a PDF
  // needs a solid backing instead of showing through as black/transparent.
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(templateImg, 0, 0);

  const qrCanvas = document.createElement('canvas');
  new QRious({ element: qrCanvas, value: url, size: QR_SIZE_PX, foreground: color, background: "#FFFFFF", level: "M" });
  ctx.drawImage(qrCanvas, QR_LEFT_PX, QR_TOP_PX, QR_SIZE_PX, QR_SIZE_PX);

  return canvas.toDataURL("image/png");
}

function imageToPdfBase64(pngDataUrl, widthPx, heightPx, dpi){
  const widthIn = widthPx / dpi;
  const heightIn = heightPx / dpi;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: widthIn > heightIn ? "landscape" : "portrait",
    unit: "in",
    format: [widthIn, heightIn]
  });
  pdf.addImage(pngDataUrl, "PNG", 0, 0, widthIn, heightIn);
  return pdf.output("datauristring").split(",")[1]; // base64 only
}

/* Generates a QR for every filled-in link field and uploads each to the QR
   Drive folder as a white-background PDF. Runs in the background after
   saving the Links section — never blocks the save, and failures on one
   QR don't stop the others. */
async function generateAndUploadQrCodes(authorName, data){
  for(const key of qrKeysAll()){
    const url = data[key];
    if(!url || !url.trim()) continue;
    const tpl = qrTemplateFor(key, data);
    try{
      const compositePng = await buildQrComposite(tpl.src, url.trim(), tpl.color);
      const pdfBase64 = imageToPdfBase64(compositePng, 1200, 1500, 300);
      const filename = `${authorName} ${String(tpl.label).replace(/[\\/:*?"<>|]/g, "").trim() || "Link"}.pdf`;
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"uploadQr", authorName, platform: tpl.label, filename, base64: pdfBase64, mimeType: "application/pdf" })
      });
    }catch(e){ /* one QR failing shouldn't block the others */ }
  }
}

async function buildQrSheetCanvas(canvas, filledKeys){
  const SHEET_W = 1200;
  const MARGIN = 60;
  const GAP = 30;
  const innerW = SHEET_W - MARGIN*2;
  const columns = filledKeys.length <= 6 ? 2 : 3;
  const tileW = (innerW - GAP*(columns-1)) / columns;
  const tileH = tileW * (1500/1200);
  const rows = Math.ceil(filledKeys.length / columns);

  const headshotSize = 220;
  const headerH = 40 + headshotSize + 20 + 60 + 40;
  const gridH = rows*tileH + (rows-1)*GAP;
  const SHEET_H = headerH + gridH + 60;

  canvas.width = SHEET_W;
  canvas.height = SHEET_H;
  canvas.style.maxWidth = "100%";
  canvas.style.height = "auto";
  const ctx = canvas.getContext('2d');

  // Background + navy border, rounded corners
  const radius = 30;
  ctx.beginPath();
  ctx.moveTo(radius, 0);
  ctx.arcTo(SHEET_W, 0, SHEET_W, SHEET_H, radius);
  ctx.arcTo(SHEET_W, SHEET_H, 0, SHEET_H, radius);
  ctx.arcTo(0, SHEET_H, 0, 0, radius);
  ctx.arcTo(0, 0, SHEET_W, 0, radius);
  ctx.closePath();
  ctx.fillStyle = "#F7EFE1";
  ctx.fill();
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#0C1E3D";
  ctx.stroke();

  // Headshot (circle, uniform position/size)
  const hsCenterX = SHEET_W/2;
  const hsCenterY = 40 + headshotSize/2;
  ctx.save();
  ctx.beginPath();
  ctx.arc(hsCenterX, hsCenterY, headshotSize/2, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = "#E8DFC9";
  ctx.fillRect(hsCenterX-headshotSize/2, hsCenterY-headshotSize/2, headshotSize, headshotSize);
  try{
    if(currentData.headshotUrl){
      const idMatch = currentData.headshotUrl.match(/\/d\/([^/]+)/);
      // Drive's thumbnail endpoint is far more reliable for hotlinking than
      // uc?export=view, which often serves an interstitial page instead.
      const src = idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800` : currentData.headshotUrl;
      const img = await loadImageEl(src);
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side)/2, sy = (img.naturalHeight - side)/2;
      ctx.drawImage(img, sx, sy, side, side, hsCenterX-headshotSize/2, hsCenterY-headshotSize/2, headshotSize, headshotSize);
    }
  }catch(e){ /* leave placeholder fill if headshot can't load */ }
  ctx.restore();
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#0C1E3D";
  ctx.beginPath();
  ctx.arc(hsCenterX, hsCenterY, headshotSize/2, 0, Math.PI*2);
  ctx.stroke();

  // Name (uniform font/size/position)
  ctx.fillStyle = "#0C1E3D";
  ctx.font = "bold 42px Georgia, serif";
  ctx.textAlign = "center";
  ctx.fillText(currentData.fullName || currentAuthor, SHEET_W/2, hsCenterY + headshotSize/2 + 55);

  // QR grid — each tile gets a soft rounded navy border to match the sheet
  const tileRadius = 16;
  function roundedRectPath(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  let gy = headerH;
  for(let r = 0; r < rows; r++){
    const rowItems = filledKeys.slice(r*columns, r*columns + columns);
    const rowW = rowItems.length*tileW + (rowItems.length-1)*GAP;
    let gx = MARGIN + (innerW - rowW)/2;
    for(const key of rowItems){
      const tpl = qrTemplateFor(key);
      try{
        const composite = await buildQrComposite(tpl.src, currentData[key].trim(), tpl.color);
        const img = await loadImageEl(composite);

        // Soft drop shadow behind the tile, instead of a hard outline
        ctx.save();
        ctx.shadowColor = "rgba(12,30,61,0.25)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 6;
        ctx.fillStyle = "#FFFFFF";
        roundedRectPath(gx, gy, tileW, tileH, tileRadius);
        ctx.fill();
        ctx.restore();

        ctx.save();
        roundedRectPath(gx, gy, tileW, tileH, tileRadius);
        ctx.clip();
        ctx.drawImage(img, gx, gy, tileW, tileH);
        ctx.restore();
      }catch(e){ /* skip this tile on error, keep going */ }
      gx += tileW + GAP;
    }
    gy += tileH + GAP;
  }
}

/* Quick, forgiving check: catches obvious typos (missing @, missing dot,
   stray spaces) without actually confirming they own the address — that
   would mean sending a real verification email, which isn't what's needed
   here, just a typo-catcher. */
function isPlausibleEmail(str){
  if(!str) return true;
  const s = str.trim();
  if(!s) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
}

/* Quick, forgiving check: catches obvious typos (missing https://, no dot)
   without pinging the actual URL — that's what the Link Verification
   screen right after this one is for. */
function isPlausibleUrl(str){
  if(!str) return true;
  const s = str.trim();
  if(!s) return true;
  if(!/^https?:\/\//i.test(s)) return false;
  try{
    const u = new URL(s);
    if(!u.hostname || u.hostname.indexOf(".") === -1) return false;
    return true;
  }catch(e){ return false; }
}

/* If someone types a bare domain (e.g. "google.com" or "Google.com") with
   no protocol, no spaces, and a recognizable dot, quietly add "https://"
   for them rather than flagging it as broken. Anything that still doesn't
   look like a real domain (typos, random text, missing dot) is left alone
   so the format check can still catch it. */
function normalizeUrlValue(str){
  if(!str) return str;
  const s = str.trim();
  if(!s) return s;
  if(/^https?:\/\//i.test(s)) return s;
  if(!/\s/.test(s) && /^[a-z0-9.-]+\.[a-z]{2,}([/?#].*)?$/i.test(s)){
    return "https://" + s;
  }
  return s;
}

function findLinkFormatIssues(){
  const step = STEPS["links"];
  const issues = [];
  (step.fields || []).forEach(f=>{
    if(f.type !== "url") return;
    // Normalize here too (not just in collectFieldValues) so a bare domain
    // like "google.com" is treated as fine no matter which code path led
    // here, rather than depending on normalization having already run.
    if(currentData[f.key]) currentData[f.key] = normalizeUrlValue(currentData[f.key]);
    const val = currentData[f.key];
    if(val && !isPlausibleUrl(val)){
      issues.push(f);
    }
  });
  return issues;
}

function collectFieldValues(step){
  (step.fields || []).forEach(f=>{
    if(f.type === "file") return; // saved immediately on upload
    if(f.statusToggle) return; // saved directly onclick, not a DOM radio input
    if(f.type === "radio"){
      const checked = document.querySelector(`input[name="${f.key}"]:checked`);
      currentData[f.key] = checked ? checked.value : (currentData[f.key] || null);
    } else {
      const el = document.querySelector(`[data-key="${f.key}"]`);
      if(el){
        let newVal = f.type === "url" ? normalizeUrlValue(el.value) : el.value;
        if(f.titleCase) newVal = titleCaseValue(newVal);
        // If a link's value actually changed, its old verified/deferred status
        // no longer applies — it needs to be checked again.
        if(f.type === "url" && currentData[f.key] !== newVal && currentData.meta && currentData.meta.linkVerification){
          delete currentData.meta.linkVerification[f.key];
        }
        currentData[f.key] = newVal;
        if(f.linkStatus && String(newVal || "").trim()) setLinkStatus(f.key, "");
      }
    }
  });
  if(currentStepId === "general-info"){
    currentData.meta.generalInfoUpdatedAt = new Date().toISOString();
  }
}

async function advanceStep(step){
  collectFieldValues(step);
  if(currentStepId === "general-info"){
    const email = (currentData.email || "").trim();
    if(email && !isPlausibleEmail(email)){
      const first = document.querySelector(`[data-key="email"]`);
      if(first){
        first.style.outline = "2px solid var(--terracotta)";
        first.style.borderRadius = "8px";
        first.focus();
        setTimeout(()=>{ first.style.outline = ""; }, 4000);
      }
      showToast("That doesn't quite look like a valid email address \u2014 double check for a typo.");
      return;
    }
  }
  if(currentStepId === "links"){
    gateLinksThenRun(async () => {
      const nextId = step.next ? step.next(currentData) : "done";
      currentData.meta.currentStep = nextId;
      await saveAuthorData(currentAuthor, currentData);
      showToast("Saved!");
      generateAndUploadQrCodes(currentAuthor, currentData); // runs in background, doesn't block navigation
      goToSection(nextId);
    });
    return;
  }
  const nextId = step.next ? step.next(currentData) : "done";
  currentData.meta.currentStep = nextId;
  await saveAuthorData(currentAuthor, currentData);
  showToast("Saved!");
  if(currentStepId === "links"){
    generateAndUploadQrCodes(currentAuthor, currentData); // runs in background, doesn't block navigation
  }
  goToSection(nextId);
}

/* ---------- AUTO-ADVANCE ON ENTER / DOWN ARROW ---------- */
function attachAutoAdvance(container){
  const focusables = () => Array.from(container.querySelectorAll('input, textarea'));
  container.addEventListener('keydown', (e)=>{
    const els = focusables();
    const idx = els.indexOf(e.target);
    if(idx === -1) return;

    if(e.target.tagName === 'TEXTAREA'){
      if(e.key === 'ArrowDown'){
        const atEnd = e.target.selectionStart === e.target.value.length;
        if(atEnd && idx < els.length - 1){
          e.preventDefault();
          const next = els[idx+1];
          next.focus();
          if(next.tagName !== 'INPUT' || (next.type !== 'radio' && next.type !== 'checkbox')){
            try{ next.setSelectionRange(next.value.length, next.value.length); }catch(_){}
          }
        }
      }
      return;
    }
    if(e.key === 'Enter'){
      e.preventDefault();
      if(idx < els.length - 1){
        const next = els[idx+1];
        next.focus();
        if(next.type !== 'radio' && next.type !== 'checkbox'){
          try{ next.setSelectionRange(next.value.length, next.value.length); }catch(_){}
        }
      }
    }
  });
}

/* ---------- INIT ---------- */
async function restoreNavStateAndRender(){
  // Deep link from the order emails: ?author=NAME&go=orders
  try{
    const qp = new URLSearchParams(location.search);
    const goTo = qp.get("go");
    if(["orders","start","presale","payouts","home"].indexOf(goTo) >= 0 && qp.get("author")){
      history.replaceState(null, "", location.pathname);
      currentAuthor = qp.get("author");
      currentScreen = "loading";
      render();
      currentData = await loadAuthorData(currentAuthor);
      presaleOrdersState.lines = null;
      stepHistory = []; cameFromWhatsLeft = false; cameFromNavSubmenu = false;
      if(goTo === "orders"){
        currentScreen = currentData.meta.welcomeSeen ? "presale-orders" : "welcome";
      } else if(goTo === "home"){
        currentScreen = currentData.meta.welcomeSeen ? "home" : "welcome";
      } else {
        currentStepId = goTo === "presale" ? "preorder-books" : (goTo === "payouts" ? "preorder-payouts" : "general-info");
        currentScreen = "section";
      }
      render();
      return;
    }
  }catch(e){ /* fall through to normal start */ }
  let saved = null;
  try{
    const raw = sessionStorage.getItem("bss2027:navstate");
    if(raw) saved = JSON.parse(raw);
  }catch(e){ saved = null; }

  const canRestore = saved && saved.author && RESTORABLE_SCREENS.has(saved.screen)
    && (saved.screen !== "section" || STEPS[saved.stepId]);

  if(!canRestore){ render(); return; }

  currentAuthor = saved.author;
  currentScreen = "loading";
  render();
  currentData = await loadAuthorData(saved.author);
  currentScreen = saved.screen;
  currentStepId = saved.stepId || null;
  cameFromWhatsLeft = !!saved.cameFromWhatsLeft;
  cameFromNavSubmenu = !!saved.cameFromNavSubmenu;
  render();
}
restoreNavStateAndRender();

/* Price boxes show a $ in front (any decimal number box = a money field;
   percent and quantity boxes use a whole-number keypad and are left alone). */
(function(){
  function dollarize(root){
    if(!root || !root.querySelectorAll) return;
    root.querySelectorAll('input[type="number"][inputmode="decimal"]').forEach(function(inp){
      if(inp.dataset.dlr) return;
      inp.dataset.dlr = "1";
      var parent = inp.parentNode; if(!parent) return;
      var wrap = document.createElement('span');
      wrap.style.cssText = "display:flex;align-items:center;gap:6px;";
      var sign = document.createElement('span');
      sign.textContent = "$";
      sign.style.cssText = "font-weight:600;font-size:16px;opacity:.8;";
      parent.insertBefore(wrap, inp);
      wrap.appendChild(sign);
      wrap.appendChild(inp);
      if(!inp.style.width) inp.style.flex = "1 1 auto";
      inp.style.minWidth = "0";
    });
  }
  function start(){
    dollarize(document.body);
    new MutationObserver(function(muts){
      muts.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType === 1){ if(n.matches && n.matches('input[type="number"][inputmode="decimal"]')) dollarize(n.parentNode); else dollarize(n); } }); });
    }).observe(document.body, {childList:true, subtree:true});
  }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
