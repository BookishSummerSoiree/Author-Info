// Series names already used by this author's other preorder books, for the
// "pick an existing series" dropdown — and what's already known about that
// series (book count, set pricing) so it doesn't need re-entering.
function getExistingSeriesNames(currentBook){
  const names = [];
  (currentData.preorderBooksList || []).forEach(b=>{
    if(b !== currentBook && b.isSeries === "Yes" && b.seriesName && b.seriesName.trim() && names.indexOf(b.seriesName) === -1){
      names.push(b.seriesName);
    }
  });
  return names;
}
function getSeriesInfo(name, currentBook){
  const match = (currentData.preorderBooksList || []).find(b => b !== currentBook && b.seriesName === name);
  if(!match) return null;
  ensureSeriesFormats(match);
  return {
    totalBooks: match.seriesTotalBooks, regularPrice: match.seriesRegularPrice, soireePrice: match.seriesSoireePrice,
    seriesFormats: match.seriesFormats, seriesFormatPrices: match.seriesFormatPrices,
    seriesDiscount: seriesDiscountOf(match),
    seriesHasCover: match.seriesHasCover, seriesCoverUrl: match.seriesCoverUrl, seriesCoverUploadedAt: match.seriesCoverUploadedAt
  };
}

/* ---- Series price helper ----
   Sums the regular prices of every book entered so far in the same series,
   for one format ("paperback" / "hardcover"). A Box Set has no per-book
   equivalent, so it can't be added up. */
// A series can only be sold in a format the book itself comes in.
function seriesFormatChoices(book){
  ensureBookFormats(book);
  const avail = ["paperback","hardcover"].filter(f => book.formats.indexOf(f) !== -1);
  return avail.length ? avail : ["paperback"];
}
function syncSeriesFormatsToBook(book){
  const avail = seriesFormatChoices(book);
  let cur = (Array.isArray(book.seriesFormats) ? book.seriesFormats : []).filter(f => avail.indexOf(f) !== -1);
  if(avail.length === 1 || !cur.length) cur = avail.slice();
  book.seriesFormats = cur;
  book.seriesFormatPrices = book.seriesFormatPrices || {};
  Object.keys(book.seriesFormatPrices).forEach(f => { if(cur.indexOf(f) === -1) delete book.seriesFormatPrices[f]; });
  cur.forEach(f => { if(!book.seriesFormatPrices[f]) book.seriesFormatPrices[f] = {regular:"", soiree:""}; });
  return avail;
}
function seriesBooksFor(book){
  const name = (book.seriesName || "").trim().toLowerCase();
  if(!name) return [book];
  return (currentData.preorderBooksList || []).filter(b =>
    b && b.isSeries === "Yes" && (b.seriesName || "").trim().toLowerCase() === name);
}
function seriesSumForFormat(book, fmt, useSoiree){
  if(fmt !== "paperback" && fmt !== "hardcover") return null;
  const books = seriesBooksFor(book);
  let total = 0, counted = 0;
  function pick(b, f){
    const fp = (b.formatPrices || {})[f] || {};
    const r = parseFloat(fp.regular);
    if(isNaN(r)) return NaN;
    if(useSoiree){ const so = parseFloat(fp.soiree); if(fp.soiree !== "" && !isNaN(so)) return so; }
    return r;
  }
  books.forEach(b=>{
    ensureBookFormats(b);
    let v = pick(b, fmt);
    if(isNaN(v)){
      // book doesn't come in that format: use its own first listed price
      for(let i=0;i<b.formats.length;i++){
        const alt = pick(b, b.formats[i]);
        if(!isNaN(alt)){ v = alt; break; }
      }
    }
    if(!isNaN(v)){ total += v; counted++; }
  });
  return { total: Math.round(total * 100) / 100, counted: counted, entered: books.length };
}

/* ---- Soirée discount rule for a single book ----
   book.soireeDiscount = {type:"percent"|"dollar"|"none"|"manual", value, scope:"all"|"each"} */
function bookRuleOf(book){
  if(book.soireeDiscount && book.soireeDiscount.type) return book.soireeDiscount;
  ensureBookFormats(book);
  const typed = (book.formats || []).some(f => ((book.formatPrices[f] || {}).soiree || "") !== "");
  return typed ? {type:"manual", value:"", scope:"each"} : null;
}
function defaultSoireeRule(){
  const l = (currentData && currentData.preorderBooksList) || [];
  const keep = l.find(x => x && x.soireeDefault && x.soireeDefault.type);
  if(keep) return keep.soireeDefault;
  const b = l.find(x => x && x.soireeDiscount && x.soireeDiscount.scope === "all"
    && (x.soireeDiscount.type === "percent" || x.soireeDiscount.type === "dollar"));
  return b ? b.soireeDiscount : null;
}
function applySoireeRule(book, rule, scope){
  if(rule.type === "percent" && !isNaN(parseFloat(rule.value))) rule = {type:rule.type, value:String(Math.round(parseFloat(rule.value)))};
  const r = {type:rule.type, value:rule.value, scope:scope};
  if(scope === "all"){
    ((currentData && currentData.preorderBooksList) || []).forEach(b => { if(b){ b.soireeDiscount = {type:r.type, value:r.value, scope:"all"}; b.soireeDefault = {type:r.type, value:r.value}; } });
  }
  book.soireeDiscount = r;
  recomputeSeriesPrices();
}
function recomputeBookSoireePrices(){
  const list = (currentData && currentData.preorderBooksList) || [];
  list.forEach(b=>{
    if(!b) return;
    const r = b.soireeDiscount;
    if(!r || !r.type || r.type === "manual") return;
    ensureBookFormats(b);
    b.formats.forEach(f=>{
      const fp = bookFormatPrice(b, f);
      const reg = parseFloat(fp.regular);
      if(isNaN(reg) || r.type === "none"){ fp.soiree = ""; return; }
      fp.soiree = discountedSeriesTotal(reg, r) === reg ? "" : discountedSeriesTotal(reg, r).toFixed(2);
    });
  });
}

function seriesDiscountOf(book){
  if(book.seriesDiscount && book.seriesDiscount.type) return book.seriesDiscount;
  const sib = seriesBooksFor(book).find(b => b.seriesDiscount && b.seriesDiscount.type);
  if(sib) return sib.seriesDiscount;
  // A default the author set for ALL their series carries over to any series without its own.
  const def = seriesDefaultOf();
  return def ? {type:def.type, value:def.value, basis:"", scope:"all"} : null;
}
function seriesDefaultOf(){
  const list = (currentData && currentData.preorderBooksList) || [];
  const b = list.find(x => x && x.seriesDefault && x.seriesDefault.type);
  if(b) return b.seriesDefault;
  const old = list.find(x => x && x.seriesDiscount && x.seriesDiscount.scope === "all" && (x.seriesDiscount.type === "percent" || x.seriesDiscount.type === "dollar"));
  return old ? {type:old.seriesDiscount.type, value:old.seriesDiscount.value} : null;
}
function setSeriesDiscount(book, d){
  seriesBooksFor(book).concat([book]).forEach(b => { b.seriesDiscount = {type:d.type, value:(d.type === "percent" && !isNaN(parseFloat(d.value))) ? String(Math.round(parseFloat(d.value))) : d.value, basis:d.basis || "", scope:d.scope || "one"}; });
}
function setSeriesDiscountForAllSeries(book, d){
  const val = (d.type === "percent" && !isNaN(parseFloat(d.value))) ? String(Math.round(parseFloat(d.value))) : d.value;
  const dd = {type:d.type, value:val, basis:"", scope:"all"};
  setSeriesDiscount(book, dd);
  ((currentData && currentData.preorderBooksList) || []).forEach(b => {
    if(!b) return;
    b.seriesDefault = {type:d.type, value:val};
    if(b.isSeries === "Yes" && (b.seriesName || "").trim()) setSeriesDiscount(b, dd);
  });
}
function discountedSeriesTotal(total, d){
  const v = parseFloat(d && d.value);
  if(!d || isNaN(v) || v <= 0 || d.type === "none") return total;
  const out = d.type === "percent" ? total * (1 - Math.min(v,100)/100) : total - v;
  return Math.max(0, Math.round(out * 100) / 100);
}
function seriesDiscountText(d){
  const v = parseFloat(d && d.value);
  if(!d || isNaN(v) || v <= 0) return "";
  return d.type === "percent" ? (v + "%") : ("$" + v.toFixed(2));
}
// Keeps every series' price in step with its books: adds up the regular
// prices of the series' books and applies the series discount. Runs on every
// save and whenever a book's price changes. Series set to "custom" (the
// author typed their own price) are left alone.
function recomputeSeriesPrices(){
  recomputeBookSoireePrices();
  const list = (currentData && currentData.preorderBooksList) || [];
  const seen = {};
  list.forEach(b=>{
    if(!b || b.isSeries !== "Yes" || !(b.seriesName || "").trim()) return;
    const k = b.seriesName.trim().toLowerCase();
    if(seen[k]) return; seen[k] = 1;
    const grp = seriesBooksFor(b);
    const d = seriesDiscountOf(b);
    if(!d) return;
    let rule = null;
    if(d.type === "books"){
      rule = grp.map(x => x.soireeDiscount).find(r => r && (r.type === "percent" || r.type === "dollar")) || null;
      d.value = rule ? rule.value : ""; d.basis = rule ? rule.type : "";
    }
    grp.forEach(x => { x.seriesDiscount = {type:d.type, value:d.value, basis:d.basis || ""}; });
    if(d.type === "custom") return;
    ["paperback","hardcover"].forEach(fmt=>{
      const r = seriesSumForFormat(b, fmt);
      if(!r || !r.counted) return;
      let soi = "";
      if(d.type === "books"){
        const rs = seriesSumForFormat(b, fmt, true);
        soi = (rule && rs && rs.total < r.total) ? rs.total.toFixed(2) : "";
      } else if(d.type !== "none" && parseFloat(d.value) > 0){
        soi = discountedSeriesTotal(r.total, d).toFixed(2);
      }
      grp.forEach(x=>{
        ensureSeriesFormats(x);
        if(x.seriesFormats.indexOf(fmt) === -1) return;
        const fp = x.seriesFormatPrices[fmt] = x.seriesFormatPrices[fmt] || {regular:"", soiree:""};
        fp.regular = r.total.toFixed(2);
        fp.soiree = soi;
      });
    });
  });
}

function buildPreorderBookEntryExpanded(book, index, onChange, onTitleChange){
  const wrap = document.createElement('div');
  wrap.className = "card";
  wrap.dataset.bookEntryId = book.id;
  wrap.style.cssText = "background:var(--cream,#F7EFE1);margin-bottom:14px;padding:16px;box-shadow:none;border:1px solid rgba(12,30,61,0.08);";

  // Collapsing a book is the natural "I'm done with this one for now"
  // moment, so it also saves to the backend right then (with the normal
  // "Saving\u2026" overlay if it's slow) and confirms with a toast \u2014 instead of
  // leaving the author to wonder whether anything they typed actually
  // stuck until they reach the very bottom of the whole screen.
  async function collapseAndSave(){
    if(blockSeriesInfo(collapseAndSave)) return;
    await saveAuthorData(currentAuthor, currentData);
    showToast("Saved!");
    book._expanded = false;
    onChange();
  }

  // Returns true (and shows the popup) when this book is in a series but "Book X of Y" is blank.
  function blockSeriesInfo(retry){
    const prob = seriesProblem(book);
    if(!prob) return false;
    if(prob === "kind"){
      showInfoModal("Please choose whether this is an individual book or a box set before saving.");
    } else if(prob === "missing"){
      showSeriesInfoModal(()=> flashField(wrap.querySelector('[data-series-num]')));
    } else {
      showSingleSeriesModal(
        ()=> flashField(wrap.querySelector('[data-series-total]')),
        ()=>{ deselectSeries(book); onChange(); if(retry) retry(); }
      );
    }
    return true;
  }

  function makeCollapseRow(){
    const row = document.createElement('div');
    row.style.cssText = "display:flex;justify-content:flex-end;cursor:pointer;";
    row.innerHTML = `<span style="font-size:13px;opacity:.6;">Collapse \u25B2</span>`;
    row.onclick = collapseAndSave;
    return row;
  }

  const collapseRow = makeCollapseRow();
  collapseRow.style.marginBottom = "-6px";
  wrap.appendChild(collapseRow);

  const titleField = document.createElement('div');
  titleField.className = "field";
  titleField.innerHTML = `<label>Title (exactly as you want it displayed) <span class="req">*</span></label>`;
  const titleInp = document.createElement('input');
  titleInp.type = "text";
  titleInp.placeholder = "Book title";
  titleInp.value = book.title || "";
  titleInp.dataset.preorderTitleFor = book.id;
  titleInp.addEventListener('input', ()=>{
    book.title = titleInp.value;
    if(typeof onTitleChange === 'function') onTitleChange();
  });
  titleField.appendChild(titleInp);
  wrap.appendChild(titleField);

  // ---- "New!" tag (no dates to track — just a flag authors flip on a
  // freshly-released book, shown as a little burst on the storefront). ----
  const newTagField = document.createElement('div');
  newTagField.className = "field";
  newTagField.innerHTML = `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:normal"><input type="checkbox" style="width:auto;margin:0"> <span>Add a "New!" tag to this book</span></label>`;
  const newTagBox = newTagField.querySelector('input');
  newTagBox.checked = book.isNewTag === "Yes";
  newTagBox.onchange = () => { book.isNewTag = newTagBox.checked ? "Yes" : "No"; };
  wrap.appendChild(newTagField);

  // ---- Individual book or box set? ----
  ensureBookFormats(book);
  if(book.bookKind === undefined){
    // Books saved before this question existed: work it out from their formats.
    book.bookKind = book.formats.indexOf("boxSet") !== -1 ? "boxset" : "individual";
    if(book.bookKind === "boxset"){
      book.formats = ["boxSet"];
      const keepBox = (book.formatPrices && book.formatPrices.boxSet) || {regular:"", soiree:""};
      book.formatPrices = { boxSet: keepBox };
    }
  }
  const kindField = document.createElement('div');
  kindField.className = "field";
  kindField.innerHTML = `<label>Is this an individual book or a box set?</label>`;
  const kindRow = document.createElement('div');
  kindRow.className = "btn-row";
  kindRow.style.marginTop = "4px";
  const kindIndBtn = document.createElement('button');
  kindIndBtn.type = "button"; kindIndBtn.textContent = "Individual book";
  const kindBoxBtn = document.createElement('button');
  kindBoxBtn.type = "button"; kindBoxBtn.textContent = "Box set";
  kindRow.appendChild(kindIndBtn); kindRow.appendChild(kindBoxBtn);
  kindField.appendChild(kindRow);
  wrap.appendChild(kindField);

  // ---- Formats this book comes in ----
  const formatsField = document.createElement('div');
  formatsField.className = "field";
  formatsField.innerHTML = `<label>Select all formats this book comes in</label>`;
  const formatsRow = document.createElement('div');
  formatsRow.style.cssText = "display:flex;flex-wrap:wrap;gap:14px;margin-top:4px;";
  formatsField.appendChild(formatsRow);
  const specialNoteWrap = document.createElement('div');
  specialNoteWrap.style.marginTop = "10px";
  formatsField.appendChild(specialNoteWrap);
  wrap.appendChild(formatsField);

  const pricesWrap = document.createElement('div');
  wrap.appendChild(pricesWrap);
  const soireeWrap = document.createElement('div');
  wrap.appendChild(soireeWrap);

  // ---- Swag pack add-on (one flat price; no Soirée pricing) ----
  const swagField = document.createElement('div');
  swagField.className = "field";
  swagField.innerHTML = `<label>Would you like to add a <em>Swag pack</em> for this book?</label>
    <div class="help" style="margin-top:2px;font-size:12px;">Some stickers, magnet, bookmark, whatever you want</div>`;
  const swagRow = document.createElement('div');
  swagRow.style.cssText = "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;";
  const swagYes = document.createElement('button'); swagYes.type = "button"; swagYes.textContent = "Yes";
  const swagNo = document.createElement('button'); swagNo.type = "button"; swagNo.textContent = "No";
  [swagYes, swagNo].forEach(b => swagRow.appendChild(b));
  swagField.appendChild(swagRow);
  const swagPriceWrap = document.createElement('div');
  swagPriceWrap.style.cssText = "margin-top:10px;";
  swagPriceWrap.innerHTML = `<label style="display:block;margin-bottom:4px;">Swag pack price <span class="req">*</span></label>`;
  const swagPriceInp = document.createElement('input');
  swagPriceInp.type = "number"; swagPriceInp.inputMode = "decimal"; swagPriceInp.step = "0.01"; swagPriceInp.min = "0";
  swagPriceInp.placeholder = "e.g. 5.00";
  swagPriceInp.style.maxWidth = "160px";
  swagPriceInp.value = book.swagPrice || "";
  swagPriceInp.addEventListener('input', ()=>{ book.swagPrice = swagPriceInp.value; });
  swagPriceWrap.appendChild(swagPriceInp);
  swagField.appendChild(swagPriceWrap);
  function paintSwag(){
    const on = book.swagPack === "Yes";
    swagYes.className = "btn btn-compact " + (on ? "btn-primary" : "btn-secondary");
    swagNo.className = "btn btn-compact " + (!on ? "btn-primary" : "btn-secondary");
    swagPriceWrap.style.display = on ? "block" : "none";
  }
  swagYes.onclick = () => { book.swagPack = "Yes"; paintSwag(); swagPriceInp.focus(); };
  swagNo.onclick = () => { book.swagPack = "No"; paintSwag(); };
  paintSwag();
  wrap.appendChild(swagField);

  const sameCoverField = document.createElement('div');
  sameCoverField.className = "field";
  wrap.appendChild(sameCoverField);

  const coverWrap = document.createElement('div');
  wrap.appendChild(coverWrap);

  let refreshSeriesPricesHook = null;
  let refreshSoireeHook = null;
  let soireeEditing = false;
  function renderFormatPrices(){
    pricesWrap.innerHTML = "";
    bookFormatList(book).forEach(f=>{
      const opt = BOOK_FORMAT_OPTIONS.find(o=>o.value===f);
      const fp = bookFormatPrice(book, f);

      const regF = document.createElement('div');
      regF.className = "field";
      regF.innerHTML = `<label>${opt.label} regular price <span class="req">*</span></label>`;
      const regI = document.createElement('input');
      regI.type = "number"; regI.inputMode = "decimal"; regI.step = "0.01"; regI.min = "0";
      regI.placeholder = "e.g. 18.99";
      regI.value = fp.regular || "";
      regI.addEventListener('input', ()=>{ fp.regular = regI.value; recomputeSeriesPrices(); if(refreshSeriesPricesHook) refreshSeriesPricesHook(); if(refreshSoireeHook) refreshSoireeHook(); });
      regF.appendChild(regI);
      pricesWrap.appendChild(regF);

    });
    renderSoireeBlock();
  }

  function renderSoireeBlock(){
    soireeWrap.innerHTML = "";
    const box = document.createElement('div');
    box.className = "field";
    box.innerHTML = `<label>Soirée pricing</label>`;
    soireeWrap.appendChild(box);
    const rule = bookRuleOf(book);
    const fmtName = f => (BOOK_FORMAT_OPTIONS.find(o=>o.value===f) || {}).label || f;
    const money_ = n => "$" + (Math.round(n * 100) / 100).toFixed(2);
    function mk(label, primary, fn){
      const b = document.createElement('button');
      b.type = "button"; b.className = "btn btn-compact " + "btn-secondary";
      b.style.cssText = "white-space:normal;margin:0 8px 8px 0;";
      b.textContent = label; b.onclick = fn; return b;
    }
    refreshSoireeHook = () => { if(soireeWrap.isConnected && !soireeEditing && bookRuleOf(book)) renderSoireeBlock(); };

    if(rule && rule.type === "manual" && !soireeEditing){
      const help = document.createElement('div');
      help.className = "help"; help.style.marginBottom = "8px";
      help.innerHTML = "Optional \u2014 leave blank and the regular price shows instead. ";
      const auto = document.createElement('a');
      auto.href = "#"; auto.textContent = "Work it out for me instead";
      auto.onclick = (e)=>{ e.preventDefault(); window.__soireeStart = "kind"; soireeEditing = true; renderSoireeBlock(); };
      help.appendChild(auto);
      box.appendChild(help);
      bookFormatList(book).forEach(f=>{
        const fp = bookFormatPrice(book, f);
        const lab = document.createElement('div');
        lab.style.cssText = "font-size:13px;margin:6px 0 2px;";
        lab.textContent = fmtName(f) + " Soirée price";
        const inp = document.createElement('input');
        inp.type = "number"; inp.inputMode = "decimal"; inp.step = "0.01"; inp.min = "0";
        inp.placeholder = "e.g. 15.99"; inp.value = fp.soiree || "";
        inp.addEventListener('input', ()=>{ fp.soiree = inp.value; });
        box.appendChild(lab); box.appendChild(inp);
      });
      return;
    }

    if(rule && !soireeEditing){
      const sum = document.createElement('div');
      sum.style.cssText = "background:#fff;border:1px solid rgba(12,30,61,0.12);border-radius:10px;padding:14px 16px;line-height:1.55;";
      const dt = seriesDiscountText(rule);
      let html = "";
      bookFormatList(book).forEach(f=>{
        const reg = parseFloat(bookFormatPrice(book, f).regular);
        if(isNaN(reg)){ html += `${fmtName(f)}: <span style="opacity:.7;">add the regular price above first</span><br>`; return; }
        const fin = rule.type === "none" ? reg : discountedSeriesTotal(reg, rule);
        html += (rule.type !== "none" && fin !== reg)
          ? `${fmtName(f)}: regular price ${money_(reg)}. With your ${dt} Soirée discount, it's <strong>${money_(fin)}</strong>.<br>`
          : `${fmtName(f)}: <strong>${money_(reg)}</strong> (no Soirée discount).<br>`;
      });
      if(rule.type !== "none") html += `<div class="help" style="margin-top:6px;">Updates on its own if you change the price.</div>`;
      sum.innerHTML = html;
      const chg = mk("Change Soirée pricing", false, ()=>{ soireeEditing = true; renderSoireeBlock(); });
      chg.style.cssText += "display:block;margin-top:10px;padding:5px 12px;font-size:12px;";
      sum.appendChild(chg);
      box.appendChild(sum);
      return;
    }

    // ---- setup conversation ----
    let step = window.__soireeStart || "ask", kind = "percent", amt = "", pend = null;
    window.__soireeStart = null;
    function defText(d){ return d.type === "percent" ? (d.value + "% off") : (d.type === "dollar" ? ("$" + parseFloat(d.value).toFixed(2) + " off each book") : "no discount"); }
    const panel = document.createElement('div');
    panel.style.cssText = "background:#fff;border:1px solid rgba(12,30,61,0.12);border-left:4px solid var(--terracotta,#E4593F);border-radius:10px;padding:14px 16px;";
    box.appendChild(panel);
    function firstReg(){
      const fs = bookFormatList(book);
      for(let i=0;i<fs.length;i++){ const r = parseFloat(bookFormatPrice(book, fs[i]).regular); if(!isNaN(r)) return r; }
      return null;
    }
    function done(rule2, scope){
      soireeEditing = false;
      applySoireeRule(book, rule2, scope);
      renderSoireeBlock();
      if(refreshSeriesPricesHook) refreshSeriesPricesHook();
    }
    function draw(){
      panel.innerHTML = "";
      const q = document.createElement('div');
      q.style.cssText = "line-height:1.5;margin-bottom:12px;";
      const btns = document.createElement('div');
      if(step === "ask"){
        q.textContent = "Do you want special Soirée pricing for this book, to give people a nudge to grab it?";
        btns.appendChild(mk("Yes", true, ()=>{ step = "kind"; draw(); }));
        btns.appendChild(mk("No", false, ()=>{
          const dflt = defaultSoireeRule();
          if(dflt && dflt.type !== "none"){ pend = {type:"none", value:""}; step = "defq"; draw(); }
          else done({type:"none", value:""}, "each");
        }));
        btns.appendChild(mk("I'll type my own Soirée price", false, ()=>{ soireeEditing = false; book.soireeDiscount = {type:"manual", value:"", scope:"each"}; renderSoireeBlock(); }));
      } else if(step === "kind"){
        q.textContent = "Do you want it to be a specific dollar amount off, or a percentage off?";
        btns.appendChild(mk("$ off", true, ()=>{ kind = "dollar"; step = "amount"; draw(); }));
        btns.appendChild(mk("% off", true, ()=>{ kind = "percent"; step = "amount"; draw(); }));
      } else if(step === "defq"){
        const dflt = defaultSoireeRule();
        q.innerHTML = `<strong>You have set a default of ${defText(dflt)} for all your books.</strong><br>Do you want to change the default, or change it only for this book?`;
        btns.appendChild(mk("Change the default for all books", true, ()=>done(pend, "all")));
        btns.appendChild(mk("Only this book", true, ()=>done(pend, "each")));
        btns.appendChild(mk("Never mind", false, ()=>{ step = "ask"; draw(); }));
      } else if(step === "amount"){
        q.textContent = kind === "percent" ? "What percentage off would you like?" : "How many dollars off would you like?";
        const inp = document.createElement('input');
        inp.type = "number"; inp.inputMode = kind === "percent" ? "numeric" : "decimal"; inp.step = kind === "percent" ? "1" : "0.01"; inp.min = "0";
        inp.style.cssText = "width:120px;margin-bottom:10px;"; inp.value = amt;
        if(kind === "percent") inp.addEventListener('change', ()=>{ if(inp.value !== "" && !isNaN(parseFloat(inp.value))){ inp.value = Math.round(parseFloat(inp.value)); upd(); } });
        inp.placeholder = kind === "percent" ? "e.g. 10" : "e.g. 2";
        const res = document.createElement('div');
        res.style.cssText = "font-size:14px;line-height:1.55;margin:4px 0 12px;";
        const scopeBox = document.createElement('div');
        function upd(){
          amt = inp.value;
          const ok = parseFloat(amt) > 0;
          let html = "";
          if(ok) bookFormatList(book).forEach(f=>{
            const r = parseFloat(bookFormatPrice(book, f).regular);
            if(isNaN(r)) return;
            html += `${fmtName(f)}: regular price ${money_(r)}. With this discount, it's <strong>${money_(discountedSeriesTotal(r, {type:kind, value:amt}))}</strong>.<br>`;
          });
          res.innerHTML = html;
          scopeBox.innerHTML = "";
          if(!ok) return;
          const dflt = defaultSoireeRule();
          const differs = dflt && !(dflt.type === kind && String(parseFloat(dflt.value) || 0) === String(Math.round(parseFloat(amt)) || 0));
          const sq = document.createElement('div');
          sq.style.cssText = "line-height:1.5;margin:6px 0 10px;";
          if(differs){
            sq.innerHTML = `<strong>You have set a default of ${defText(dflt)} for all your books.</strong><br>Do you want to change the default, or change it only for this book?`;
            scopeBox.appendChild(sq);
            scopeBox.appendChild(mk("Change the default for all books", true, ()=>done({type:kind, value:amt}, "all")));
            scopeBox.appendChild(mk("Only this book", true, ()=>done({type:kind, value:amt}, "each")));
            return;
          }
          sq.textContent = "Do you want this same discount applied to all your books, or would you rather decide with each book you enter?";
          scopeBox.appendChild(sq);
          scopeBox.appendChild(mk("Same discount for all my books", true, ()=>done({type:kind, value:amt}, "all")));
          scopeBox.appendChild(mk("I'll decide with each book", true, ()=>done({type:kind, value:amt}, "each")));
        }
        inp.addEventListener('input', upd);
        const sw = document.createElement('button');
        sw.type = "button"; sw.className = "btn btn-secondary btn-tiny";
        sw.style.cssText = "display:block;margin:0 0 10px;";
        sw.textContent = kind === "percent" ? "Oops, I meant a dollar amount ($ off)" : "Oops, I meant a percentage (% off)";
        sw.onclick = () => { kind = kind === "percent" ? "dollar" : "percent"; amt = ""; draw(); };
        btns.appendChild(sw);
        btns.appendChild(inp); btns.appendChild(res); btns.appendChild(scopeBox);
        upd();
      } else if(step === "scope"){
        q.textContent = "Do you want this same discount applied to all your books, or would you rather decide with each book you enter?";
        btns.appendChild(mk("Same discount for all my books", true, ()=>done({type:kind, value:amt}, "all")));
        btns.appendChild(mk("I'll decide with each book", true, ()=>done({type:kind, value:amt}, "each")));
      }
      panel.appendChild(q); panel.appendChild(btns);
    }
    draw();
  }

  function renderSameCoverQuestion(){
    sameCoverField.innerHTML = "";
    if(bookFormatList(book).length < 2){ sameCoverField.style.display = "none"; return; }
    sameCoverField.style.display = "";
    sameCoverField.innerHTML = `<label>Are the covers of each format the same?</label><div class="help">Choose "No" if, say, the special edition has a different cover than the paperback.</div>`;
    const row = document.createElement('div');
    row.className = "btn-row";
    row.style.marginTop = "4px";
    const yesBtn = document.createElement('button');
    yesBtn.type = "button"; yesBtn.textContent = "Yes";
    const noBtn = document.createElement('button');
    noBtn.type = "button"; noBtn.textContent = "No";
    function styleBtns(){
      yesBtn.className = "btn btn-compact " + (book.sameCoverForFormats === "Yes" ? "btn-primary" : "btn-secondary");
      noBtn.className = "btn btn-compact " + (book.sameCoverForFormats === "No" ? "btn-primary" : "btn-secondary");
    }
    yesBtn.onclick = () => { book.sameCoverForFormats = "Yes"; styleBtns(); renderCovers(); };
    noBtn.onclick = () => { book.sameCoverForFormats = "No"; styleBtns(); renderCovers(); };
    styleBtns();
    row.appendChild(yesBtn); row.appendChild(noBtn);
    sameCoverField.appendChild(row);
  }

  function renderCovers(){
    coverWrap.innerHTML = "";
    const formats = bookFormatList(book);
    const needsPerFormat = formats.length > 1 && book.sameCoverForFormats === "No";
    if(needsPerFormat){
      formats.forEach(f=>{
        const opt = BOOK_FORMAT_OPTIONS.find(o=>o.value===f);
        const cf = document.createElement('div');
        cf.className = "field";
        cf.innerHTML = `<label>${opt.label} cover image</label>`;
        cf.appendChild(buildFormatCoverUpload(book, f, opt.label));
        coverWrap.appendChild(cf);
      });
    } else {
      const cf = document.createElement('div');
      cf.className = "field";
      cf.innerHTML = `<label>Cover image</label>`;
      cf.appendChild(buildBookCoverUpload(book));
      coverWrap.appendChild(cf);
    }
  }

  function renderFormatCheckboxes(){
    formatsRow.innerHTML = "";
    BOOK_FORMAT_OPTIONS.filter(o => o.value !== "boxSet").forEach(opt=>{
      const lbl = document.createElement('label');
      lbl.style.cssText = "display:flex;align-items:center;gap:6px;font-family:'Lora',serif;font-size:14px;cursor:pointer;";
      const cb = document.createElement('input');
      cb.type = "checkbox";
      cb.style.cssText = "accent-color:var(--terracotta);width:17px;height:17px;flex-shrink:0;";
      cb.checked = book.formats.indexOf(opt.value) !== -1;
      cb.addEventListener('change', ()=>{
        if(cb.checked){
          if(book.formats.indexOf(opt.value) === -1) book.formats.push(opt.value);
        } else {
          if(book.formats.length === 1){
            // Always keep at least one format selected.
            cb.checked = true;
            return;
          }
          book.formats = book.formats.filter(f=>f!==opt.value);
          if(book.formatCovers) delete book.formatCovers[opt.value];
        }
        renderFormatPrices();
        renderSameCoverQuestion();
        renderCovers();
        renderSpecialNote();
        applyBoxSetRule();
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(opt.label));
      formatsRow.appendChild(lbl);
    });
  }

  function renderSpecialNote(){
    specialNoteWrap.innerHTML = "";
    if(book.bookKind !== "individual" || book.formats.indexOf("specialEdition") === -1) return;
    const lab = document.createElement('label');
    lab.textContent = "Why is this a special edition? (example: sprayed edges)";
    const inp = document.createElement('input');
    inp.type = "text"; inp.placeholder = "e.g. sprayed edges";
    inp.value = book.specialEditionNote || "";
    inp.addEventListener('input', ()=>{ book.specialEditionNote = inp.value; });
    specialNoteWrap.appendChild(lab); specialNoteWrap.appendChild(inp);
  }

  // Individual book vs box set: a box set is its own thing (no other formats,
  // never part of a series); an individual book picks paperback / hardcover /
  // special edition.
  function styleKindBtns(){
    kindIndBtn.className = "btn btn-compact " + (book.bookKind === "individual" ? "btn-primary" : "btn-secondary");
    kindBoxBtn.className = "btn btn-compact " + (book.bookKind === "boxset" ? "btn-primary" : "btn-secondary");
  }
  function applyKindVisibility(){
    const answered = book.bookKind === "individual" || book.bookKind === "boxset";
    formatsField.style.display = book.bookKind === "individual" ? "" : "none";
    pricesWrap.style.display = answered ? "" : "none";
    soireeWrap.style.display = answered ? "" : "none";
    sameCoverField.style.display = (answered && bookFormatList(book).length > 1) ? "" : "none";
    coverWrap.style.display = answered ? "" : "none";
  }
  function setKind(k){
    book.bookKind = k;
    book.formatPrices = book.formatPrices || {};
    if(k === "boxset"){
      const keep = book.formatPrices.boxSet || {regular:"", soiree:""};
      book.formats = ["boxSet"];
      book.formatPrices = { boxSet: keep };
      book.formatCovers = {};
      book.sameCoverForFormats = "";
      book.specialEditionNote = "";
    } else {
      book.formats = book.formats.filter(f => f !== "boxSet");
      if(!book.formats.length) book.formats = ["paperback"];
      delete book.formatPrices.boxSet;
    }
    ensureBookFormats(book);
    styleKindBtns();
    renderFormatCheckboxes();
    renderFormatPrices();
    renderSameCoverQuestion();
    renderCovers();
    renderSpecialNote();
    applyKindVisibility();
    applyBoxSetRule();
    recomputeSeriesPrices();
  }
  kindIndBtn.onclick = () => setKind("individual");
  kindBoxBtn.onclick = () => setKind("boxset");

  renderFormatCheckboxes();
  renderFormatPrices();
  renderSameCoverQuestion();
  renderCovers();
  renderSpecialNote();
  styleKindBtns();
  applyKindVisibility();

  const seriesField = document.createElement('div');
  seriesField.className = "field";
  seriesField.innerHTML = `<label>Is this book part of a series?</label>`;
  wrap.appendChild(seriesField);

  const seriesToggleRow = document.createElement('div');
  seriesToggleRow.className = "btn-row";
  seriesToggleRow.style.cssText = "margin-top:4px;";
  const seriesYesBtn = document.createElement('button');
  seriesYesBtn.type = "button";
  seriesYesBtn.textContent = "Yes";
  const seriesNoBtn = document.createElement('button');
  seriesNoBtn.type = "button";
  seriesNoBtn.textContent = "No";
  seriesToggleRow.appendChild(seriesYesBtn);
  seriesToggleRow.appendChild(seriesNoBtn);
  seriesField.appendChild(seriesToggleRow);

  const seriesDetailsWrap = document.createElement('div');
  seriesDetailsWrap.style.marginTop = "12px";
  seriesField.appendChild(seriesDetailsWrap);

  function styleSeriesToggle(){
    seriesYesBtn.className = "btn btn-compact " + (book.isSeries === "Yes" ? "btn-primary" : "btn-secondary");
    seriesNoBtn.className = "btn btn-compact " + (book.isSeries === "No" ? "btn-primary" : "btn-secondary");
  }

  function renderSeriesDetails(){
    seriesDetailsWrap.innerHTML = "";
    if(book.isSeries !== "Yes") return;

    const existingNames = getExistingSeriesNames(book);
    // Explicit tri-state: undefined (nothing picked yet), "existing", or
    // "new" — inferred once from whatever's already saved, then tracked by
    // this flag from there so nothing looks pre-selected until the author
    // actually picks something.
    if(book._seriesPickMode === undefined){
      book._seriesPickMode = (book.seriesName && existingNames.indexOf(book.seriesName) !== -1) ? "existing" : undefined;
    }

    const nameField = document.createElement('div');
    nameField.className = "field";
    nameField.innerHTML = `<label>Series name</label>`;

    if(existingNames.length){
      const radioGroup = document.createElement('div');
      radioGroup.className = "radio-group";

      function pickExisting(value){
        book._seriesPickMode = "existing";
        book.seriesName = value;
        // Pull in what's already known about THIS series from its other
        // books — total count and set pricing shouldn't need retyping.
        const info = getSeriesInfo(value, book);
        if(info){
          if(info.totalBooks) book.seriesTotalBooks = info.totalBooks;
          if(info.regularPrice) book.seriesRegularPrice = info.regularPrice;
          if(info.soireePrice) book.seriesSoireePrice = info.soireePrice;
          if(info.seriesFormats) book.seriesFormats = info.seriesFormats.slice();
          if(info.seriesDiscount) book.seriesDiscount = JSON.parse(JSON.stringify(info.seriesDiscount));
          if(info.seriesFormatPrices) book.seriesFormatPrices = JSON.parse(JSON.stringify(info.seriesFormatPrices));
          if(info.seriesHasCover) book.seriesHasCover = info.seriesHasCover;
          if(info.seriesCoverUrl) book.seriesCoverUrl = info.seriesCoverUrl;
          if(info.seriesCoverUploadedAt) book.seriesCoverUploadedAt = info.seriesCoverUploadedAt;
        }
        renderSeriesDetails();
      }
      function pickNew(){
        // A brand-new series starts completely blank — never inherits
        // another series' book count, pricing, formats, or cover.
        book._seriesPickMode = "new";
        book.seriesName = "";
        book.seriesTotalBooks = "";
        book.seriesRegularPrice = "";
        book.seriesSoireePrice = "";
        book.seriesFormats = ["paperback"];
        book.seriesFormatPrices = {};
        book.seriesDiscount = null;
        book.seriesHasCover = "";
        book.seriesCoverUrl = "";
        book.seriesCoverUploadedAt = null;
        book._focusSeriesName = true;
        renderSeriesDetails();
      }

      const allOptions = existingNames.map(n => ({value:n, text:n}))
        .concat([{value:"__new__", text:"+ Add another series"}]);
      allOptions.forEach(opt=>{
        const isSelected = opt.value === "__new__"
          ? book._seriesPickMode === "new"
          : (book._seriesPickMode === "existing" && book.seriesName === opt.value);
        const optWrap = document.createElement('label');
        optWrap.className = "radio-option" + (isSelected ? " selected" : "");
        optWrap.innerHTML = `<input type="radio" name="seriesPick_${book.id}" value="${escapeAttr(opt.value)}" ${isSelected?'checked':''}><span>${opt.text}</span>`;
        optWrap.querySelector('input').addEventListener('change', ()=>{
          if(opt.value === "__new__") pickNew(); else pickExisting(opt.value);
        });
        radioGroup.appendChild(optWrap);
      });
      nameField.appendChild(radioGroup);

      if(book._seriesPickMode === "new"){
        const nameInp = document.createElement('input');
        nameInp.type = "text";
        nameInp.placeholder = "Series name";
        nameInp.value = book.seriesName || "";
        nameInp.style.marginTop = "8px";
        nameInp.addEventListener('input', ()=>{ book.seriesName = nameInp.value; });
        nameField.appendChild(nameInp);
        if(book._focusSeriesName){
          book._focusSeriesName = false;
          setTimeout(()=>{ try{ nameInp.focus(); }catch(e){} }, 0);
        }
      }
    } else {
      book._seriesPickMode = "new";
      const nameInp = document.createElement('input');
      nameInp.type = "text";
      nameInp.placeholder = "Series name";
      nameInp.value = book.seriesName || "";
      nameInp.addEventListener('input', ()=>{ book.seriesName = nameInp.value; });
      nameField.appendChild(nameInp);
    }
    seriesDetailsWrap.appendChild(nameField);

    const numField = document.createElement('div');
    numField.className = "field";
    const numRow = document.createElement('div');
    numRow.style.cssText = "display:flex;align-items:center;gap:8px;";
    const bookLabel = document.createElement('span');
    bookLabel.textContent = "Book";
    bookLabel.style.cssText = "font-weight:600;";
    const bookNumInp = document.createElement('input');
    bookNumInp.type = "number";
    bookNumInp.inputMode = "numeric";
    bookNumInp.pattern = "[0-9]*";
    bookNumInp.min = "1";
    bookNumInp.style.width = "70px";
    bookNumInp.placeholder = "#";
    bookNumInp.value = book.seriesBookNumber || ""; bookNumInp.setAttribute("data-series-num","1");
    bookNumInp.addEventListener('input', ()=>{ book.seriesBookNumber = bookNumInp.value; });
    const ofSpan = document.createElement('span');
    ofSpan.textContent = "of";
    const totalInp = document.createElement('input');
    totalInp.type = "number";
    totalInp.inputMode = "numeric";
    totalInp.pattern = "[0-9]*";
    totalInp.min = "1";
    totalInp.style.width = "70px";
    totalInp.placeholder = "#";
    totalInp.value = book.seriesTotalBooks || ""; totalInp.setAttribute("data-series-total","1");
    totalInp.addEventListener('input', ()=>{ book.seriesTotalBooks = totalInp.value; });
    numRow.appendChild(bookLabel);
    numRow.appendChild(bookNumInp);
    numRow.appendChild(ofSpan);
    numRow.appendChild(totalInp);
    numField.appendChild(numRow);
    seriesDetailsWrap.appendChild(numField);

    // ---- What format(s) does the series come in? ----
    ensureSeriesFormats(book);
    const seriesFormatsField = document.createElement('div');
    seriesFormatsField.className = "field";
    seriesFormatsField.innerHTML = `<label>Which formats is the whole series available in?</label>`;
    const seriesFormatsRow = document.createElement('div');
    seriesFormatsRow.style.cssText = "display:flex;flex-wrap:wrap;gap:14px;margin-top:4px;";
    seriesFormatsField.appendChild(seriesFormatsRow);
    const seriesFormatChoicesNow = syncSeriesFormatsToBook(book);
    if(seriesFormatChoicesNow.length > 1) seriesDetailsWrap.appendChild(seriesFormatsField);

    const seriesPricesWrap = document.createElement('div');
    seriesDetailsWrap.appendChild(seriesPricesWrap);

    let editingSeriesPricing = false;
    refreshSeriesPricesHook = () => { if(seriesPricesWrap.isConnected) renderSeriesFormatPrices(); };

    function money_(n){ return "$" + (Math.round(n * 100) / 100).toFixed(2); }
    function fmtLabel_(f){ return (SERIES_FORMAT_OPTIONS.find(o=>o.value===f) || {}).label || f; }

    function seriesPricingState(){
      const d = seriesDiscountOf(book);
      if(d) return d;
      // Older entries with typed-in series prices and no saved rule: keep them as typed.
      const hasTyped = book.seriesFormats.some(f => ((book.seriesFormatPrices[f]||{}).regular || "") !== "");
      return hasTyped ? {type:"custom", value:""} : null;
    }

    // The one-time question: how should the whole series be priced?
    function buildSeriesPricingSetup(calcFormats){
      const box = document.createElement('div');
      box.style.cssText = "background:#fff;border:1px solid rgba(12,30,61,0.12);border-left:4px solid var(--terracotta,#E4593F);border-radius:10px;padding:14px 16px;margin:6px 0 16px;";
      let choice = null, mode = "percent", amtVal = "";
      const cur = seriesDiscountOf(book);
      const br = book.soireeDiscount;
      const brOk = br && (br.type === "percent" || br.type === "dollar");
      let pre = (brOk && !cur) ? "ask" : "done";
      if(cur && cur.type === "percent"){ choice = "discount"; mode = "percent"; amtVal = cur.value; }
      else if(cur && cur.type === "dollar"){ choice = "discount"; mode = "dollar"; amtVal = cur.value; }
      else if(cur && (cur.type === "none" || cur.type === "books")){ choice = "none"; }
      function mk(label, primary, fn){
        const b = document.createElement('button');
        b.type = "button"; b.className = "btn btn-compact " + (primary ? "btn-primary" : "btn-secondary");
        b.style.cssText = "white-space:normal;margin:0 8px 8px 0;";
        b.textContent = label; b.onclick = fn; return b;
      }
      function doSave(d){
        setSeriesDiscount(book, d);
        recomputeSeriesPrices();
        editingSeriesPricing = false;
        renderSeriesFormatPrices();
      }
      function saveAllSeries(d){
        setSeriesDiscountForAllSeries(book, d);
        recomputeSeriesPrices();
        editingSeriesPricing = false;
        renderSeriesFormatPrices();
      }
      // If the author already set a default for every series, a different choice
      // here asks whether to change that default or only this series.
      function save(d){
        const def = seriesDefaultOf();
        const same = def && d.type === def.type && (d.type === "none" || d.type === "books" || String(parseFloat(d.value) || 0) === String(parseFloat(def.value) || 0));
        if(def && !same && (d.type === "percent" || d.type === "dollar" || d.type === "none" || d.type === "books")){
          const txt = def.type === "percent" ? (def.value + "% off") : (def.type === "dollar" ? ("$" + parseFloat(def.value).toFixed(2) + " off") : (def.type === "books" ? "your per-book Soir\u00e9e discount" : "no series discount (just the books added up)"));
          box.innerHTML = "";
          const q = document.createElement('div');
          q.style.cssText = "line-height:1.5;margin-bottom:12px;";
          q.innerHTML = `<strong>You have set a default of ${txt} for all your series.</strong><br>Do you want to change the default, or change it only for this series?`;
          box.appendChild(q);
          const r = document.createElement('div');
          r.appendChild(mk("Change the default for all series", false, ()=>saveAllSeries(d)));
          r.appendChild(mk("Only this series", false, ()=>doSave(d)));
          r.appendChild(mk("Never mind", false, ()=>draw()));
          box.appendChild(r);
          return;
        }
        doSave(d);
      }
      function draw(){
        box.innerHTML = "";
        const info = seriesSumForFormat(book, calcFormats[0]);
        const total = info && info.counted ? info.total : null;
        const q = document.createElement('div');
        q.style.cssText = "line-height:1.5;margin-bottom:12px;";
        if(pre === "ask"){
          const dtxt = br.type === "percent" ? (br.value + "%") : ("$" + parseFloat(br.value).toFixed(2));
          q.innerHTML = `<strong>Your books have a Soirée discount of ${dtxt}${br.type === "dollar" ? " off each book" : ""}.</strong><br>Would you like a special <em><u>series</u></em> discount that is deeper than the discount you already set up, to help people grab the whole series?`;
          box.appendChild(q);
          const r0 = document.createElement('div');
          r0.appendChild(mk("Yes, a deeper series discount", false, ()=>{ pre = "diff"; draw(); }));
          r0.appendChild(mk("No, use the same discount", false, ()=>save({type:"books", value:br.value, basis:br.type})));
          box.appendChild(r0);
          return;
        }
        if(pre === "diff"){
          q.innerHTML = `<strong>Your current discount per book is ${br.type === "percent" ? (br.value + "%") : ("$" + parseFloat(br.value).toFixed(2))}. How would you like to change the discount on a series?</strong>`;
          box.appendChild(q);
          const mrow = document.createElement('div');
          mrow.appendChild(mk("% off", mode === "percent", ()=>{ mode = "percent"; draw(); }));
          mrow.appendChild(mk("$ off", mode === "dollar", ()=>{ mode = "dollar"; draw(); }));
          box.appendChild(mrow);
          const q2 = document.createElement('div');
          q2.style.cssText = "line-height:1.5;margin:4px 0 8px;";
          q2.textContent = mode === "percent" ? "What percentage?" : "What dollar amount?";
          box.appendChild(q2);
          const inp = document.createElement('input');
          inp.type = "number"; inp.inputMode = mode === "percent" ? "numeric" : "decimal"; inp.step = mode === "percent" ? "1" : "0.01"; inp.min = "0";
          inp.style.cssText = "width:120px;margin-bottom:10px;"; inp.value = amtVal;
          if(mode === "percent") inp.addEventListener('change', ()=>{ if(inp.value !== "" && !isNaN(parseFloat(inp.value))){ inp.value = Math.round(parseFloat(inp.value)); (typeof updD === "function" ? updD : upd)(); } });
          inp.placeholder = mode === "percent" ? "e.g. 15" : "e.g. 5";
          const res = document.createElement('div');
          res.style.cssText = "font-size:14px;line-height:1.55;margin:4px 0 12px;";
          const scopeBox = document.createElement('div');
          function updD(){
            amtVal = inp.value;
            const ok = parseFloat(amtVal) > 0, d = {type:mode, value:amtVal};
            let html = "";
            if(ok) calcFormats.forEach(f=>{
              const r = seriesSumForFormat(book, f);
              if(!r || !r.counted) return;
              html += `${fmtLabel_(f)}: books added up are ${money_(r.total)}. With this series discount, it's <strong>${money_(discountedSeriesTotal(r.total, d))}</strong>.<br>`;
            });
            res.innerHTML = html;
            scopeBox.innerHTML = "";
            if(!ok) return;
            const sq = document.createElement('div');
            sq.style.cssText = "line-height:1.5;margin:6px 0 10px;";
            sq.innerHTML = "Do you want this discount to apply to <em>all</em> your series? Or just this one?";
            scopeBox.appendChild(sq);
            scopeBox.appendChild(mk("All my series", false, ()=>saveAllSeries(d)));
            scopeBox.appendChild(mk("Just this one", false, ()=>doSave({type:mode, value:amtVal})));
          }
          inp.addEventListener('input', updD);
          box.appendChild(inp); box.appendChild(res); box.appendChild(scopeBox);
          updD();
          return;
        }
        q.innerHTML = "<strong>How would you like to price the whole series?</strong><br>"
          + (total !== null ? `Adding up books entered in this series so far, the total is <strong>${money_(total)}</strong> <em>(but this will automatically update if/when you add more books to the series)</em>.` : "Enter this book's price above and I'll add up the series for you <em>(and it will automatically update if/when you add more books to the series)</em>.");
        box.appendChild(q);
        const row = document.createElement('div');
        row.appendChild(mk("Total sum of books in series (minus any per-book Soir\u00e9e discount if you set one)", choice === "none", ()=>{
          const grpRule = seriesBooksFor(book).map(x => x.soireeDiscount).find(r => r && (r.type === "percent" || r.type === "dollar"));
          save(grpRule ? {type:"books", value:grpRule.value, basis:grpRule.type} : {type:"none", value:""});
        }));
        row.appendChild(mk("Total sum of books in series (minus a new discount set specifically for series)", choice === "discount", ()=>{ choice = "discount"; draw(); }));
        row.appendChild(mk("I'll set my own price for this series", false, ()=>save({type:"custom", value:""})));
        box.appendChild(row);
        if(choice === "discount"){
          const t = document.createElement('div');
          t.className = "help"; t.style.margin = "6px 0";
          t.textContent = "Take off a percentage, or a dollar amount?";
          box.appendChild(t);
          const mrow = document.createElement('div');
          mrow.appendChild(mk("% off", mode === "percent", ()=>{ mode = "percent"; draw(); }));
          mrow.appendChild(mk("$ off", mode === "dollar", ()=>{ mode = "dollar"; draw(); }));
          box.appendChild(mrow);
          const inp = document.createElement('input');
          inp.type = "number"; inp.inputMode = mode === "percent" ? "numeric" : "decimal"; inp.step = mode === "percent" ? "1" : "0.01"; inp.min = "0";
          inp.style.cssText = "width:120px;margin-bottom:10px;"; inp.value = amtVal;
          if(mode === "percent") inp.addEventListener('change', ()=>{ if(inp.value !== "" && !isNaN(parseFloat(inp.value))){ inp.value = Math.round(parseFloat(inp.value)); (typeof updD === "function" ? updD : upd)(); } });
          inp.placeholder = mode === "percent" ? "e.g. 10" : "e.g. 5";
          const res = document.createElement('div');
          res.style.cssText = "font-size:14px;margin:4px 0 12px;min-height:20px;line-height:1.5;";
          function upd(){
            amtVal = inp.value;
            const d = {type:mode, value:amtVal};
            res.innerHTML = (total !== null && parseFloat(amtVal) > 0)
              ? `With your discount, the series price is <strong>${money_(discountedSeriesTotal(total, d))}</strong> <span style="opacity:.65;">(instead of ${money_(total)})</span>`
              : "";
          }
          inp.addEventListener('input', upd);
          box.appendChild(inp); box.appendChild(res);
          box.appendChild(mk("Save series pricing", true, ()=>{
            if(!(parseFloat(amtVal) > 0)){ showToast("Enter how much to take off first."); return; }
            save({type:mode, value:amtVal});
          }));
          upd();
        }
      }
      draw();
      return box;
    }

    function renderSeriesFormatPrices(){
      seriesPricesWrap.innerHTML = "";
      const calcFormats = book.seriesFormats.filter(f => f === "paperback" || f === "hardcover");
      const st = seriesPricingState();

      if(calcFormats.length){
        if(!st || editingSeriesPricing){
          seriesPricesWrap.appendChild(buildSeriesPricingSetup(calcFormats));
        } else if(st.type !== "custom"){
          // Automatic: show what the price works out to, no typing needed.
          const sum = document.createElement('div');
          sum.style.cssText = "background:#fff;border:1px solid rgba(12,30,61,0.12);border-radius:10px;padding:14px 16px;margin:6px 0 16px;line-height:1.55;";
          const isBooks = st.type === "books";
          const dt = isBooks
            ? (st.basis === "percent" ? (st.value + "% Soirée discount") : (st.basis === "dollar" ? ("$" + parseFloat(st.value).toFixed(2) + " Soirée discount on each book") : ""))
            : (seriesDiscountText(st) ? seriesDiscountText(st) + " series discount" : "");
          let html = `<strong>Series price</strong> <span style="opacity:.65;">(worked out automatically)</span><br>`;
          calcFormats.forEach(f=>{
            const r = seriesSumForFormat(book, f);
            if(!r || !r.counted){ html += `${fmtLabel_(f)}: <span style="opacity:.7;">add this book's price above first</span><br>`; return; }
            const reg = r.total;
            const fin = isBooks ? seriesSumForFormat(book, f, true).total : discountedSeriesTotal(reg, st);
            html += (dt && fin !== reg)
              ? `${fmtLabel_(f)}: with the books you've entered so far, the total for the series, after your ${dt.replace(/ series discount$/, " discount")}, would be <strong>${money_(fin)}</strong>\u2014regularly ${money_(reg)}.<br>`
              : `${fmtLabel_(f)}: with the books you've entered so far, the series total is <strong>${money_(reg)}</strong>.<br>`;
          });
          html += `<span class="help">This updates on its own as you add books to the series or change a book's price.</span>`;
          sum.innerHTML = html;
          const chg = document.createElement('button');
          chg.type = "button"; chg.className = "btn btn-secondary btn-compact";
          chg.style.marginTop = "10px"; chg.textContent = "Change series pricing";
          chg.onclick = () => { editingSeriesPricing = true; renderSeriesFormatPrices(); };
          sum.appendChild(chg);
          seriesPricesWrap.appendChild(sum);
        } else {
          // Author chose to type their own series price.
          const own = document.createElement('div');
          own.className = "help"; own.style.margin = "4px 0 10px";
          own.innerHTML = "You're setting your own series price. ";
          const auto = document.createElement('a');
          auto.href = "#"; auto.textContent = "Work it out for me instead";
          auto.onclick = (e)=>{ e.preventDefault(); editingSeriesPricing = true; renderSeriesFormatPrices(); };
          own.appendChild(auto);
          seriesPricesWrap.appendChild(own);
          calcFormats.forEach(f => seriesPricesWrap.appendChild(typedSeriesPriceFields(f, true)));
        }
      }
    }

    function typedSeriesPriceFields(f, isSeriesPrice){
      const frag = document.createElement('div');
      const opt = SERIES_FORMAT_OPTIONS.find(o=>o.value===f);
      const fp = book.seriesFormatPrices[f] = book.seriesFormatPrices[f] || {regular:"", soiree:""};
      const regF = document.createElement('div');
      regF.className = "field";
      regF.innerHTML = `<label>${opt.label}${isSeriesPrice ? " series" : ""} regular price</label>`
        + (isSeriesPrice ? `<div class="help">The price for the whole set in this format, since attendees can buy the series as one.</div>` : "");
      const regI = document.createElement('input');
      regI.type = "number"; regI.inputMode = "decimal"; regI.step = "0.01"; regI.min = "0";
      regI.placeholder = "e.g. 49.99";
      regI.value = fp.regular || "";
      regI.addEventListener('input', ()=>{ fp.regular = regI.value; });
      regF.appendChild(regI);
      frag.appendChild(regF);
      const soiF = document.createElement('div');
      soiF.className = "field";
      soiF.innerHTML = `<label>${opt.label}${isSeriesPrice ? " series" : ""} Soirée price</label><div class="help">Optional \u2014 a discount for the Soirée.</div>`;
      const soiI = document.createElement('input');
      soiI.type = "number"; soiI.inputMode = "decimal"; soiI.step = "0.01"; soiI.min = "0";
      soiI.placeholder = "e.g. 42.99";
      soiI.value = fp.soiree || "";
      soiI.addEventListener('input', ()=>{ fp.soiree = soiI.value; });
      soiF.appendChild(soiI);
      frag.appendChild(soiF);
      return frag;
    }

    function renderSeriesFormatCheckboxes(){
      seriesFormatsRow.innerHTML = "";
      SERIES_FORMAT_OPTIONS.filter(o => seriesFormatChoices(book).indexOf(o.value) !== -1).forEach(opt=>{
        const lbl = document.createElement('label');
        lbl.style.cssText = "display:flex;align-items:center;gap:6px;font-family:'Lora',serif;font-size:14px;cursor:pointer;";
        const cb = document.createElement('input');
        cb.type = "checkbox";
        cb.style.cssText = "accent-color:var(--terracotta);width:17px;height:17px;flex-shrink:0;";
        cb.checked = book.seriesFormats.indexOf(opt.value) !== -1;
        cb.addEventListener('change', ()=>{
          if(cb.checked){
            if(book.seriesFormats.indexOf(opt.value) === -1) book.seriesFormats.push(opt.value);
          } else {
            if(book.seriesFormats.length === 1){
              cb.checked = true;
              return;
            }
            book.seriesFormats = book.seriesFormats.filter(f=>f!==opt.value);
          }
          renderSeriesFormatPrices();
        });
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(opt.label));
        seriesFormatsRow.appendChild(lbl);
      });
    }
    renderSeriesFormatCheckboxes();
    renderSeriesFormatPrices();

    // ---- Special cover/image for the series (e.g. the box set art) ----
    const seriesCoverQField = document.createElement('div');
    seriesCoverQField.className = "field";
    seriesCoverQField.innerHTML = `<label>Is there a special cover or image for the series?</label>`;
    const seriesCoverRow = document.createElement('div');
    seriesCoverRow.className = "btn-row";
    seriesCoverRow.style.marginTop = "4px";
    const seriesCoverYesBtn = document.createElement('button');
    seriesCoverYesBtn.type = "button";
    seriesCoverYesBtn.textContent = "Yes";
    const seriesCoverNoBtn = document.createElement('button');
    seriesCoverNoBtn.type = "button";
    seriesCoverNoBtn.textContent = "No";
    seriesCoverRow.appendChild(seriesCoverYesBtn);
    seriesCoverRow.appendChild(seriesCoverNoBtn);
    seriesCoverQField.appendChild(seriesCoverRow);
    seriesDetailsWrap.appendChild(seriesCoverQField);

    const seriesCoverUploadWrap = document.createElement('div');
    seriesDetailsWrap.appendChild(seriesCoverUploadWrap);

    function styleSeriesCoverToggle(){
      seriesCoverYesBtn.className = "btn btn-compact " + (book.seriesHasCover === "Yes" ? "btn-primary" : "btn-secondary");

// Tapping a file input directly already opens the OS's "Photo Library /
// Take Photo / Choose File" menu, but focus landing some other way — the
// mobile keyboard's own next-field arrow, physical Tab, or this screen's
// own forward-navigation — just leaves the field silently focused, since a
// file input has no cursor to show. That's what made it feel like the down
// arrow "slipped past" the cover field. This reopens that same native menu
// the instant focus lands here by anything other than a direct tap/click
// (tracked via mousedown/touchstart so a real tap isn't double-triggered).
function attachFocusOpensFilePicker(inp){
  let viaPointer = false;
  inp.addEventListener('mousedown', ()=>{ viaPointer = true; });
  inp.addEventListener('touchstart', ()=>{ viaPointer = true; });
  inp.addEventListener('focus', ()=>{
    if(viaPointer){ viaPointer = false; return; }
    inp.click();
  });
}

/* Adapted from buildFileUpload (headshot/logo) for a per-book cover: writes
   into the book object itself instead of currentData, and keys the Drive
   upload off the book's stable id (not its array index) so covers stay
   attached to the right book even after other entries are added/removed. */
function buildBookCoverUpload(book){
  const fileKey = "preorderCover_" + book.id;
  const box = document.createElement('div');
  const status = document.createElement('div');
  status.className = "help";
  status.style.marginTop = "0";
  status.textContent = book.coverUrl
    ? (book.coverUploadedAt ? `Uploaded — last updated ${new Date(book.coverUploadedAt).toLocaleString()}` : "Uploaded.")
    : "No cover uploaded yet.";
  const preview = document.createElement('img');
  preview.style.cssText = "max-width:120px;max-height:160px;border-radius:8px;display:none;margin:10px 0;box-shadow:0 2px 10px rgba(12,30,61,0.12);";

  const inp = document.createElement('input');
  inp.type = "file";
  inp.accept = "image/png,image/jpeg,image/webp";
  inp.style.cssText = "font-family:'Montserrat',sans-serif;font-size:13px;";
  attachFocusOpensFilePicker(inp);

  inp.addEventListener('change', async ()=>{
    const file = inp.files[0];
    if(!file) return;
    status.textContent = "Uploading…";
    try{
      const dataUrl = await resizeImage(file, 1600, "image/jpeg", 0.85);
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"uploadFile", authorName: currentAuthor, fileType: fileKey, bookTitle: (book.title||""), base64: dataUrl, mimeType:"image/jpeg" })
      });
      const json = await res.json();
      if(!json || !json.success) throw new Error((json && json.error) || "Upload didn't complete.");

      book.coverUrl = json.url;
      book.coverUploadedAt = new Date().toISOString();
      localCache.set(fileStorageKey(fileKey), dataUrl, true);
      await saveAuthorData(currentAuthor, currentData);

      status.textContent = `Uploaded — last updated ${new Date(book.coverUploadedAt).toLocaleString()}`;
      preview.src = dataUrl;
      preview.style.display = "block";
      showToast("Cover uploaded!");
    }catch(e){
      status.textContent = "Upload didn't go through (" + (e.message || "unknown error") + ") — please try again.";
      showToast("Cover upload failed — please try again");
    }
  });

  box.appendChild(status);
  box.appendChild(preview);
  box.appendChild(inp);

  if(book.coverUrl){
    const idMatch = book.coverUrl.match(/\/d\/([^/]+)/);
    preview.src = idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800` : book.coverUrl;
    preview.style.display = "block";
  } else if(book.coverUploadedAt){
    localCache.get(fileStorageKey(fileKey), true).then(res=>{
      if(res){ preview.src = res.value; preview.style.display = "block"; }
    });
  }
  return box;
}

/* ---------- SCREEN: PREORDER PREVIEW ---------- */
function renderPreorderPreview(){
  app.appendChild(logoLockup());
  const card = document.createElement('div');
  card.className = "card";
  card.innerHTML = `
    <div class="eyebrow">Preview</div>
    <h1 class="section-title">Your Presale Listing</h1>
    <div class="section-sub">This is roughly how your books will appear to attendees in the presale store.</div>
  `;

  const books = (Array.isArray(currentData.preorderBooksList) ? currentData.preorderBooksList : [])
    .filter(b => b && b.title && b.title.trim());

  if(books.length === 0){
    const empty = document.createElement('div');
    empty.className = "info-box";
    empty.textContent = "You haven't added any presale books yet, so there's nothing to preview.";
    card.appendChild(empty);
    const goBtn = document.createElement('button');
    goBtn.className = "btn btn-primary btn-compact";
    goBtn.style.marginTop = "10px";
    goBtn.textContent = "Go add books";
    goBtn.onclick = () => {
      // Open the list with every book collapsed; books never given a title are dropped.
      currentData.preorderBooksList = (currentData.preorderBooksList || []).filter(b => b && b.title && b.title.trim());
      currentData.preorderBooksList.forEach(b => { b._expanded = false; });
      goToSection("preorder-books");
    };
    card.appendChild(goBtn);
  } else {
    const grid = document.createElement('div');
    grid.style.cssText = "display:flex;flex-direction:column;gap:14px;margin-top:8px;";
    books.forEach(book => {
      ensureBookFormats(book);
      const sNote = (book.specialEditionNote || "").trim();
      const formatLabels = {paperback:"Paperback", hardcover:"Hardcover", specialEdition:"Special Edition" + (sNote ? ": " + sNote.charAt(0).toUpperCase() + sNote.slice(1) : ""), boxSet:"Box Set"};
      const soireeNote = `<span style="font-size:11px;color:#777;font-weight:400;">(special Soirée pricing)</span>`;
      const priceLines = bookFormatList(book).map(f=>{
        const fp = bookFormatPrice(book, f);
        const reg = parseFloat(fp.regular);
        const soiree = parseFloat(fp.soiree);
        const hasSoiree = !isNaN(soiree) && fp.soiree !== "";
        if(isNaN(reg) || fp.regular === "") return "";
        const fmtLabel = bookFormatList(book).length > 1 ? `<span style="font-weight:600;">${formatLabels[f]||f}:</span> ` : "";
        return hasSoiree
          ? `<div>${fmtLabel}<span style="text-decoration:line-through;opacity:.6;margin-right:6px;">$${reg.toFixed(2)}</span><strong>$${soiree.toFixed(2)}</strong> ${soireeNote}</div>`
          : `<div>${fmtLabel}<strong>$${reg.toFixed(2)}</strong></div>`;
      }).filter(Boolean).join("");

      const tile = document.createElement('div');
      tile.style.cssText = "display:flex;gap:14px;padding:14px;border:1px solid rgba(12,30,61,0.1);border-radius:10px;background:#fff;";

      const coverWrap = document.createElement('div');
      coverWrap.style.cssText = "flex:0 0 auto;width:80px;height:120px;border-radius:6px;overflow:hidden;background:var(--cream,#F7EFE1);display:flex;align-items:center;justify-content:center;";
      const primaryCover = primaryBookCoverUrl(book);
      if(primaryCover){
        const idMatch = primaryCover.match(/\/d\/([^/]+)/);
        const img = document.createElement('img');
        img.src = idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800` : primaryCover;
        img.style.cssText = "width:100%;height:100%;object-fit:cover;";
        coverWrap.appendChild(img);
      } else {
        coverWrap.innerHTML = `<span style="font-size:11px;color:#999;text-align:center;padding:6px;">No cover</span>`;
      }
      tile.appendChild(coverWrap);

      const info = document.createElement('div');
      info.style.cssText = "flex:1;min-width:0;";
      info.innerHTML = `
        <div style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;">${escapeAttr(book.title)}</div>
        <div style="margin:4px 0;">${priceLines}</div>
      `;

      if(book.tagLine && book.tagLine.trim()){
        const tagLineEl = document.createElement('div');
        tagLineEl.style.cssText = "font-weight:700;font-size:13px;color:var(--navy);margin-top:10px;";
        tagLineEl.textContent = book.tagLine;
        info.appendChild(tagLineEl);
      }

      if(book.blurb && book.blurb.trim()){
        const blurbWrap = document.createElement('div');
        blurbWrap.style.cssText = "margin-top:6px;";

        const blurbText = document.createElement('div');
        blurbText.innerHTML = renderFormattedBlurb(book.blurb);
        blurbText.style.cssText = "font-size:13px;color:#555;line-height:1.4;"
          + "display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;";
        blurbWrap.appendChild(blurbText);

        const toggleLink = document.createElement('div');
        toggleLink.textContent = "\u2026 show more";
        toggleLink.style.cssText = "font-size:12px;color:var(--terracotta);font-weight:600;cursor:pointer;margin-top:3px;display:none;";
        let expanded = false;
        toggleLink.onclick = () => {
          expanded = !expanded;
          if(expanded){
            blurbText.style.webkitLineClamp = "unset";
            toggleLink.textContent = "\u2026 show less";
          } else {
            blurbText.style.webkitLineClamp = "3";
            toggleLink.textContent = "\u2026 show more";
          }
        };
        blurbWrap.appendChild(toggleLink);
        info.appendChild(blurbWrap);

        // Only offer the toggle if the blurb is actually being cut off —
        // a short blurb shouldn't show a pointless "show more" link.
        requestAnimationFrame(()=>{
          if(blurbText.scrollHeight > blurbText.clientHeight + 1){
            toggleLink.style.display = "block";
          }
        });
      }
      tile.appendChild(info);
      grid.appendChild(tile);
    });
    card.appendChild(grid);
  }

  const backToBooksBtn = document.createElement('button');
  backToBooksBtn.className = "btn btn-secondary btn-compact";
  backToBooksBtn.style.marginTop = "16px";
  backToBooksBtn.textContent = "Return to adding presale books";
  backToBooksBtn.onclick = () => goToSection("preorder-books");
  card.appendChild(backToBooksBtn);

  const link = document.createElement('div');
  link.className = "home-link";
  link.style.marginTop = "16px";
  link.textContent = "Return to home";
  link.onclick = () => { currentScreen = "home"; render(); };
  card.appendChild(link);
  appendMainScreenLink(card);
  app.appendChild(card);
}
