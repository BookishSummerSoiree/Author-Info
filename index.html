<!DOCTYPE html>
<html lang="en">
<head><!-- build 20261023-todo -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bookish Summer Soirée — Author Info</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="128x128" href="favicon-128.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Soirée: Authors">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7EFE1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

  :root{
    --navy:#0C1E3D;
    --terracotta:#E4593F;
    --sage:#94A177;
    --blush:#E4846C;
    --cream:#F7EFE1;
    --peach:#F0A890;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--navy);
    font-family:'Lora', serif;
    min-height:100vh;
    line-height:1.6;
    text-align:left;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    padding:32px 20px 100px;
    position:relative;
  }

  /* ---------- Logo lockup ---------- */
  .logo-lockup{
    text-align:center;
    margin-bottom:8px;
  }
  .logo-lockup img{
    width:100%;
    max-width:420px;
    height:auto;
  }

  .flourish-img{
    display:block;
    margin:6px auto 18px;
    opacity:0.9;
  }
  .flourish-small{ height:22px; width:auto; }
  .flourish-side{
    position:absolute;
    width:90px;
    opacity:0.16;
    pointer-events:none;
  }

  /* ---------- Cards / screens ---------- */
  .card{
    background:var(--white);
    border-radius:16px;
    box-shadow:0 4px 24px rgba(12,30,61,0.08);
    padding:36px 32px;
    margin-top:20px;
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-family:'Montserrat',sans-serif;
    font-size:11px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:8px;
    font-weight:600;
  }
  h1.section-title{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:26px;
    color:var(--navy);
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1.section-title img{ height:26px; width:auto; }
  .section-sub{
    font-family:'Montserrat',sans-serif;
    font-size:14.5px;
    color:#6b7080;
    margin-bottom:24px;
    line-height:1.65;
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.03em;
    border:none;
    border-radius:999px;
    padding:14px 28px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn-primary{
    background:var(--terracotta);
    color:var(--white);
    box-shadow:0 4px 14px rgba(228,89,63,0.35);
  }
  @media (hover: hover) { .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(228,89,63,0.45); } }
  .btn-secondary{
    background:var(--cream);
    color:var(--navy);
    border:1.5px solid rgba(12,30,61,0.15);
  }
  @media (hover: hover) { .btn-secondary:hover{ background:#f0e6d2; } }
  .btn-ghost{
    background:transparent;
    color:var(--navy);
    text-decoration:underline;
    padding:8px 4px;
  }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn-compact{ padding:9px 18px; font-size:12.5px; }
  .btn-tiny{ padding:6px 14px; font-size:11px; }

  /* ---------- Author select ---------- */
  .author-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-top:24px;
  }
  .author-tile{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--cream);
    border:1.5px solid rgba(12,30,61,0.12);
    border-radius:12px;
    padding:0 10px;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.25;
    cursor:pointer;
    color:var(--navy);
    transition:all .15s ease;
  }
  .author-tile:active,
  .author-tile-selected{
    background:var(--terracotta) !important;
    border-color:var(--terracotta) !important;
    color:#fff !important;
  }
  @media (hover: hover) {
    .author-tile:hover{
      background:var(--peach);
      border-color:var(--terracotta);
      transform:translateY(-2px);
    }
  }

  /* ---------- Home menu ---------- */
  .menu-list{ display:flex; flex-direction:column; gap:10px; margin-top:24px; }
  .menu-item{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--navy);
    background:var(--cream);
    border:1.5px solid rgba(12,30,61,0.1);
    border-radius:12px;
    padding:16px 20px;
    text-align:left;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:all .15s ease;
  }
  @media (hover: hover) { .menu-item:hover{ background:var(--peach); border-color:var(--terracotta); } }
  .menu-item .arrow{ color:var(--terracotta); font-size:18px; }
  .menu-item-dimmed{ opacity:.55; }
  .menu-item-dimmed .arrow{ opacity:.7; }
  .menu-item-suffix{ font-weight:400; font-style:italic; }

  /* ---------- Fields ---------- */
  .field{ margin-bottom:22px; }
  .field label{
    display:block;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--navy);
    margin-bottom:6px;
  }
  .field .req{ color:var(--terracotta); }
  .field .help{
    font-family:'Montserrat',sans-serif;
    font-size:14.5px;
    color:#8a8f9c;
    margin-bottom:8px;
    line-height:1.65;
    white-space:pre-line;
  }
  .field .help a{ color:var(--terracotta); font-weight:600; text-decoration:underline; }
  .field input[type=text],
  .field input[type=email],
  .field input[type=tel],
  .field input[type=url],
  .field input[type=number],
  .field textarea,
  .field select{
    width:100%;
    font-family:'Lora', serif;
    font-size:15px;
    color:var(--navy);
    background:var(--cream);
    border:1.5px solid rgba(12,30,61,0.15);
    border-radius:10px;
    padding:12px 14px;
    resize:vertical;
    transition:border-color .12s ease, background .12s ease;
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus{
    outline:none;
    border-color:var(--terracotta);
    background:var(--white);
  }
  .radio-group{ display:flex; flex-direction:column; gap:8px; }
  .radio-option{
    display:flex;
    align-items:flex-start;
    gap:16px;
    font-family:'Lora',serif;
    font-size:14.5px;
    text-align:left;
    background:var(--cream);
    border:1.5px solid rgba(12,30,61,0.12);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .radio-option span{ text-align:left; }
  @media (hover: hover) { .radio-option:hover{ border-color:var(--terracotta); } }
  .radio-option.selected{ border-color:var(--terracotta); background:var(--peach); }
  .radio-option input{ margin-top:3px; accent-color:var(--terracotta); }

  .info-box{
    background:var(--cream);
    border-left:4px solid var(--sage);
    border-radius:8px;
    padding:16px 18px;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    color:var(--navy);
    margin-bottom:18px;
    line-height:1.7;
  }
  .info-box a{ color:var(--terracotta); font-weight:600; text-decoration:underline; }
  .info-box strong{ color:var(--terracotta); }
  .tentative-box{
    background:#FDF6DD;
    border-left:4px solid #F4C542;
    border-radius:8px;
    padding:14px 18px;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    color:#5c4400;
    margin-top:10px;
    margin-bottom:18px;
    line-height:1.6;
  }

  /* ---------- Checklist (What Else Do I Need To Do?) ---------- */
  .checklist-summary{
    font-family:'Montserrat',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--navy);
    background:var(--cream);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:22px;
    line-height:1.6;
  }
  .checklist-summary .count{ color:var(--terracotta); }
  .checklist-section{ margin-top:26px; }
  .checklist-section:first-of-type{ margin-top:4px; }
  .checklist-section-title{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.03em;
    color:var(--terracotta);
    margin-bottom:8px;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .checklist-section-title .note{
    font-weight:500;
    font-size:11.5px;
    color:var(--navy);
    opacity:.55;
    text-transform:none;
    letter-spacing:0;
  }
  .checklist-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 2px;
    border-bottom:1px solid rgba(12,30,61,0.08);
    transition:opacity .12s ease;
  }
  .checklist-row:last-child{ border-bottom:none; }
  .checklist-row.done{ opacity:.55; }
  .checklist-row.declined{ opacity:.6; }
  .checklist-row.tentative{ opacity:1; }
  .checklist-icon{
    flex-shrink:0;
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; line-height:1;
  }
  .checklist-icon.done{ background:var(--sage); color:#fff; }
  .checklist-icon.declined{ background:var(--peach); color:var(--terracotta); }
  .checklist-icon.tentative{ background:#F4C542; color:#5c4400; font-size:11px; }
  .checklist-icon.todo{ background:transparent; border:1.5px solid rgba(12,30,61,0.2); }
  .checklist-label{
    flex:1;
    font-family:'Lora',serif;
    font-size:14.5px;
    color:var(--navy);
  }
  .checklist-label .preview{ opacity:.6; font-style:italic; }
  .checklist-add-btn, .checklist-edit-btn{
    flex-shrink:0;
    font-family:'Montserrat',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    border:1.5px solid var(--terracotta);
    background:transparent;
    color:var(--terracotta);
    transition:all .12s ease;
  }
  @media (hover: hover){
    .checklist-add-btn:hover, .checklist-edit-btn:hover{ background:var(--terracotta); color:#fff; }
  }
  .checklist-edit-btn{ border-color:var(--sage); color:var(--sage); }
  @media (hover: hover){ .checklist-edit-btn:hover{ background:var(--sage); color:#fff; } }

  .save-prompt{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:17px;
    color:var(--navy);
    margin-top:30px;
    padding-top:22px;
    border-top:1px solid rgba(12,30,61,0.1);
  }

  .readonly-box{
    background:var(--cream);
    border-radius:10px;
    padding:16px 18px;
    font-family:'Lora',serif;
    white-space:pre-wrap;
    color:var(--navy);
  }

  .home-link{
    display:block;
    width:fit-content;
    margin:26px auto 0;
    text-align:center;
    font-family:'Montserrat',sans-serif;
    font-size:12.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--navy);
    opacity:0.6;
    text-decoration:none;
    cursor:pointer;
  }
  @media (hover: hover) { .home-link:hover{ opacity:1; color:var(--terracotta); } }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--navy);
    color:var(--cream);
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    padding:12px 22px;
    border-radius:999px;
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .save-overlay{
    position:fixed;
    inset:0;
    background:rgba(247,239,225,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:80;
    opacity:0;
    transition:opacity .15s ease;
  }
  .save-overlay.show{ display:flex; opacity:1; }
  .save-overlay-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:#fff;
    padding:18px 26px;
    border-radius:14px;
    box-shadow:0 4px 20px rgba(12,30,61,0.18);
  }
  .save-overlay-spinner{
    width:26px;
    height:26px;
    border:3px solid rgba(12,30,61,0.15);
    border-top-color:var(--terracotta);
    border-radius:50%;
    animation:save-spin .7s linear infinite;
  }
  .save-overlay-text{
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    color:var(--navy);
  }
  @keyframes save-spin{ to{ transform:rotate(360deg); } }

  .info-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(12,30,61,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:90;
    padding:24px;
  }
  .info-modal-card{
    background:#fff;
    border-radius:16px;
    padding:28px 24px;
    max-width:380px;
    text-align:center;
    box-shadow:0 8px 30px rgba(12,30,61,0.25);
  }
  .info-modal-text{
    font-family:'Lora',serif;
    font-size:15px;
    line-height:1.6;
    color:var(--navy);
    margin-bottom:18px;
  }

  .dropoff-card{
    display:block;
    position:relative;
    background:var(--cream);
    border:1.5px solid rgba(12,30,61,0.12);
    border-radius:12px;
    padding:16px 44px 16px 20px;
    margin-bottom:12px;
    cursor:pointer;
    transition:all .12s ease;
  }
  @media (hover: hover) { .dropoff-card:hover{ border-color:var(--terracotta); } }
  .dropoff-card.selected{ border-color:var(--terracotta); background:var(--peach); }
  .dropoff-card input{
    position:absolute;
    top:16px; right:16px;
    width:18px; height:18px;
    margin:0;
    accent-color:var(--terracotta);
    cursor:pointer;
  }
  .dropoff-card .prefix{
    display:block;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:4px;
  }
  .dropoff-card .who{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:14.5px; color:var(--navy); }
  .dropoff-card .addr{ font-family:'Lora',serif; font-size:14px; color:var(--navy); margin-top:2px; }
  .dropoff-intro{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:12px;
  }

  .date-item{ margin-bottom:20px; }
  .date-item:last-child{ margin-bottom:0; }
  .date-item .heading{
    display:block;
    color:var(--terracotta);
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .date-item .detail{
    display:block;
    position:relative;
    font-family:'Lora',serif;
    font-size:14px;
    color:var(--navy);
    padding-left:0.52in;
    line-height:1.6;
  }
  .date-item .detail::before{
    content:"\2022";
    position:absolute;
    left:0.38in;
    color:var(--terracotta);
  }
  .date-item .detail + .detail{ margin-top:2px; }
  .cal-link{
    display:inline-block;
    margin-top:6px;
    margin-left:0.44in;
    font-family:'Montserrat',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--sage);
    text-decoration:none;
    border:1px solid var(--sage);
    border-radius:999px;
    padding:3px 10px;
    margin-right:6px;
  }
  @media (hover: hover) { .cal-link:hover{ background:var(--sage); color:var(--white); } }

  .travel-list{ list-style:none; margin:0; padding:0; }
  .travel-list li{
    position:relative;
    padding-left:0.48in;
    margin-bottom:10px;
    font-family:'Lora',serif;
    font-size:14.5px;
  }
  .travel-list li::before{
    content:"\2022";
    position:absolute;
    left:0.35in;
    color:var(--terracotta);
  }
  .welcome-copy a{ color:var(--terracotta); font-weight:600; text-decoration:none; }
  @media (hover: hover) { .welcome-copy a:hover{ text-decoration:underline; } }
  .welcome-copy p{ margin:0 0 16px; }
  .signature-line{ font-family:'Montserrat',sans-serif; font-size:12px; color:#5a5f6b; line-height:1.8; }
  .signature-line a{ font-size:12px; }

  @media (max-width:480px){
    .card{ padding:26px 20px; }
    .logo-lockup .script{ font-size:34px; }
    .logo-lockup .serif{ font-size:30px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="save-overlay" id="saveOverlay">
  <div class="save-overlay-inner">
    <div class="save-overlay-spinner"></div>
    <div class="save-overlay-text">Saving&hellip;</div>
  </div>
</div>

<script>
/* =========================================================
   A BOOKISH SUMMER SOIRÉE — AUTHOR INFO APP
   ---------------------------------------------------------
   EDIT ME: as you confirm each author, replace their "Author
   TBD" entry below with their real name (must match exactly
   however you want it to appear as a button). Order doesn't
   matter. I can't reach into your HQ app automatically — I
   don't have access to that tool — so this list needs to be
   updated here by hand (or you can paste me the current list
   any time and I'll update it for you).
========================================================= */
let AUTHORS = [
  "Traci Abramson",
  "Nancy Allan Campbell",
  "Sarah M Eden",
  "Jentry Flint",
  "Aspen Hadley",
  "Amanda P Jones",
  "Nicole J Kimzey",
  "Jessica Scarlett",
  "Kate Watson",
  ...Array.from({length:9}, (_,i)=> `Author TBD ${i+1}`)
]; // fallback list, used only if the live list can't be fetched from the server

const LOGO_SRC = "assets/logo-lockup.png";

const FLOURISH = {
  f1: "assets/ui-f1.png",
  f2: "assets/ui-f2.png",
  heart: "assets/ui-heart.png",
  book: "assets/ui-book.png",
  vase: "assets/ui-vase.png",
  bookStack: "assets/ui-bookStack.png",
  bookStackFlower: "assets/ui-bookStackFlower.png"
};

/* ---------- STEP / SECTION DEFINITIONS ---------- */
const STEPS = {

  "general-info": {
    title: "General Info", icon: FLOURISH.f1,
    sub: "Your basics — how I'll credit you, contact you, and show you off.",
    fields: [
      {key:"fullName", label:"Full name", type:"text", required:true, titleCase:true, help:"How you want your name associated with posts about you, your name tag, etc."},
      {key:"email", label:"Email address", type:"email", required:true, help:"The one you want Soirée correspondence to go to."},
      {key:"phone", label:"Phone number", type:"tel", help:"There are some authors who are rarely on Instagram. I\u2019m wondering if a group text might be the best way to communicate Soir\u00e9e info. If you don\u2019t mind sharing your phone number, enter it. If you would prefer to keep your number private, leave this empty."},
      {key:"reminderOptIn", label:"Would you like to receive email reminders about any unfinished items on your Soirée To-Do List?", type:"radio", options:["Yes","No"]},
      {key:"reminderFrequency", label:"How often?", type:"radio", options:["Daily","Weekly"], showIf:{key:"reminderOptIn", equals:"Yes"}},
      {key:"reminderDay", label:"Which day?", type:"select", options:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], default:"Monday", showIf:{key:"reminderFrequency", equals:"Weekly"}},
      {key:"reminderTime", label:"What time?", type:"time", default:"09:00", showIf:{key:"reminderOptIn", equals:"Yes"}},

/* Builds a universal .ics file (works with Apple Calendar, Google Calendar,
   Outlook, etc.) as a downloadable data URL — not tied to any one calendar app. */
function icsDataUrl({title,start,end,details,location}){
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bookish Summer Soiree//EN",
    "BEGIN:VEVENT",
    `UID:${title.replace(/\s+/g,'-')}-${start}@bookishsummersoiree`,
    `DTSTAMP:${start}Z`,
    `DTSTART;TZID=America/Denver:${start}`,
    `DTEND;TZID=America/Denver:${end}`,
    `SUMMARY:${title}`,
    `DESCRIPTION:${(details||"").replace(/,/g,'\\,').replace(/\n/g,'\\n')}`,
    `LOCATION:${(location||"").replace(/,/g,'\\,')}`,
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  return URL.createObjectURL(blob);
}

   on real hosting (GitHub Pages, etc). Every call site goes through this
   safe wrapper so a missing window.storage never throws and silently
   breaks the function that called it — it just quietly does nothing. */
const localCache = {
  async get(key, shared){
    if(typeof window.storage === "undefined") return null;
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(typeof window.storage === "undefined") return null;
    try{ return await window.storage.set(key, value, shared); }catch(e){ return null; }
  },
  async delete(key, shared){
    if(typeof window.storage === "undefined") return null;
    try{ return await window.storage.delete(key, shared); }catch(e){ return null; }
  },
  async list(prefix, shared){
    if(typeof window.storage === "undefined") return null;
    try{ return await window.storage.list(prefix, shared); }catch(e){ return null; }
  }
};

/* Fire-and-forget push to the Google Sheet backend. */
function pushToSheet(action, payload){
  try{
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...payload })
    }).catch(()=>{});
  }catch(e){
    return Promise.resolve(); /* ignore — local save already succeeded */
  }
}

/* The Google Sheet is the real source of truth — it's what actually works
   once this is hosted on a real website (window.storage only works inside
   Claude's own preview and can't be relied on there). We still write to
   window.storage too, purely as a same-session speed cache / offline
   fallback if the network request fails. */
async function loadAuthorData(author){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "getAuthorData", authorName: author })
    });
    const json = await res.json();
    if(json && json.success && json.exists){
      const data = { meta: { welcomeSeen: !!json.meta.welcomeSeen, currentStep: json.meta.currentStep || "general-info", generalInfoUpdatedAt:null, linkVerification: json.meta.linkVerification || {} }, ...json.data };
      if(json.headshotUrl) data.headshotUrl = json.headshotUrl;
      if(json.logoUrl) data.logoUrl = json.logoUrl;
      unpackLinkOther(data);
      migrateBooksSellingField(data);
      localCache.set(storageKey(author), JSON.stringify(data), true);
      return data;
    }
    if(json && json.success && json.exists === false){
      return freshData();
    }
  }catch(e){ /* server unreachable — fall back to local cache below */ }

  const cached = await localCache.get(storageKey(author), true);
  const data = cached ? JSON.parse(cached.value) : freshData();
  migrateBooksSellingField(data);
  return data;
}
/* One-time cleanup: this app used to have two separate "books you're
   selling" screens/fields (titlesBringingA for no-presale authors,
   titlesBringingB for presale authors) — now merged into one screen
   using titlesBringingA. Any pre-existing answer saved under
   titlesBringingB gets folded into titlesBringingA so nothing is lost.
   The single 5-option "bookSigningPlan" question was also later split
   into two separate questions (sellingPlan + presalePlan), and the free
   text "books you're selling" field became a one-per-line list — this
   migrates any already-saved answers into the new shape. */
function unpackLinkOther(data){
  if(!data || data.linkOtherName !== undefined || data.linkOtherUrl !== undefined) return;
  const raw = String(data.linkOther || "").trim();
  data.linkOtherName = ""; data.linkOtherUrl = "";
  if(!raw) return;
  if(raw.charAt(0) === "{"){
    try{ const o = JSON.parse(raw); data.linkOtherName = o.n || ""; data.linkOtherUrl = o.u || ""; return; }catch(e){}
  }
  data.linkOtherName = raw; // older plain-text answer
}
function migrateBooksSellingField(data){
  if(!data) return;
  if(!data.titlesBringingA && data.titlesBringingB){
    data.titlesBringingA = data.titlesBringingB;
  }
  if(!Array.isArray(data.sellingTitlesList) && data.titlesBringingA){
    data.sellingTitlesList = String(data.titlesBringingA).split("\n").map(s=>s.trim()).filter(Boolean);
  }
  if(!data.sellingPlan && data.bookSigningPlan){
    switch(data.bookSigningPlan){
      case "Bring a selection of books to sell at the event AND have a presale":
        data.sellingPlan = "I plan to sell books at the Soirée";
        data.preorderPlan = "Yes";
        break;
      case "Bring a selection of books to sell at the event, but NOT have a presale":
        data.sellingPlan = "I plan to sell books at the Soirée";
        data.preorderPlan = "No";
        break;
      case "ONLY a presale, but NOT bring a selection of books to sell at the event.":
        data.sellingPlan = "I won't be selling books at the Soirée";
        data.preorderPlan = "Yes";
        break;
      case "I won't sell books at the Soirée, OR have a presale":
        data.sellingPlan = "I won't be selling books at the Soirée";
        data.preorderPlan = "No";
        break;
      case "Haven't decided yet":
        data.sellingPlan = "Haven't decided yet";
        break;
    }
  }
  // The combined "swagPrizePlan" question (4 options covering swag AND
  // prizes at once) was split into two separate questions/screens.
  if(!data.swagPlan && !data.prizesPlan && data.swagPrizePlan){
    switch(data.swagPrizePlan){
      case "I would LOVE to add some of my swag to the totes AND donate book(s) for prizes!":
        data.swagPlan = "I'd love to get some of my swag in the totes!";
        data.prizesPlan = "I'd love to donate some prizes!";
        break;
      case "I would LOVE to add some of my swag to the totes, but I'll PASS on donating books for prizes.":
        data.swagPlan = "I'd love to get some of my swag in the totes!";
        data.prizesPlan = "I'll pass on donating prizes.";
        break;
      case "I would LOVE to donate book(s) for prizes, but I'll PASS on adding swag to the totes.":
        data.swagPlan = "I'll pass on adding swag to the totes.";
        data.prizesPlan = "I'd love to donate some prizes!";
        break;
      case "I will PASS on adding swag or donating book(s).":
        data.swagPlan = "I'll pass on adding swag to the totes.";
        data.prizesPlan = "I'll pass on donating prizes.";
        break;
    }
  }
  // The "donation-knowledge" question's option wording was also updated,
  // and the "know how many, not titles" path no longer routes to a
  // separate donation-numbers screen (the count field now lives inline
  // on this same screen) — remap any already-saved old-wording answer.
  const oldKnowledgeMap = {
    "I already know what book(s) I'm donating, AND how many!": "I know what prizes I'm donating",
    "I don't have a clue about titles, but I know how many I'll donate.": "I don't know what prizes I'll donate, but I know how many",
    "I don't have a clue about either, but I'll let you know as soon as I decide.": "I don't know how many right now"
  };
  if(data.donationKnowledge && oldKnowledgeMap[data.donationKnowledge]){
    data.donationKnowledge = oldKnowledgeMap[data.donationKnowledge];
  }
}
function freshData(){
  return { meta:{ welcomeSeen:false, currentStep:"general-info", generalInfoUpdatedAt:null, linkVerification:{} } };
}
// Only shows the overlay if the save is actually taking a moment — a
// short delay first avoids a flash for saves that resolve almost
// instantly, while still covering the genuinely slow ones that used to
// feel like the click didn't register.
let saveOverlayTimer = null;
let saveOverlayDepth = 0;
function showSaveOverlayIfSlow(){
  saveOverlayDepth++;
  if(saveOverlayTimer || document.getElementById('saveOverlay').classList.contains('show')) return;
  saveOverlayTimer = setTimeout(()=>{
    document.getElementById('saveOverlay').classList.add('show');
  }, 220);
}
function hideSaveOverlay(){
  saveOverlayDepth = Math.max(0, saveOverlayDepth - 1);
  if(saveOverlayDepth > 0) return;
  clearTimeout(saveOverlayTimer);
  saveOverlayTimer = null;
  document.getElementById('saveOverlay').classList.remove('show');
}

async function saveAuthorData(author, data){
  try{ if(data === currentData) recomputeSeriesPrices(); }catch(e){}
  localCache.set(storageKey(author), JSON.stringify(data), true);
  const { meta, headshotUrl, logoUrl, ...fieldData } = data;
  // The sheet has one existing column for "anywhere else" (linkOther). Keep the
  // name and the link together in it, so no new sheet columns are needed.
  const _on = String(fieldData.linkOtherName || "").trim(), _ou = String(fieldData.linkOtherUrl || "").trim();
  fieldData.linkOther = (_on || _ou) ? JSON.stringify({n:_on, u:_ou}) : "";
  delete fieldData.linkOtherName; delete fieldData.linkOtherUrl;
  showSaveOverlayIfSlow();
  try{
    await pushToSheet("saveData", { authorName: author, data: fieldData, meta: meta || {} });
  } finally {
    hideSaveOverlay();
  }
  reportProgressToHQ(author, data);
  syncDonatedPrizes(author, data);
}

/* Tells HQ how far along this author's To-Do list is, so the Authors page in
   HQ can show "To-Do list: 5/9". Fire-and-forget; never blocks saving. */
const HQ_FIREBASE_URL = "https://soiree-prizes-2027-default-rtdb.firebaseio.com";
function reportProgressToHQ(author, data){
  try{
    if(!author || author !== currentAuthor || data !== currentData || !currentData) return;
    let total = 0, done = 0;
    const todo = [];
    computeChecklist().forEach(s => s.rows.forEach(r => { if(r.required){ total++; if(r.done) done++; todo.push({l: String(r.label||"").slice(0,90), d: r.done ? 1 : 0}); } }));
    const slug = String(author).toLowerCase().replace(/[^a-z0-9]+/g, "-");
    const body = {
      done, total, todo,
      prizes: currentData.prizesPlan === "I'll pass on donating prizes." ? "no" : "yes",

      at: Date.now()
    };
    fetch(HQ_FIREBASE_URL + "/authorProgress/" + slug + ".json", {
      method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    }).catch(()=>{});
  }catch(e){}
}

/* ---------- DONATED PRIZES -> PRIZE MANAGER ----------
   Every prize an author says they will donate is added to the Prize Manager
   (category BINGO, donor = the author) automatically.
   - Always item type Book. 2 copies of a title = 2 prizes. A whole series = 1 prize per copy.
   - Amount paid is $0.
   - Value = the regular (not Soirée) price when the book or series is listed
     in their presale; otherwise it's left empty to fill in later.
   - Changing the list later updates, adds or removes only prizes that are
     still untouched in the Prize Manager. Anything edited there is left alone,
     and a prize deleted there is never re-created. */
const _donNorm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

function donatedValueFor_(line, data){
  const list = (data && data.preorderBooksList) || [];
  const t = _donNorm(line.title);
  if(!t) return 0;
  const bookPrice = b => {
    try{ ensureBookFormats(b); }catch(e){}
    const order = ["paperback","hardcover"].concat(b.formats || []);
    for(let i = 0; i < order.length; i++){
      const fp = b.formatPrices && b.formatPrices[order[i]];
      const r = parseFloat(fp && fp.regular);
      if(!isNaN(r) && r > 0) return r;
    }
    const flat = parseFloat(b.regularPrice);
    return !isNaN(flat) && flat > 0 ? flat : 0;
  };
  const sb = list.find(b => b && b.isSeries === "Yes" && _donNorm(b.seriesName) === t);
  if(sb){
    for(const f of ["paperback","hardcover"]){
      let r = null;
      try{ r = seriesSumForFormat(sb, f); }catch(e){}
      if(r && r.counted > 0 && r.counted === r.entered && r.total > 0) return r.total;
    }
    const sr = parseFloat(sb.seriesRegularPrice);
    return !isNaN(sr) && sr > 0 ? sr : 0;
  }
  const bk = list.find(b => b && _donNorm(b.title) === t);
  return bk ? bookPrice(bk) : 0;
}

const DON_UNDECIDED_OPT = "I don't know what prizes I'll donate, but I know how many";
/* Cover image from the presale screen (Google Drive link) -> small/large
   thumbnail links the Prize Manager can show as a prize photo. */
function _driveThumb(url, sz){
  const u = String(url || "");
  const m = u.match(/\/d\/([^/?#]+)/) || u.match(/[?&]id=([^&]+)/);
  return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w" + sz : u;
}
function donatedCoverFor_(line, data){
  const list = (data && data.preorderBooksList) || [];
  const t = _donNorm(line.title);
  if(!t) return "";
  const cover = b => { try{ return primaryBookCoverUrl(b) || ""; }catch(e){ return b.coverUrl || ""; } };
  const inSeries = list.filter(b => b && b.isSeries === "Yes" && _donNorm(b.seriesName) === t);
  if(inSeries.length){
    const withSeriesCover = inSeries.find(b => b.seriesHasCover === "Yes" && b.seriesCoverUrl);
    if(withSeriesCover) return withSeriesCover.seriesCoverUrl;
    const ordered = inSeries.slice().sort((a, b) => (parseFloat(a.seriesBookNumber) || 999) - (parseFloat(b.seriesBookNumber) || 999));
    for(const b of ordered){ const c = cover(b); if(c) return c; }
    return "";
  }
  const bk = list.find(b => b && _donNorm(b.title) === t);
  return bk ? cover(bk) : "";
}

/* What the donation tag's QR code points to: their website; if none, Instagram;
   if none, Facebook. Instagram/Facebook say "profile" on the tag instead of "website". */
function donorQr_(data){
  const w = String(data.linkWebsite || "").trim();
  const i = String(data.linkInstagram || "").trim();
  const f = String(data.linkFacebook || "").trim();
  if(w) return {url:w, type:"website"};
  if(i) return {url:i, type:"instagram"};
  if(f) return {url:f, type:"facebook"};
  return {url:"", type:"website"};
}

function desiredDonatedPrizes_(data){
  const lines = {};
  (data.donatedBooksList || []).forEach(e => {
    if(!e || !e.title || !String(e.title).trim()) return;
    const title = String(e.title).trim();
    const kind = (e.kind === "series" || (e.kind === "manual" && e.isSeries)) ? "series" : (e.kind === "book" ? "book" : "manual");
    const base = (kind + "_" + _donNorm(title)).replace(/[^a-z0-9]+/g, "_");
    let q = parseInt(e.qty, 10); if(!(q >= 1)) q = 1;
    if(lines[base]) lines[base].qty += q;
    else lines[base] = {base, kind, title, series:e.series || "", qty:q};
  });
  const out = [];
  // "I don't know what prizes I'll donate, but I know how many": one
  // "Undecided" prize per copy, to be replaced once they pick real titles.
  if(!Object.keys(lines).length && data.donationKnowledge === DON_UNDECIDED_OPT){
    const n = Math.min(parseInt(data.donatedCount, 10) || 0, 200);
    for(let k = 1; k <= n; k++){
      out.push({key:"undecided__" + k, title:"Undecided", kind:"undecided", isBook:true, value:0, copy:k, total:n, seriesBooks:0});
    }
    return out;
  }
  Object.keys(lines).forEach(k => {
    const l = lines[k];
    const value = donatedValueFor_(l, data);
    const cover = donatedCoverFor_(l, data);
    const list = data.preorderBooksList || [];
    let seriesBooks = 0;
    if(l.kind === "series"){
      const sb = list.find(b => b && b.isSeries === "Yes" && _donNorm(b.seriesName) === _donNorm(l.title));
      seriesBooks = sb ? (parseInt(sb.seriesTotalBooks, 10) || list.filter(b => b && b.isSeries === "Yes" && _donNorm(b.seriesName) === _donNorm(l.title)).length) : 0;
    }
    for(let n = 1; n <= l.qty; n++){
      out.push({key:l.base + "__" + n, title:l.title, kind:l.kind, isBook:true,
                value, cover, copy:n, total:l.qty, seriesBooks});
    }
  });
  return out;
}

async function _fbReq(path, method, body){
  const res = await fetch(HQ_FIREBASE_URL + "/" + path + ".json", {
    method, headers:{"Content-Type":"application/json"}, body: body === undefined ? undefined : JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Firebase " + method + " " + path + " " + res.status);
  return method === "GET" ? res.json() : null;
}

function _prizeRecordFor(id, d, author, slug, data, now){
  const bookish = d.isBook;
  const notes = d.kind === "undecided"
    ? "Auto-added from Author Info. The author hasn't decided which prize this will be yet (prize " + d.copy + " of " + d.total + ")."
    : "Auto-added from Author Info."
    + (d.kind === "series" ? " Whole series" + (d.seriesBooks ? " (" + d.seriesBooks + " books)." : ".") : "")
    + (d.total > 1 ? " Copy " + d.copy + " of " + d.total + "." : "");
  const rec = {
    id, name: bookish ? (author + ": " + d.title) : d.title, cat:"BINGO", itemType: bookish ? "Book" : "Misc",
    value: d.value || 0, paid: 0, qty: 1, loc:"", notes,
    donorType:"author", donor:author, donorWebsite:donorQr_(data).url, donorQRType:donorQr_(data).type,
    donorPronoun:"her", donorLogo:String(data.logoUrl || ""),
    needTag:true, tagMade:false, tagPrinted:false, tagAttached:false, onTote:false, tagGenerated:false,
    donationTagType: bookish ? "book" : "other",
    source:"author-info", authorSlug:slug, donationKey:d.key,
    _created:now, _mod:now
  };
  if(bookish){ rec.author = author; rec.bookTitle = d.title; rec.isSeries = d.kind === "series"; }
  rec.photos = [];
  if(d.cover){ rec.photos = [{thumb:_driveThumb(d.cover, 300)}]; rec.coverAdded = true; }
  return rec;
}

let _prizeSyncRunning = false, _prizeSyncAgain = null;
const _prizeSyncSig = {};
async function syncDonatedPrizes(author, data){
  try{
    if(!author || author !== currentAuthor || data !== currentData || !currentData) return;
    if(!Array.isArray(data.donatedBooksList) && data.donationKnowledge !== DON_UNDECIDED_OPT) return;
    const passed = data.prizesPlan === "I'll pass on donating prizes.";
    const desired = passed ? [] : desiredDonatedPrizes_(data);
    // Never wipe an author's prizes just because their list failed to load.
    if(!desired.length && !passed && !data.donationListStatus) return;
    const slug = String(author).toLowerCase().replace(/[^a-z0-9]+/g, "-");
    const sig = JSON.stringify([author, desired.map(d => [d.key, d.title, d.value, d.isBook, d.seriesBooks, d.cover || ""]), data.linkWebsite || "", data.linkInstagram || "", data.linkFacebook || "", data.logoUrl || ""]);
    if(_prizeSyncSig[slug] === sig) return;
    if(_prizeSyncRunning){ _prizeSyncAgain = [author, data]; return; }
    _prizeSyncRunning = true;
    try{
      const map = (await _fbReq("authorPrizes/" + slug, "GET")) || {};
      let slot = map.slot, next = map.next || 0;
      const items = map.items || {};
      if(!slot){
        const all = (await _fbReq("authorPrizes", "GET")) || {};
        const used = new Set(Object.keys(all).map(k => all[k] && all[k].slot));
        let h = 0; for(let i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) % 90000;
        slot = h + 1;
        while(used.has(slot)) slot = (slot % 90000) + 1;
      }
      const base = 1000000 + slot * 1000;
      const now = Date.now();
      const wanted = {}; desired.forEach(d => { wanted[d.key] = d; });

      // Real prizes take over "Undecided" placeholders (keeping anything added
      // to them in the Prize Manager) instead of leaving the placeholders behind.
      const takenOver = {};
      const spare = Object.keys(items).filter(k => k.indexOf("undecided__") === 0 && !wanted[k])
        .sort((a, b) => parseInt(a.split("__")[1], 10) - parseInt(b.split("__")[1], 10));
      for(const d of desired){
        if(items[d.key] || !spare.length) continue;
        while(spare.length){
          const oldKey = spare.shift();
          const rec = await _fbReq("prizes/p_" + items[oldKey], "GET");
          if(!rec){ delete items[oldKey]; continue; }
          items[d.key] = items[oldKey]; delete items[oldKey];
          takenOver[d.key] = rec;
          break;
        }
      }

      // Prizes no longer on the author's list
      for(const key of Object.keys(items)){
        if(wanted[key]) continue;
        const id = items[key];
        const rec = await _fbReq("prizes/p_" + id, "GET");
        if(!rec){ delete items[key]; continue; }
        if(rec._mod === rec._created && !rec.bundledInto && !rec.isBundle){
          await _fbReq("prizes/p_" + id, "DELETE");
        } else {
          await _fbReq("prizes/p_" + id, "PATCH", {notes:(rec.notes ? rec.notes + " " : "") + (key.indexOf("undecided__") === 0 ? "(The author has since chosen their real prizes, so this placeholder can be deleted.)" : "(The author took this off their list.)")});
        }
        delete items[key];
      }
      // Prizes on the list
      for(const d of desired){
        let id = items[d.key];
        if(!id){
          if(next >= 999) continue; // safety cap per author
          next++; id = base + next;
          await _fbReq("prizes/p_" + id, "PUT", _prizeRecordFor(id, d, author, slug, data, now));
          if(d.cover) await _fbReq("photos/p_" + id, "PUT", [_driveThumb(d.cover, 1000)]);
          items[d.key] = id;
          continue;
        }
        const rec = takenOver[d.key] || await _fbReq("prizes/p_" + id, "GET");
        if(!rec) continue; // deleted in the Prize Manager on purpose: leave it gone
        const rebuilt = _prizeRecordFor(id, d, author, slug, data, rec._created || now);
        if(takenOver[d.key]){
          const untouched = rec._mod === rec._created;
          const cleanNotes = String(rec.notes || "").replace(/\s*The author hasn't decided which prize this will be yet \(prize \d+ of \d+\)\./, "").replace(/\s*\(The author has since chosen[^)]*\)/, "").trim();
          await _fbReq("prizes/p_" + id, "PATCH", {name:rebuilt.name, itemType:rebuilt.itemType, bookTitle:rebuilt.bookTitle || null, isSeries:!!rebuilt.isSeries, author:rebuilt.author || null,
            donationKey:d.key, donationTagType:rebuilt.donationTagType, value:(+rec.value ? rec.value : rebuilt.value),
            notes: untouched ? rebuilt.notes : (cleanNotes || rebuilt.notes),
            donor:rebuilt.donor, donorWebsite:rebuilt.donorWebsite, donorQRType:rebuilt.donorQRType, donorPronoun:"her", donorLogo:rebuilt.donorLogo});
        } else if(rec._mod === rec._created){
          await _fbReq("prizes/p_" + id, "PATCH", {name:rebuilt.name, itemType:rebuilt.itemType, value:rebuilt.value, notes:rebuilt.notes,
            donor:rebuilt.donor, donorWebsite:rebuilt.donorWebsite, donorQRType:rebuilt.donorQRType, donorPronoun:"her", donorLogo:rebuilt.donorLogo, donationTagType:rebuilt.donationTagType,
            author:rebuilt.author || null, bookTitle:rebuilt.bookTitle || null, isSeries:!!rebuilt.isSeries});
        } else if(!(+rec.value) && d.value){
          await _fbReq("prizes/p_" + id, "PATCH", {value:d.value});
        }
        // A prize edited by hand keeps its edits, but a missing QR link or logo is filled in.
        if(rec._mod !== rec._created && !takenOver[d.key]){
          const gap = {};
          if(rebuilt.itemType === "Book" && rec.isSeries === undefined){ gap.isSeries = !!rebuilt.isSeries; }
          if(!String(rec.donorWebsite || "").trim() && rebuilt.donorWebsite){ gap.donorWebsite = rebuilt.donorWebsite; gap.donorQRType = rebuilt.donorQRType; }
          if(!String(rec.donorLogo || "").trim() && rebuilt.donorLogo){ gap.donorLogo = rebuilt.donorLogo; }
          if(!rec.donorPronoun || rec.donorPronoun === "their"){ gap.donorPronoun = "her"; }
          if(Object.keys(gap).length) await _fbReq("prizes/p_" + id, "PATCH", gap);
        }
        // Presale cover as the prize photo, only when the prize has no photo yet
        // and one was never added before (never replaces photos added by hand).
        if(d.cover && !rec.coverAdded && !(rec.photos && rec.photos.length)){
          await _fbReq("prizes/p_" + id, "PATCH", {photos:[{thumb:_driveThumb(d.cover, 300)}], coverAdded:true});
          await _fbReq("photos/p_" + id, "PUT", [_driveThumb(d.cover, 1000)]);
        }
      }
      await _fbReq("authorPrizes/" + slug, "PUT", {slot, next, name:author, items, at:now});
      _prizeSyncSig[slug] = sig;
    } finally {
      _prizeSyncRunning = false;
      if(_prizeSyncAgain){ const a = _prizeSyncAgain; _prizeSyncAgain = null; syncDonatedPrizes(a[0], a[1]); }
    }
  }catch(e){ /* never blocks saving; it retries on the next save */ }
}

/* Remembers which screen/author you're on so an accidental browser refresh
   returns you there instead of dumping you back at "Who are you?". Uses
   real sessionStorage (not the localCache/window.storage wrapper above,
   which only exists inside Claude's preview) so this actually works once
   hosted. It's per-tab and clears when the tab closes — intentional, so a
   stale screen doesn't linger across days. This only remembers your
   position, not unsaved keystrokes; anything not yet saved on the current
   screen is still lost on refresh, same as before. Admin screens are
   deliberately excluded so a refresh can't skip the password prompt. */
const RESTORABLE_SCREENS = new Set([
  "welcome","home","dates","lookup-bringing","lookup-donating","nav-submenu",
  "graphics","whats-left","continue-complete","fix-links","qr-preview","preorder-preview","preorder-status","presale-orders","section"
]);
function saveNavState(){
  try{
    if(currentAuthor && RESTORABLE_SCREENS.has(currentScreen)){
      sessionStorage.setItem("bss2027:navstate", JSON.stringify({
        author: currentAuthor, screen: currentScreen, stepId: currentStepId,
        cameFromWhatsLeft, cameFromNavSubmenu
      }));
    } else {
      sessionStorage.removeItem("bss2027:navstate");

// A book that is part of a series needs "Book X of Y" before it can be saved.
function seriesInfoMissing(b){
  if(!b || b.isSeries !== "Yes") return false;
  const n = parseFloat(b.seriesBookNumber), t = parseFloat(b.seriesTotalBooks);
  return !(n > 0) || !(t > 0);
}
// "missing" = Book X of Y blank; "single" = Book 1 of 1 (not really a series); null = fine.
function seriesProblem(b){
  if(b && b.bookKind === "") return "kind";
  if(seriesInfoMissing(b)) return "missing";
  if(b && b.isSeries === "Yes" && parseFloat(b.seriesTotalBooks) === 1) return "single";
  return null;
}
function deselectSeries(b){
  b.isSeries = "No";
  b.seriesName = ""; b.seriesBookNumber = ""; b.seriesTotalBooks = "";
  b.seriesRegularPrice = ""; b.seriesSoireePrice = "";
  b.seriesFormats = []; b.seriesFormatPrices = {}; b.seriesDiscount = null;
  b.seriesHasCover = ""; b.seriesCoverUrl = ""; b.seriesCoverUploadedAt = null;
  b._seriesPickMode = undefined;
  try{ recomputeSeriesPrices(); }catch(e){}
}

  else if(currentScreen === "admin") renderAdmin();
  else if(currentScreen === "edit-authors") renderEditAuthors();
  else if(currentScreen === "payouts") renderPayouts();

  else if(currentScreen === "preorder-preview") renderPreorderPreview();
  else if(currentScreen === "preorder-status") renderPreorderStatus();
  else if(currentScreen === "presale-orders") renderPresaleOrders();
  else if(currentScreen === "section") renderSection();
  if(currentScreen === "whats-left" && whatsLeftScrollY !== null){
    window.scrollTo(0, whatsLeftScrollY);
    whatsLeftScrollY = null;
  } else if(currentScreen === "section" && sectionScrollToKey !== null){
    const key = sectionScrollToKey;
    sectionScrollToKey = null;
    const targetEl = document.querySelector(`[data-key="${key}"]`);
    if(targetEl){
      targetEl.scrollIntoView({behavior:"auto", block:"center"});
    } else {
      window.scrollTo(0, 0);
    }
  } else {
    window.scrollTo(0, 0);
  }
  window.__lastRenderKey = currentScreen + ":" + (currentStepId || "");
  saveNavState();
}

/* ---------- SCREEN: ADMIN ---------- */
/* Presale payout ledger — ONE source used by both Soirée HQ ("Presales" tab)
   and the Author Info admin screen. Both read and write the same Orders
   sheet through the Apps Script backend, so checking something off in one
   place shows up in the other (press Refresh, or reopen the screen). */
const PayoutLedger = (function(){
  const KEY_STORE = "bss:payoutKey";
  function getKey(){ try{ return localStorage.getItem(KEY_STORE) || sessionStorage.getItem(KEY_STORE) || ""; }catch(e){ try{ return sessionStorage.getItem(KEY_STORE) || ""; }catch(e2){ return ""; } } }
  function setKey(k){ try{ localStorage.setItem(KEY_STORE, k); }catch(e){ try{ sessionStorage.setItem(KEY_STORE, k); }catch(e2){} } }
  function clearKey(){ try{ localStorage.removeItem(KEY_STORE); }catch(e){} try{ sessionStorage.removeItem(KEY_STORE); }catch(e){} }
  const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const money = n => "$" + (Number(n) || 0).toFixed(2);
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
  const prettyDate = ms => ms ? new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";

  function mount(root, opts){
    const T = Object.assign({ text:"#1a1a18", muted:"#6b6b67", border:"rgba(0,0,0,.15)", accent:"#534AB7", soft:"rgba(0,0,0,.04)", ok:"#1D9E75", warn:"#BA7517" }, opts.theme || {});
    const st = { groups:null, filter:"send", error:"", needKey:!getKey(), loading:false };

    async function call(action, extra){
      const res = await fetch(opts.apiUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ action:action, key:getKey() }, extra || {})) });
      return res.json();
    }
    async function load(){
      if(!getKey()){ st.needKey = true; paint(); return; }
      st.loading = true; st.error = ""; paint();
      try{
        const json = await call("getPayoutLedger");
        if(json && json.badKey){ clearKey(); st.needKey = true; st.error = json.error || "Wrong payout password."; }
        else if(json && json.success){ st.groups = json.groups || []; st.needKey = false; }
        else st.error = (json && json.error) || "Couldn't load payouts.";
      }catch(e){ st.error = "Couldn't reach the server. Check your connection and try again."; }
      st.loading = false; paint();
    }
    async function mark(g, sent, date){
      const prev = { paid:g.paid, paidDate:g.paidDate };
      g.paid = sent; g.paidDate = sent ? (date || today()) : ""; paint();
      try{
        const json = await call("setPayoutSent", { sessionId:g.sessionId, author:g.author, sent:sent, date:g.paidDate });
        if(!json || !json.success) throw new Error((json && json.error) || "save failed");
        g.paidDate = json.paidDate || g.paidDate;
      }catch(e){ g.paid = prev.paid; g.paidDate = prev.paidDate; alert("Couldn't save that. Please try again."); }
      paint();
    }

    const btn = (label, primary, onclick) => {
      const b = document.createElement("button");
      b.textContent = label; b.onclick = onclick;
      b.style.cssText = "font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:8px 16px;cursor:pointer;border:1.5px solid " + (primary ? T.accent : T.border) + ";background:" + (primary ? T.accent : "transparent") + ";color:" + (primary ? "#fff" : T.text) + ";";
      return b;
    };

    function paint(){
      root.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.style.cssText = "color:" + T.text + ";";
      root.appendChild(wrap);

      if(st.needKey){
        wrap.innerHTML = '<div style="font-size:14px;margin-bottom:10px;">Enter your payout password to see presale payouts.</div>'
          + (st.error ? '<div style="color:#b00020;font-size:13px;margin-bottom:8px;">' + esc(st.error) + '</div>' : "");
        const inp = document.createElement("input");
        inp.type = "password"; inp.placeholder = "Payout password";
        inp.style.cssText = "font:inherit;font-size:16px;padding:10px;border:1.5px solid " + T.border + ";border-radius:8px;width:100%;box-sizing:border-box;margin-bottom:10px;background:transparent;color:" + T.text + ";";
        wrap.appendChild(inp);
        const go = () => { const v = inp.value.trim(); if(!v) return; setKey(v); st.error = ""; load(); };
        inp.onkeydown = e => { if(e.key === "Enter") go(); };
        wrap.appendChild(btn("Unlock", true, go));
        return;
      }

      const top = document.createElement("div");
      top.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;";
      top.appendChild(btn(st.loading ? "Refreshing…" : "Refresh", false, load));
      wrap.appendChild(top);

      if(st.error){ const e = document.createElement("div"); e.style.cssText = "color:#b00020;font-size:13px;margin-bottom:10px;"; e.textContent = st.error; wrap.appendChild(e); }
      if(st.groups === null){ if(!st.loading){ const d = document.createElement("div"); d.textContent = "Loading…"; wrap.appendChild(d); } return; }

      const send = st.groups.filter(g => g.method === "manual" && !g.paid);
      const sentList = st.groups.filter(g => (g.method === "manual" || g.method === "issue") && g.paid);
      const stripe = st.groups.filter(g => g.method === "stripe");
      const issues = st.groups.filter(g => g.method === "issue" && !g.paid);
      const refundedG = st.groups.filter(g => g.method === "refunded");
      const tabs = [["send","To send (" + send.length + ")"],["sent","Sent (" + sentList.length + ")"],["stripe","Paid via Stripe (" + stripe.length + ")"]];
      if(issues.length) tabs.push(["issue","Needs attention (" + issues.length + ")"]);
      const tabRow = document.createElement("div");
      tabRow.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;";
      tabs.forEach(([id,label]) => tabRow.appendChild(btn(label, st.filter === id, () => { st.filter = id; paint(); })));
      wrap.appendChild(tabRow);

      let list = st.filter === "sent" ? sentList : st.filter === "stripe" ? stripe : st.filter === "issue" ? issues : st.filter === "refunded" ? refundedG : send;
      if(st.filter === "refunded"){
        const n = document.createElement("div");
        n.style.cssText = "font-size:12.5px;color:" + T.muted + ";margin-bottom:10px;";
        n.textContent = "These orders were refunded. Nothing is owed. If a payment already went to the author, reverse that transfer in Stripe.";
        wrap.appendChild(n);
      }

      if(st.filter === "send" && send.length){
        const by = {};
        send.forEach(g => { const a = by[g.author] || (by[g.author] = { n:0, total:0, venmo:g.venmo, pref:g.authorPref }); a.n++; a.total += g.net; });
        const box = document.createElement("div");
        box.style.cssText = "background:" + T.soft + ";border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;";
        box.innerHTML = '<div style="font-weight:700;margin-bottom:4px;">You owe, by author</div>'
          + Object.keys(by).sort().map(a => '<div>' + esc(a) + ' — <b>' + money(by[a].total) + '</b> (' + by[a].n + ' order' + (by[a].n===1?"":"s") + ')'
            + (by[a].venmo ? ' · Venmo ' + esc(by[a].venmo) : ' · <span style="color:' + T.warn + ';">no Venmo name on file</span>') + '</div>').join("");
        wrap.appendChild(box);
      }
      if(st.filter === "stripe"){
        const n = document.createElement("div");
        n.style.cssText = "font-size:12.5px;color:" + T.muted + ";margin-bottom:10px;";
        n.textContent = "These were sent to the author's Stripe account automatically. Nothing to do.";
        wrap.appendChild(n);
      }
      if(!list.length){
        const e = document.createElement("div");
        e.style.cssText = "color:" + T.muted + ";font-size:14px;padding:14px 0;";
        e.textContent = st.filter === "send" ? "Nothing waiting on you right now." : "Nothing here yet.";
        wrap.appendChild(e); return;
      }

      list.forEach(g => {
        const c = document.createElement("div");
        c.style.cssText = "border:1px solid " + T.border + ";border-radius:12px;padding:12px 14px;margin-bottom:10px;";
        const books = g.books.map(b => esc(b.title) + (b.signed ? " · signed" : "") + (b.personalizedName ? " · personalized to " + esc(b.personalizedName) : "") + " — " + money(b.price)).join("<br>");
        c.innerHTML =
          '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;"><b>' + esc(g.author) + (g.method === "refunded" ? ' <span style="background:#b00020;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:999px;">REFUNDED</span>' : '') + '</b><span style="color:' + T.muted + ';font-size:12.5px;">' + esc(prettyDate(g.createdAt)) + '</span></div>'
          + '<div style="font-size:12.5px;color:' + T.muted + ';margin:2px 0 8px;">Ordered by ' + esc(g.buyerName || "a reader") + '</div>'
          + '<div style="font-size:13.5px;line-height:1.5;margin-bottom:8px;">' + books + '</div>'
          + '<table style="font-size:13px;border-collapse:collapse;"><tbody>'
          + '<tr><td style="padding:1px 14px 1px 0;">Subtotal</td><td style="text-align:right;">' + money(g.subtotal) + '</td></tr>'
          + '<tr><td style="padding:1px 14px 1px 0;">Tax collected</td><td style="text-align:right;">' + money(g.tax) + '</td></tr>'
          + '<tr><td style="padding:1px 14px 1px 0;">Stripe fee (their share)</td><td style="text-align:right;">-' + money(g.feeShare) + '</td></tr>'
          + '<tr><td style="padding:1px 14px 1px 0;"><b>' + (g.method === "stripe" ? "Sent to Stripe" : "Send to author") + '</b></td><td style="text-align:right;"><b>' + money(g.net) + '</b></td></tr>'
          + '</tbody></table>';
        if(g.method === "manual" || g.method === "issue"){
          const info = document.createElement("div");
          info.style.cssText = "font-size:13px;margin-top:8px;";
          info.innerHTML = g.venmo ? 'Venmo: <b>' + esc(g.venmo) + '</b>' : '<span style="color:' + T.warn + ';">No Venmo name on file for this author yet.</span>';
          if(g.method === "issue") info.innerHTML += '<div style="color:#b00020;margin-top:4px;">Stripe transfer problem: ' + esc(g.transferStatus) + '. You can pay this one by Venmo and check it off.</div>';
          c.appendChild(info);
          const row = document.createElement("label");
          row.style.cssText = "display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer;flex-wrap:wrap;";
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = !!g.paid; cb.style.cssText = "width:22px;height:22px;accent-color:" + T.accent + ";";
          cb.onchange = () => mark(g, cb.checked, g.paidDate || today());
          row.appendChild(cb);
          row.appendChild(document.createTextNode("Payment sent"));
          if(g.paid){
            const d = document.createElement("input");
            d.type = "date"; d.value = g.paidDate || today();
            d.style.cssText = "font:inherit;font-size:14px;padding:4px 8px;border:1px solid " + T.border + ";border-radius:8px;background:transparent;color:" + T.text + ";";
            d.onclick = e => e.stopPropagation();
            d.onchange = () => mark(g, true, d.value);
            row.appendChild(d);
          }
          c.appendChild(row);
        }
        wrap.appendChild(c);
      });
    }

    paint();
    if(getKey()) load();
    return { reload: load };
  }
  return { mount: mount };
})();

function sortAuthorsList(list){
  const real = [], tbd = [];
  list.forEach(n=>{
    const name = (n||"").trim();
    if(!name) return;
    if(/^Author TBD/i.test(name)) tbd.push(name);
    else real.push(name);
  });
  real.sort((a,b) => a.split(/\s+/).pop().localeCompare(b.split(/\s+/).pop()));
  const renumberedTbd = tbd.map((_,i) => `Author TBD ${i+1}`);
  return [...real, ...renumberedTbd];
}

  const listRes = await localCache.list("bss2027:", true);

function isFieldFilled(key, type){
  // headshotUploadedAt/logoUploadedAt only ever exist in memory for the
  // session that did the upload — they're never actually saved to the
  // sheet. The Url field is what's really persisted, so that's the
  // reliable signal after a reload; UploadedAt is kept as a same-session
  // fallback in case the Url hasn't round-tripped through a save yet.
  if(type === "file") return !!(currentData[key + "Url"] || currentData[key + "UploadedAt"]);
  const v = currentData[key];
  return v !== undefined && v !== null && String(v).trim() !== "";
}

function donatedEntries_(){
  if(Array.isArray(currentData.donatedBooksList) && currentData.donatedBooksList.length){
    return currentData.donatedBooksList.filter(e => e && e.title && String(e.title).trim());
  }
  if(Array.isArray(currentData.donatedTitlesList)){
    return currentData.donatedTitlesList.filter(t => t && String(t).trim()).map(t => ({title:String(t).trim(), qty:1}));
  }
  return [];
}
function donatedTitlesFilled(){
  return donatedEntries_().length > 0;
}
function donatedTitlesText(){
  return donatedEntries_().map(e=>{
    const q = parseInt(e.qty,10);
    return String(e.title).trim() + (q > 1 ? " (x" + q + ")" : "");
  }).join("\n");
}
function sellingTitlesFilled(){
  return Array.isArray(currentData.sellingTitlesList) && currentData.sellingTitlesList.some(t => t && t.trim() !== "");
}
function sellingTitlesText(){
  if(!Array.isArray(currentData.sellingTitlesList)) return "";
  return currentData.sellingTitlesList.filter(t => t && t.trim() !== "").join("\n");
}

function preorderBooksText(){
  if(!Array.isArray(currentData.preorderBooksList)) return "";
  return currentData.preorderBooksList.filter(b => b && b.title && b.title.trim() !== "").map(b => b.title).join("\n");
}

function truncatePreview(str, max){
  if(!str) return "";
  str = String(str).trim();
  return str.length > max ? str.slice(0, max).trim() + "\u2026" : str;
}

  // reflects whether that specific field has been filled in.
  const linksAllDone = d.linksListStatus === "That is all the links I will be adding (will mark this completed on your To-Do list)";
  sections.push({
    title: "Links",
    note: "(optional \u2014 shared with all attendees)",
    // Everything shows as compact pills: filled-in links with a check, and links
    // still to add (author said "I'll come back", or hasn't addressed it yet and
    // hasn't said "that's all"). "I don't have this" links are left off.
    pillsLabel: "Added",
    pills: linkFields.filter(([key]) => isFieldFilled(key)).map(([key,label]) => ({ label, target:"links", scrollToKey:key })),
    pills2Label: "Still to add",
    pills2: linkFields.filter(([key]) => !isFieldFilled(key) && (linkStatusOf(key) === "later" || (linkStatusOf(key) !== "none" && !linksAllDone)))
      .map(([key,label]) => ({ label, target:"links", scrollToKey:key })),
    rows: []
  });

  // ---- Selling Books at the Soirée ----
  const sellingLabels = {
    "I plan to sell books at the Soirée": "yes",
    "I won't be selling books at the Soirée": "no",
    "Haven't decided yet": "undecided"
  };
  const isUndecidedSelling = d.sellingPlan === "Haven't decided yet";
  sections.push({
    title: "Selling Books at the Soirée",
    rows: [
      isUndecidedSelling
        ? {label:"Selling Books at the Soirée", done:false, tentative:true, preview:"undecided (please finish updating by Feb 1)", target:"book-signing-plan", addLabel:"Decide"}
        : {label:"Selling Books at the Soirée", preview: d.sellingPlan ? sellingLabels[d.sellingPlan] : null,
           done:isFieldFilled("sellingPlan"), required:true, target:"book-signing-plan"}
    ]
  });

  // ---- Books You Will Sell at the Soirée (only if they're selling — and
  // required once they've said yes, since we need the actual titles list). ----
  if(d.sellingPlan === "I plan to sell books at the Soirée"){
    const hasSellingTitles = sellingTitlesFilled();
    let sellRow;
    if(hasSellingTitles && d.sellingListStatus === "tentative"){
      sellRow = {label:"Books you will sell at the Soirée", done:true, tentative:true, required:true, target:"books-selling", preview:"Make final edits by Feb 1."};
    } else {
      sellRow = {label:"Titles list", preview: hasSellingTitles ? truncatePreview(sellingTitlesText().replace(/\n/g," / "), 60) : null,
        done:hasSellingTitles, required:true, target:"books-selling", addLabel:"None listed"};
    }
    sections.push({ title:"Books You Will Sell at the Soirée", rows:[sellRow] });
  }

  // ---- Preorder plan ----
  const preorderLabels = { "Yes":"presale books", "No":"no presale books." };
  sections.push({
    title: "Presale Books for the Soirée",
    rows: [
      (d.preorderPlan === "I'm on the fence, and I'm going to think about it" || d.preorderPlan === "I'm not sure. Give me more information.")
        ? {label:"Decide about presale books", preview:"still thinking about it", done:false, required:true, target:"preorder-plan", addLabel:"Need to decide"}
        : {label:"Your plan", preview: d.preorderPlan ? preorderLabels[d.preorderPlan] : null,
           done:isFieldFilled("preorderPlan"), required:false, target:"preorder-plan"}
    ]
  });

  // ---- Preorder Books list (only if they said yes — required once they
  // have, since attendees need at least one listed book). ----
  if(d.preorderPlan === "Yes"){
    const hasPreorderBooks = Array.isArray(d.preorderBooksList) && d.preorderBooksList.some(b => b && b.title && b.title.trim());
    const row = {label:"Presale Books", preview: hasPreorderBooks ? preorderBooksText().replace(/\n/g," / ") : null,
      done: d.preorderBooksListStatus === "complete", required:true, target:"preorder-books", addLabel:"Need to add"};
    const rows = [
      {label:"Getting paid for your presale books", preview: (d.stripeOnboardingStatus === "complete" || (d.payoutMethod === "venmo" && (d.venmoHandle||"").trim())) ? "all set" : null,
       done: d.stripeOnboardingStatus === "complete" || (d.payoutMethod === "venmo" && !!(d.venmoHandle||"").trim()), required:true, target:"preorder-payouts", addLabel:"Need to set up"},
      row
    ];

    // Per-book required fields: title, cover, and regular price. Only
    // flagged for books that at least have a title (so a fully-blank
    // leftover entry doesn't show up as three separate to-dos).
    (d.preorderBooksList || []).forEach(b=>{
      if(!b || !b.title || !b.title.trim()) return;
      const missing = [];
      if(!bookHasCover(b)) missing.push("cover");
      if(!bookHasAllPrices(b)) missing.push("price");
      if(b.swagPack === "Yes" && !(parseFloat(b.swagPrice) > 0)) missing.push("swag pack price");
      if(missing.length){
        rows.push({
          label: `"${truncatePreview(b.title, 30)}" is missing ${missing.length>1 ? "a " : "a "}${missing.join(" and ")}`,
          done:false, required:true, target:"preorder-books"
        });
      }
    });

    sections.push({ title:"Presale Books", rows });
  } else if(d.preorderPlan === "No"){
    sections.push({
      title: "Presale Books",
      rows: [ {label:"Presale books", done:false, declined:true, declinedText:"you chose no presale"} ]
    });
  }

  // ---- Swag ----
  const swagLabels = { "I'd love to get some of my swag in the totes!":"yes", "I'll pass on adding swag to the totes.":"no" };
  sections.push({
    title: "Swag",
    rows: [
      {label:"Swag", preview: d.swagPlan ? swagLabels[d.swagPlan] : null,
       done:isFieldFilled("swagPlan"), required:true, target:"swag", addLabel:"Need to select"}
    ]
  });

  // ---- Prizes ----
  const prizesLabels = { "I'd love to donate some prizes!":"yes", "I'll pass on donating prizes.":"no" };
  sections.push({
    title: "Prizes",
    rows: [
      {label:"Prizes", preview: d.prizesPlan ? prizesLabels[d.prizesPlan] : null,
       done:isFieldFilled("prizesPlan"), required:true, target:"prizes", addLabel:"Need to select"}
    ]
  });

  // ---- Donated Books (only if they opted in — and required once they've
  // said yes, since we need to know what they're donating). ----
  const wantsDonate = d.prizesPlan === "I'd love to donate some prizes!";
  const declinedDonate = d.prizesPlan === "I'll pass on donating prizes.";
  if(wantsDonate || declinedDonate){
    let row;
    if(declinedDonate){
      row = {label:"Donated books", done:false, declined:true, declinedText:"You chose to not donate books for prizes"};
    } else {
      const hasTitles = donatedTitlesFilled();
      const hasCount = isFieldFilled("donatedCount");
      if(hasTitles && d.donationListStatus === "tentative"){
        row = {label:"Prizes you are donating", done:true, tentative:true, required:true, target:"donation-titles", preview:"Make final edits by Mar 1."};
      } else if(hasTitles){
        row = {label:"Donated books", preview: truncatePreview(donatedTitlesText().replace(/\n/g," / "), 60), done:true, required:true, target:"donation-titles"};
      } else if(hasCount){
        row = {label:"Prizes you are donating", done:false, tentative:true, required:true, target:"donation-titles", preview: "You're donating " + truncatePreview(d.donatedCount, 20) + " \u2014 please choose which by Mar 1."};
      } else {
        row = {label:"Donated books", done:false, required:true, target:"donation-knowledge", addLabel:"Have not added"};
      }
    }
    sections.push({ title:"Donated Books", rows:[row] });
  }

  // ---- Drop-off method (only relevant once swag/prizes has been decided) ----
  const dropoffRelevant = d.swagPlan === "I'd love to get some of my swag in the totes!" || d.prizesPlan === "I'd love to donate some prizes!";
  if(dropoffRelevant){
    const dropoffPreviewLabels = {
      "Take it to Lynette": "Drop off to Lynette",
      "Take it to Nicole": "Drop off to Nicole",
      "Mail it to Nicole": "Mail to Nicole"
    };
    sections.push({
      title: "Getting My Book &/or Swag to You",
      rows: [
        {label:"Drop-off/mailing method", preview: d.dropoffMethod ? (dropoffPreviewLabels[d.dropoffMethod] || truncatePreview(d.dropoffMethod,50)) : null,
         done:isFieldFilled("dropoffMethod"), required:true, target:"dropoff", addLabel:"Need to select"}
      ]
    });
  }

  return sections;
}

function renderChecklistRow(container, row){
  const el = document.createElement('div');
  el.className = "checklist-row" + (row.done ? " done" : "") + (row.declined ? " declined" : "") + (row.tentative ? " tentative" : "");

  const left = document.createElement('div');
  left.style.cssText = "display:flex;align-items:center;gap:12px;flex:1;min-width:0;";

  const icon = document.createElement('span');
  icon.className = "checklist-icon " + (row.tentative ? "tentative" : row.done ? "done" : row.declined ? "declined" : "todo");
  icon.textContent = row.tentative ? "\u26A0" : row.done ? "\u2713" : row.declined ? "\u2715" : "";
  left.appendChild(icon);

  const labelWrap = document.createElement('span');
  labelWrap.className = "checklist-label";
  const labelSpan = document.createElement('span');
  labelSpan.textContent = row.label + (row.required ? " *" : "");
  labelWrap.appendChild(labelSpan);
  if(row.preview){
    const prev = document.createElement('span');
    prev.className = "preview";
    prev.textContent = "  \u2014 " + row.preview;
    labelWrap.appendChild(prev);
  }
  if(row.declined && row.declinedText){
    const prev = document.createElement('span');
    prev.className = "preview";
    prev.textContent = "  \u2014 " + row.declinedText;
    labelWrap.appendChild(prev);
  }
  left.appendChild(labelWrap);
  el.appendChild(left);

  if(!row.done && !row.declined && row.target){
    const btn = document.createElement('button');
    btn.className = "checklist-add-btn";
    btn.textContent = row.addLabel || "Add";
    btn.onclick = (e) => { e.stopPropagation(); goToSectionFromChecklist(row.target, row.scrollToKey); };
    el.appendChild(btn);
    el.style.cursor = "pointer";
    el.onclick = () => goToSectionFromChecklist(row.target, row.scrollToKey);
  } else if(!row.done && row.declined && row.target){
    const btn = document.createElement('button');
    btn.className = "checklist-add-btn";
    btn.textContent = row.addLabel || "Decide";
    btn.onclick = (e) => { e.stopPropagation(); goToSectionFromChecklist(row.target, row.scrollToKey); };
    el.appendChild(btn);
    el.style.cursor = "pointer";
    el.onclick = () => goToSectionFromChecklist(row.target, row.scrollToKey);
  } else if(row.done && row.showEditWhenDone && row.target){
    const btn = document.createElement('button');
    btn.className = "checklist-edit-btn";
    btn.textContent = "Edit";
    btn.onclick = (e) => { e.stopPropagation(); goToSectionFromChecklist(row.target, row.scrollToKey); };
    el.appendChild(btn);
    el.style.cursor = "pointer";
    el.onclick = () => goToSectionFromChecklist(row.target, row.scrollToKey);
  } else if(row.done && row.target){
    el.style.cursor = "pointer";
    el.onclick = () => goToSectionFromChecklist(row.target, row.scrollToKey);
  }

  container.appendChild(el);
}

function renderWhatsLeft(){
  cameFromWhatsLeft = false;
  cameFromNavSubmenu = false;
  app.appendChild(logoLockup());
  const card = document.createElement('div');
  card.className = "card";
  card.innerHTML = `
    <div class="eyebrow">Quick Check</div>
    <h1 class="section-title">My To-Do List</h1>
    <div class="section-sub">Tap "Add" (or any row) to jump straight there.</div>
  `;

  const sections = computeChecklist();

  // Required-tasks summary, counted only from rows actually shown below.
  let requiredTotal = 0, requiredDone = 0;
  sections.forEach(s => s.rows.forEach(r => {
    if(r.required){ requiredTotal++; if(r.done) requiredDone++; }
  }));
  const summary = document.createElement('div');
  summary.className = "checklist-summary";
  summary.innerHTML = `You've completed <span class="count">${requiredDone} of ${requiredTotal}</span> required tasks.<br>Only items marked with an * are required.`;
  card.appendChild(summary);

  const toggleBtn = document.createElement('button');
  toggleBtn.className = "btn btn-secondary btn-tiny";
  toggleBtn.style.marginBottom = "18px";
  toggleBtn.textContent = todoShowOnlyOpen ? "Show all items" : "Show all open items";
  toggleBtn.onclick = () => { todoShowOnlyOpen = !todoShowOnlyOpen; render(); };
  card.appendChild(toggleBtn);

  // ---- Presale books still waiting to be signed (personalized ones are signed too) ----
  function buildSignBlock(){
    const st = presaleOrdersState;
    if(st.lines === null && !st.error && !window.__todoOrdersLoading){
      window.__todoOrdersLoading = true;
      loadPresaleOrders().then(() => { window.__todoOrdersLoading = false; if(currentScreen === "whats-left") render(); });
    }
    if(!st.lines || !st.lines.length) return null;
    const esc = t => String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const toSign = st.lines.filter(l => l.signed && !String(l.personalizedName || "").trim() && !l.signedDone);
    const toPers = st.lines.filter(l => String(l.personalizedName || "").trim() && !l.personalizedDone);
    if(!toSign.length && !toPers.length) return null;
    const g = document.createElement('div');
    g.style.cssText = "padding:12px 2px 4px;border-top:1px solid rgba(12,30,61,0.08);margin-top:6px;";
    const counts = {};
    toSign.forEach(l => { const k = l.title + "||"; counts[k] = (counts[k] || 0) + 1; });
    toPers.forEach(l => { const k = l.title + "||" + l.personalizedName.trim(); counts[k] = (counts[k] || 0) + 1; });
    let html = `<div style="font-weight:700;margin-bottom:4px;">Books that need to be signed (${toSign.length + toPers.length})</div>`;
    Object.keys(counts).sort((x,y)=>x.localeCompare(y)).forEach(k => {
      const parts = k.split("||");
      html += `<div style="font-size:14px;margin:2px 0;">${esc(parts[0])}${parts[1] ? ` <span style="opacity:.7;">\u2014 personalized for ${esc(parts[1])}</span>` : ""}${counts[k] > 1 ? ` <span style="opacity:.7;">\u00d7 ${counts[k]}</span>` : ""}</div>`;
    });
    g.innerHTML = html;
    const go = document.createElement('button');
    go.type = "button";
    go.className = "btn btn-secondary btn-compact";
    go.style.cssText = "margin-top:10px;";
    go.textContent = "Go to my presale orders";
    go.onclick = () => { st.sort = toSign.length ? "signed" : "personalized"; currentScreen = "presale-orders"; render(); };
    g.appendChild(go);
    return g;
  }

  sections.forEach(section => {
    const rows = todoShowOnlyOpen ? section.rows.filter(r => !r.done) : section.rows;
    const pills = (!todoShowOnlyOpen && section.pills) ? section.pills : [];
    const pills2 = section.pills2 || [];
    const extra = section.title === "Presale Books" ? buildSignBlock() : null;
    if(!rows.length && !pills.length && !pills2.length && !extra) return;
    const wrap = document.createElement('div');
    wrap.className = "checklist-section";
    const title = document.createElement('div');
    title.className = "checklist-section-title";
    title.innerHTML = `<span>${section.title}</span>` + (section.note ? `<span class="note">${section.note}</span>` : "");
    wrap.appendChild(title);
    if(pills.length){
      const pw = document.createElement('div');
      pw.style.cssText = "display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 2px;";
      const lab = document.createElement('span');
      lab.style.cssText = "font-size:13px;font-weight:700;opacity:.75;";
      lab.textContent = (section.pillsLabel || "Done") + ":";
      pw.appendChild(lab);
      pills.forEach(pl => {
        const b = document.createElement('button');
        b.type = "button";
        b.textContent = "\u2713 " + pl.label;
        b.style.cssText = "border:1px solid rgba(12,30,61,0.2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer;color:inherit;";
        b.onclick = () => goToSectionFromChecklist(pl.target, pl.scrollToKey);
        pw.appendChild(b);
      });
      wrap.appendChild(pw);
    }
    if(pills2.length){
      const pw2 = document.createElement('div');
      pw2.style.cssText = "display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 2px;";
      const lab2 = document.createElement('span');
      lab2.style.cssText = "font-size:13px;font-weight:700;opacity:.75;";
      lab2.textContent = (section.pills2Label || "To do") + ":";
      pw2.appendChild(lab2);
      pills2.forEach(pl => {
        const b = document.createElement('button');
        b.type = "button";
        b.textContent = pl.label;
        b.style.cssText = "border:1px dashed var(--terracotta,#E4593F);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer;color:inherit;";
        b.onclick = () => goToSectionFromChecklist(pl.target, pl.scrollToKey);
        pw2.appendChild(b);
      });
      wrap.appendChild(pw2);
    }
    rows.forEach(row => renderChecklistRow(wrap, row));
    if(extra) wrap.appendChild(extra);
    card.appendChild(wrap);
  });

  const link = document.createElement('div');
  link.className = "home-link";
  link.textContent = "Return to home";
  link.onclick = () => { currentScreen = "home"; render(); };
  card.appendChild(link);
  appendMainScreenLink(card);
  app.appendChild(card);
}
